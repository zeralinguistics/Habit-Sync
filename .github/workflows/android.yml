name: android
# Builds the Android app (the web app inside a native shell that can read Samsung Health through Health Connect)
# and publishes the APK to a release called "android-latest" so it can be downloaded on the phone.
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-babbage-2ak77i, main]
    paths: ['prototype/**', 'app/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - name: Bundle the web app
        run: python3 prototype/build.py --native app/www
      - name: Install plugins and sync
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PhsVersionCode=${{ github.run_number }} -PhsVersionName=0.5.${{ github.run_number }} --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
      - name: Show what went wrong
        if: failure()
        run: |
          grep -n -B3 -A30 "What went wrong" gradle.log | head -150 || true
          grep -n "error:\|Error:\|FAILED" gradle.log | head -40 || true
      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/*.apk out/habit-sync.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: habit-sync-apk
          path: out/habit-sync.apk
      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Habit Sync for Android (latest build)
          body: |
            Latest build of the Android app. Download habit-sync.apk on your phone and open it.
            Every build uses the same signing key, so it installs over the previous one and keeps your data.
          prerelease: true
          files: out/habit-sync.apk
