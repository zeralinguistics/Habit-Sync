name: ci
on:
  push:
    paths: ['prototype/**', '.github/workflows/ci.yml']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end checks
        run: node prototype/test/e2e.js /tmp/
