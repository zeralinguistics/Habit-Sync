<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Habit Sync</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="burst" aria-hidden="true"></canvas>
<div class="app">
  <div class="strip"><span>[ SYSTEM ]</span><button id="sndBtn" data-a="sound" aria-label="Toggle sound"></button></div>
  <main class="screen" id="screen"></main>
</div>
<nav class="dock" id="dock" role="tablist" aria-label="Main">
  <i class="dind" id="dockInd"></i>
  <button role="tab" data-a="tab:home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>Quests</span></button>
  <button role="tab" data-a="tab:armory" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a8 8 0 0 1 16 0v5H4z"/><path d="M4 14h16M12 6v8M8 19v-5M16 19v-5"/></svg><span>Armory</span></button>
  <button role="tab" data-a="tab:path" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 16c0-7 12-3 12-8"/></svg><span>Path</span></button>
  <button role="tab" data-a="tab:forge" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Forge</span></button>
</nav>
<div id="scrim" data-a="close"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="shh"><h2 id="shT"></h2><button class="x" data-a="close" aria-label="Close">&times;</button></div>
  <div id="shBody"></div>
  <div id="shFoot"></div>
</div>
<div id="sys" role="status" aria-live="polite"><b>[SYSTEM]</b><span id="sysT"></span></div>
<div id="ov" data-a="ovClose" role="dialog" aria-live="polite"><div class="ovb" id="ovb"></div></div>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/figures.js"></script>

<script>HS.ui.boot();</script>
