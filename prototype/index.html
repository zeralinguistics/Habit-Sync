<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Habit Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap">
<style>
/* Layout: a "System" HUD. Player window on top, daily quests as a list, every logging task opens a full-height window. */
:root{
  --bg:#05070d; --panel:rgba(9,17,36,.88); --panel2:#0d1a33; --line:#1d4d7e; --glow:#3aa8ff; --glow-d:#1b6fb8;
  --fg:#dff0ff; --mute:#8aa5c2; --violet:#8b5cff; --red:#ff4d5e; --red-d:#8f1f2c; --green:#3ddc97; --gold:#f5c451;
  --display:'Rajdhani','Arial Narrow',system-ui,sans-serif;
  --body:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--body);overflow-x:hidden;overscroll-behavior:none;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(58,168,255,.16),transparent 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.strip{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;font:700 13px var(--display);letter-spacing:.24em;color:var(--glow)}
.strip button{background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:36px;color:var(--glow);display:grid;place-items:center}
.strip button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip button.off{color:var(--mute)}
.screen{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.tabbar{display:flex;border-top:1px solid var(--line);background:rgba(5,7,13,.96)}
.tab{flex:1;background:none;border:0;padding:14px 8px;font:700 15px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--glow);text-shadow:0 0 12px rgba(58,168,255,.7)}

/* system window */
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 0 22px rgba(58,168,255,.14),inset 0 0 30px rgba(58,168,255,.05);margin-bottom:14px}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.wt{padding:10px 14px 8px;font:700 14px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--glow);border-bottom:1px solid rgba(58,168,255,.18)}
.wb{padding:14px}

/* player */
.player{display:flex;gap:14px;padding:14px;align-items:center}
.emb{position:relative;width:78px;height:86px;flex:none;display:grid;place-items:center}
.emb svg{position:absolute;inset:0;width:100%;height:100%}
.emb b{position:relative;font:700 44px var(--display);text-shadow:0 0 16px currentColor}
.pi{flex:1;min-width:0}
.pn{font:700 22px var(--display);letter-spacing:.14em}
.pn small{font-size:15px;color:var(--glow);margin-left:8px;letter-spacing:.12em}
.xp{height:8px;background:var(--panel2);border-radius:2px;margin-top:6px;overflow:hidden;border:1px solid rgba(58,168,255,.25)}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow-d),var(--glow));box-shadow:0 0 10px var(--glow);transition:width .9s cubic-bezier(.2,.9,.2,1)}
.xpt{font-size:12px;color:var(--mute);margin-top:4px;letter-spacing:.06em}
.stats{display:flex;gap:10px;margin-top:8px;font:700 13px var(--display);letter-spacing:.1em;color:var(--mute)}
.stats span b{color:var(--fg);margin-left:3px}

/* rings */
.ringrow{display:flex;align-items:center;gap:16px;padding:14px}
.rings{position:relative;width:128px;height:128px;flex:none}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--panel2);stroke-width:9}
.arc{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.2,1),stroke .4s;filter:drop-shadow(0 0 4px currentColor)}
.arc.k{stroke:var(--glow);color:var(--glow)} .arc.k.over{stroke:var(--red);color:var(--red)}
.arc.p{stroke:var(--violet);color:var(--violet)} .arc.p.full{stroke:var(--green);color:var(--green)}
.rings.pulse{animation:pulse .7s ease-out}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.rc span{font:600 10px var(--display);letter-spacing:.18em;color:var(--mute);margin-top:2px}
.rl{flex:1;min-width:0;font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.rl b{color:var(--fg);font:700 18px var(--display);letter-spacing:.04em}
.rl .k{color:var(--glow)} .rl .p{color:var(--violet)}
.rl small{font-size:12px}

/* quests */
.qrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:transparent;border:0;border-top:1px solid rgba(58,168,255,.14);text-align:left;position:relative}
.qrow:first-of-type{border-top:0}
.qrow:active{background:rgba(58,168,255,.1)}
.qic{width:42px;height:42px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--glow);flex:none;background:rgba(58,168,255,.06)}
.qic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qm{flex:1;min-width:0;display:block}
.qt{display:block;font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
.qs{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr{font:700 15px var(--display);color:var(--gold);letter-spacing:.06em;flex:none}
.qrow.done .qic{background:var(--glow);color:#02101f;border-color:var(--glow);box-shadow:0 0 14px rgba(58,168,255,.6)}
.qrow.done .qt{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(138,165,194,.5)}
.qrow.done .qr{color:var(--glow)}
.qrow.miss .qic{background:var(--red-d);border-color:var(--red);color:#fff}
.qrow.miss .qr{color:var(--red)}
.qrow.late,.qrow.skip{opacity:.6}
.qrow.next{background:linear-gradient(90deg,rgba(58,168,255,.2),rgba(58,168,255,.02));animation:nextglow 2s ease-in-out infinite}
.qrow.next .qic{border-color:var(--glow);box-shadow:0 0 14px rgba(58,168,255,.55)}
.qrow.next .qr::before{content:"\25B6";color:var(--glow);margin-right:8px;display:inline-block;animation:nudge 1s ease-in-out infinite}
.qrow.just .qic{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.link{background:none;border:0;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:12px;display:block;margin:0 auto}

/* buttons */
.btn{display:block;width:100%;border:1px solid var(--glow);border-radius:6px;padding:15px;background:linear-gradient(180deg,rgba(58,168,255,.28),rgba(58,168,255,.12));color:var(--fg);font:700 18px var(--display);letter-spacing:.2em;text-transform:uppercase;box-shadow:0 0 18px rgba(58,168,255,.25);transition:transform .08s}
.btn:active{transform:scale(.98);background:rgba(58,168,255,.4)}
.btn.good{border-color:var(--green);background:linear-gradient(180deg,rgba(61,220,151,.26),rgba(61,220,151,.1));box-shadow:0 0 18px rgba(61,220,151,.22)}
.btn.vio{border-color:var(--violet);background:linear-gradient(180deg,rgba(139,92,255,.3),rgba(139,92,255,.1));box-shadow:0 0 18px rgba(139,92,255,.25)}
.btn.ghost{border-color:var(--line);background:var(--panel2);box-shadow:none}
.btn.bad{border-color:var(--red-d);background:transparent;color:var(--red);box-shadow:none}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92%;display:flex;flex-direction:column;background:#070d1c;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 40px rgba(58,168,255,.18);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.full{height:calc(100% - 12px);max-height:none}
#sheet.on{transform:none}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;gap:10px}
.shh h2{margin:0;font:700 22px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--glow)}
.x{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:22px;line-height:1;color:var(--mute)}
#shBody{overflow-y:auto;padding:4px 16px 14px;flex:1;min-height:0}
#shBody.col{display:flex;flex-direction:column;overflow:hidden;padding:0}
#shFoot{padding:10px 16px 14px;border-top:1px solid rgba(58,168,255,.2);display:flex;flex-direction:column;gap:8px}
.hint{color:var(--mute);font-size:14px;margin:2px 0 12px}
.sec{font:700 13px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.warn{background:rgba(255,77,94,.1);border:1px solid var(--red-d);border-radius:6px;padding:12px;font-size:14px;margin-top:12px}
.note{background:var(--panel2);border:1px solid rgba(58,168,255,.2);border-radius:6px;padding:12px;font-size:14px;color:var(--mute);margin-top:12px}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;min-height:46px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 15px var(--body)}
.seg button[aria-pressed="true"]{border-color:var(--glow);background:rgba(58,168,255,.2);color:var(--fg);box-shadow:0 0 12px rgba(58,168,255,.3)}
.seg button[aria-pressed="true"].sharp{border-color:var(--red);background:rgba(255,77,94,.2)}
.stp{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(58,168,255,.14)}
.stp span small{display:block;color:var(--mute);font-size:12px}
.stp .c{display:flex;align-items:center;gap:8px}
.stp .c button{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.stp .c i{font:700 22px var(--display);font-style:normal;min-width:44px;text-align:center}
.est{margin-top:14px;text-align:center;font:700 26px var(--display);letter-spacing:.06em;color:var(--gold)}
.est small{display:block;font:400 12px var(--body);color:var(--mute);letter-spacing:0;margin-top:2px}
.wnum{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}
.wnum input{width:170px;text-align:center;height:84px;border:0;background:transparent;color:var(--fg);font:700 66px var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(58,168,255,.5)}
.wnum button{width:54px;height:54px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:26px}
.q{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(58,168,255,.14);font-weight:600}
.q span:last-child{font:700 17px var(--display);letter-spacing:.06em}
.q .ok{color:var(--green)} .q .no{color:var(--mute)}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;background:none;border:0;border-bottom:1px solid rgba(58,168,255,.14);text-align:left}
.chk i{width:28px;height:28px;border:1.5px solid var(--line);border-radius:5px;flex:none;display:grid;place-items:center;font-style:normal;color:transparent}
.chk[aria-pressed="true"] i{background:var(--glow);border-color:var(--glow);color:#02101f;box-shadow:0 0 10px rgba(58,168,255,.6)}
.chk span{flex:1;min-width:0}
.chk small{display:block;color:var(--mute);font-size:12px}
.chk.skipd span{text-decoration:line-through;color:var(--mute)}
.rng{width:100%;margin:8px 0 2px;accent-color:var(--glow)}
.rngl{display:flex;justify-content:space-between;font:600 14px var(--display);letter-spacing:.12em;color:var(--mute)}
.rngl b{color:var(--fg);font-size:18px}
.tg{display:flex;gap:6px;margin-top:8px}
.tg button{flex:1;min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--body)}
.tg button[aria-pressed="true"]{border-color:var(--glow);background:rgba(58,168,255,.2)}
textarea.ta{width:100%;min-height:240px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:12px;font:400 13px/1.5 var(--body);resize:vertical}

/* plate (food log) */
.pl{display:flex;flex-direction:column;flex:1;min-height:0}
.ptop{padding:2px 16px 8px}
.ptot{display:flex;justify-content:space-between;align-items:baseline}
.ptot b{font:700 24px var(--display);letter-spacing:.04em}
.ptot span{color:var(--violet);font:600 15px var(--display);letter-spacing:.06em}
.pbars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pbars div{height:6px;background:var(--panel2);border-radius:2px;overflow:hidden}
.pbars i{display:block;height:100%;width:0;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.pbars .a i{background:var(--glow);box-shadow:0 0 8px var(--glow)} .pbars .b i{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.plate{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;min-height:52px;align-items:center}
.plate::-webkit-scrollbar{display:none}
.plate .empty{color:var(--mute);font-size:14px}
.pc{flex:none;min-height:40px;padding:8px 12px;border-radius:6px;border:1px solid var(--glow);background:rgba(58,168,255,.14);font-weight:600;font-size:14px;white-space:nowrap}
.pc small{color:var(--mute);margin-left:6px;font-weight:500}
.pc.sel{background:rgba(58,168,255,.4);box-shadow:0 0 12px rgba(58,168,255,.5)}
.ed{margin:0 16px 8px;padding:12px;border:1px solid var(--glow);border-radius:6px;background:rgba(58,168,255,.08)}
.edh{display:flex;justify-content:space-between;align-items:center;font:700 17px var(--display);letter-spacing:.1em;text-transform:uppercase}
.edh button{background:none;border:0;color:var(--mute);font-size:22px;width:44px;height:36px}
.edr{display:flex;align-items:center;gap:8px;margin-top:6px}
.edr button{width:46px;height:46px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.edr input{flex:1;min-width:0;height:46px;text-align:center;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:700 22px var(--display)}
.edr span{color:var(--mute)}
.edq{display:flex;gap:6px;margin-top:8px}
.edq button{flex:1;height:42px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--body)}
.edq .del{border-color:var(--red-d);color:var(--red)}
.edi{margin-top:8px;color:var(--mute);font-size:13px}
.inrow{display:flex;gap:8px;padding:0 16px}
.inrow input{flex:1;min-width:0;height:48px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:400 16px var(--body)}
.inrow button{width:72px;border-radius:6px;border:1px solid var(--glow);background:rgba(58,168,255,.25);font:700 16px var(--display);letter-spacing:.14em}
.sug{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none;min-height:0}
.sug::-webkit-scrollbar{display:none}
.rows{flex:1;min-height:0;overflow-y:auto;padding:6px 0 10px}
.rl2{margin-top:8px}
.rt{font:700 12px var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);padding:0 16px 5px}
.rt.pick{color:var(--gold)}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;scroll-snap-align:start;width:118px;min-height:64px;padding:8px 10px;text-align:left;border-radius:6px;border:1px solid var(--line);background:var(--panel2);transition:transform .08s,border-color .15s}
.tile:active{transform:scale(.94);border-color:var(--glow)}
.tile .tn{display:-webkit-box;font:600 14px/1.15 var(--body);overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .tk{display:block;margin-top:3px;font-size:11px;color:var(--mute)}
.tile.hp{border-color:#5a46b0}
.tile.pickt{border-color:var(--gold);box-shadow:0 0 12px rgba(245,196,81,.25)}
.tile.trt{border-style:dashed;border-color:#7a4352}
.tile b{position:absolute;top:-7px;right:-4px;background:var(--glow);color:#02101f;border-radius:8px;min-width:22px;height:22px;padding:0 6px;font:700 14px/22px var(--display);text-align:center}

/* status */
.statrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.statrow b{font:700 15px var(--display);letter-spacing:.14em;width:44px}
.statrow .bar{flex:1;height:8px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid rgba(58,168,255,.2)}
.statrow .bar i{display:block;height:100%;background:var(--glow);box-shadow:0 0 8px var(--glow)}
.statrow span{font:700 18px var(--display);width:36px;text-align:right}
.gates{display:flex;flex-wrap:wrap;gap:8px}
.gate{flex:1 0 21%;min-width:64px;text-align:center;padding:10px 0;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:700 16px var(--display);letter-spacing:.04em;color:var(--mute)}
.gate.got{border-color:var(--glow);color:var(--fg);background:rgba(58,168,255,.25);box-shadow:0 0 12px rgba(58,168,255,.45)}
.gate.next{border-color:var(--gold);color:var(--gold);animation:nextglow 2s ease-in-out infinite}
.boss{flex:1 0 100%;text-align:center;padding:10px 0;border-radius:6px;border:1px dashed var(--violet);font:700 15px var(--display);letter-spacing:.18em;color:var(--violet)}
.bignum{font:700 64px/1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(58,168,255,.5)}
.bignum small{font-size:22px;color:var(--mute);margin-left:6px;letter-spacing:.08em}
.small{color:var(--mute);font-size:13px;margin-top:10px}
.week{display:flex;gap:8px}
.week div{flex:1;text-align:center;font:700 12px var(--display);letter-spacing:.1em;color:var(--mute)}
.week i{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px}
.week i.on{background:var(--glow);box-shadow:0 0 10px var(--glow)} .week i.half{background:var(--glow-d)} .week i.today{border-color:var(--gold)}
.pbarch{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:10px}
.pbarch div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.pbarch i{flex:1;display:block;border-radius:2px 2px 0 0;min-height:2px}
.pbarch .kn{background:var(--glow)} .pbarch .bk{background:var(--violet)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.field{display:flex;gap:8px;margin-top:8px}
.field input{flex:1;min-width:0;height:46px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:400 17px var(--body)}
.field button{padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-weight:600;min-height:46px}
.foot{text-align:center;color:#5d708a;font-size:12px;padding:0 16px}

/* system messages */
#sys{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:456px;margin:0 auto;background:rgba(6,14,32,.96);border:1px solid var(--glow);border-radius:4px;padding:10px 14px;box-shadow:0 0 24px rgba(58,168,255,.5);transform:translateY(-120%);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.9,.2,1);z-index:90;font-size:15px}

function burnEst(kg,lift,walkMin,runMin){
  const m=v=>v*1000/60;

  const lifting=3.5*kg*(lift/60);
  return Math.round(walk+run+lifting);

  return out.sort((a,b)=>b.s-a.s).map(o=>o.f);

function parsePart(p){
  p=p.trim();if(!p)return null;
  let g=null,units=null,kc=null,tn=null;
  const m=p.match(/(\d+(?:\.\d+)?)\s*(kg|gms|gm|grams|gram|g)\b/i);
  if(m){g=parseFloat(m[1])*(m[2].toLowerCase()==='kg'?1000:1);p=p.replace(m[0],' ')}
  const k=p.match(/(\d{2,4})\s*(?:kcal|cal)\b/i);
  if(k){kc=+k[1];p=p.replace(k[0],' ')}
  p=p.replace(/\bof\b/i,' ').replace(/\s+/g,' ').trim();
  if(g===null&&kc===null){
    const n=p.match(/^(\d+(?:\.\d+)?|half|one|two|three|four|five)\s*(?:x\s*)?(.*)$/i);
    if(n&&n[2]){units=isNaN(n[1])?NUMW[n[1].toLowerCase()]:parseFloat(n[1]);p=n[2]}
    else{const t=p.match(/^(.*?)\s+(\d{2,4})$/);if(t){tn=+t[2];p=t[1]}}
  }
  return{name:p.trim(),g:g,units:units,kc:kc,tn:tn};
}

let ac=null,tSys,tOv;
function ensureAC(){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
document.addEventListener('pointerdown',ensureAC,{passive:true});
function tone(seq,type,vol){
  if(!S.sound)return;ensureAC();if(!ac)return;
  try{let t=ac.currentTime+.01;seq.forEach(a=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=a[0];
    g.gain.setValueAtTime(vol||.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+a[1]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+a[1]+.02);t+=a[1]*.8})}catch(e){}
}
const SFX={
  tap:()=>tone([[900,.04]],'sine',.05),
  add:()=>tone([[660,.05],[990,.08]],'triangle',.07),
  sys:()=>tone([[1175,.09],[1568,.14]],'sine',.08),
  quest:()=>tone([[784,.1],[988,.1],[1319,.22]],'triangle',.09),
  level:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.5]],'square',.05),
  warn:()=>tone([[196,.2],[147,.34]],'sawtooth',.06)
};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p||12)}catch(e){}}
function sys(msg,kind){
  const e=$('#sys');$('#sysT').textContent=msg;e.className='show '+(kind||'');
  (kind==='bad'?SFX.warn:kind==='good'?SFX.quest:SFX.sys)();
  clearTimeout(tSys);tSys=setTimeout(()=>{e.className=''},4200);
}
function overlay(kind,h,big,p){
  const o=$('#ov');$('#ovH').textContent=h;$('#ovBig').textContent=big||'';$('#ovP').textContent=p||'';
  o.className='on '+(kind||'');clearTimeout(tOv);tOv=setTimeout(()=>{o.className=''},2600);
}
function auraPop(n){const e=document.createElement('div');e.className='apop '+(n<0?'neg':'pos');e.textContent=(n>0?'+':'−')+Math.abs(n)+' AURA';document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function addAura(n){
  const before=lv(),d=dayObj(),real=Math.max(-S.aura,n);
  S.aura+=real;d.delta+=real;
  if(real!==0)auraPop(real);
  const after=lv();
  if(after.L>before.L){
    buzz([60,40,60,40,140]);SFX.level();
    if(after.rank!==before.rank)setTimeout(()=>overlay('','RANK UP','RANK '+after.rank,'ARISE.'),300);
    else setTimeout(()=>overlay('','LEVEL UP','LV '+after.L,'Stat power increased.'),300);
  }
  if(real<0)SFX.warn();
}

const hhmm=m=>{const h=Math.floor(m/60),mm=m%60,ap=h>=12?'pm':'am';return ((h+11)%12+1)+(mm?':'+String(mm).padStart(2,'0'):'')+ap};
function mealNow(){const t=nowMin();return t>=360&&t<660?'breakfast':t>=660&&t<960?'lunch':t>=1140&&t<1440?'dinner':'snack'}
function gymQ(d,plan){
  if(plan==='Rest')return{id:'gym',ic:'moon',st:'done',t:'Rest day',s:'Recovery counts',r:''};
  if(d.workout==='done')return{id:'gym',ic:'check',st:'done',t:plan+' day',s:'Done'+(d.burn?' · ~'+fmt(d.burn)+' kcal burned':''),r:'+100'};
  if(d.workout==='pain')return{id:'gym',ic:'check',st:'done',t:plan+' day',s:'Pain day, no penalty',r:''};
  if(d.workout==='lazy')return{id:'gym',ic:'x',st:'miss',t:plan+' day',s:'Skipped',r:'−60'};
  return{id:'gym',ic:'gym',st:'todo',t:'Train: '+plan,s:'Gym',r:'+100'};
}
function rehabQ(d){
  const r=d.reh;
  if(r&&r.done)return{id:'rehab',ic:'check',st:'done',t:'Rehab',s:r.n+' exercises logged',r:'+'+Math.min(80,r.n*10)};
  return{id:'rehab',ic:'rehab',st:'todo',t:'Rehab',s:'Physio plan · '+RDAYS[S.rehab.next].t.split(':')[0],r:'+10 each'};
}
function quests(){
  const d=dayObj(),plan=planFor(),t=nowMin(),tot=totals(d),out=[];
  out.push(d.weighed?{id:'weigh',ic:'scale',st:'done',t:'Weigh-in',s:S.weights[dkey()].toFixed(1)+' kg',r:'+15'}:{id:'weigh',ic:'scale',st:'todo',t:'Weigh-in',s:'Before food',r:'+15'});
  MEALS.forEach(m=>{
    const k=mealKcal(d,m),n=d.items.filter(i=>i.meal===m).length,w=WIN[m];
    const q={id:m,ic:'plate',t:cap(m),r:''};
    if(d.done[m])Object.assign(q,{st:'done',s:fmt(k)+' kcal'});
    else if(d.skip[m])Object.assign(q,{st:'skip',s:'Skipped',ic:'dash'});
    else if(!n&&t>w[1]+120)Object.assign(q,{st:'late',s:'Window missed',ic:'dash'});
    else Object.assign(q,{st:'todo',s:n?fmt(k)+' kcal so far':hhmm(w[0])+' to '+hhmm(w[1])});
    if(m==='dinner')out.push(gymQ(d,plan),rehabQ(d));
    out.push(q);
  });
  out.push(d.pAward?{id:'protein',ic:'prot',st:'done',t:'Protein '+T.protein+' g',s:Math.round(tot.p)+' g locked in',r:'+60'}:{id:'protein',ic:'prot',st:'prog',t:'Protein '+T.protein+' g',s:Math.round(tot.p)+' of '+T.protein+' g',r:'+60'});
  out.push(d.closed?{id:'close',ic:'moon',st:'done',t:'Clear the day',s:d.score+' of 4 quests',r:(d.delta>=0?'+':'−')+Math.abs(d.delta)}:{id:'close',ic:'moon',st:'todo',t:'Clear the day',s:'Final tally',r:'+80'});
  return out;
}

function openNode(id){
  if(id==='weigh')return weighSheet();
  if(MEALS.includes(id))return plateSheet(id);
  if(id==='protein')return plateSheet(mealNow());
  if(id==='gym')return gymSheet();
  if(id==='rehab')return rehabSheet();
  return closeSheet2();
}

/* ---- plate: full-height food log with horizontal tile rows, gram editor, typed input ---- */
function picks(meal){
  const d=dayObj(),t=totals(d),rK=T.kcal-t.k;
  if(t.p>=T.protein)return[];
  return poolFor(meal).map(food).filter(f=>f&&!f.sugar&&!f.out&&f.p>=10&&f.kcal<=Math.max(150,rK*.5)).sort((a,b)=>b.p/b.kcal-a.p/a.kcal).slice(0,3).map(f=>f.name);
}
function plateSheet(meal){
  sh={type:'plate',meal:meal,edit:-1};
  openSheet(meal==='snack'?'Snack':cap(meal),
    `<div class="pl">
      <div class="ptop"><div class="ptot"><b id="pK">0 kcal</b><span id="pP">0 g protein</span></div>
        <div class="pbars"><div class="a"><i id="bK"></i></div><div class="b"><i id="bP"></i></div></div></div>
      <div class="plate" id="plate"></div><div id="ed"></div>
      <div class="inrow"><input id="mIn" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="none" aria-label="Type what you ate" placeholder="Type: 2 chapati, rice 200g, shake 400"><button data-a="mAdd">ADD</button></div>
      <div class="sug" id="mSug"></div>
      <div class="rows" id="rows"></div></div>`,
    `<button class="btn" data-a="mealDone">Done</button><button class="link" data-a="mealSkip" id="mSkip">Skip this meal</button>`,{full:true,col:true});
  $('#mSkip').hidden=meal==='snack';
  drawRows();drawPlate();drawTotals();
}
const unitsOf=(f,g)=>Math.round(g/f.ug*10)/10;
function drawPlate(){
  const d=dayObj(),items=d.items.map((it,ix)=>({it:it,ix:ix})).filter(o=>o.it.meal===sh.meal);
  $('#plate').innerHTML=items.length?items.map(o=>`<button class="pc${sh.edit===o.ix?' sel':''}" data-a="edit:${o.ix}">${esc(o.it.name)}<small>${Math.round(o.it.g)} g</small></button>`).join(''):'<span class="empty">Your plate is empty. Tap a tile or type below.</span>';

      <div class="edi" id="edI"></div></div>`;

function drawEdInfo(){

}
function drawTotals(){
  const d=dayObj(),meal=sh.meal,tot=totals(d);let mp=0;
  d.items.forEach(i=>{if(i.meal===meal){mp+=nut(food(i.name),i.g).p}});

function tileHtml(name,cls){
  const f=food(name);if(!f)return'';
  const d=dayObj(),g=d.items.filter(i=>i.name===name&&i.meal===sh.meal).reduce((a,i)=>a+i.g,0);

  return `<button class="tile ${cls||''}${f.p>=12?' hp':''}" data-a="add:${esc(name)}"><span class="tn">${esc(name)}</span><span class="tk">${f.kcal} kcal · ${esc(lab)}</span>${g?`<b>${unitsOf(f,g)}</b>`:''}</button>`;

function drawRows(){
  const meal=sh.meal,pool=poolFor(meal).map(food).filter(Boolean);
  const by=c=>pool.filter(f=>f.cat===c).sort((a,b)=>b.p-a.p).map(f=>f.name);
  const pk=picks(meal),treats=Array.from(new Set(by('treat').concat(OUTSIDE)));
  const row=(t,names,cls,tc)=>names.length?`<div class="rl2"><div class="rt ${tc||''}">${t}</div><div class="tiles">${names.map(n=>tileHtml(n,cls)).join('')}</div></div>`:'';
  $('#rows').innerHTML=row('★ System picks for your remaining macros',pk,'pickt','pick')+row('Protein',by('protein'))+row('Carbs',by('carb'))+row('Sides and veg',by('side'))+row('Treats and outside (sugar costs aura)',treats,'trt');

function checkProtein(){
  const d=dayObj();if(d.pAward)return;
  if(totals(d).p>=T.protein){d.pAward=true;addAura(60);stat('VIT',2);pulse=true;buzz([20,30,40]);sys('Protein target reached. Quest complete.','good')}
}
function applyAdd(name,grams,meal){
  const f=food(name);if(!f)return false;
  const d=dayObj(),g=grams||f.ug;
  const ex=d.items.find(i=>i.name===name&&i.meal===meal);
  if(ex)ex.g=Math.round((ex.g+g)*10)/10;else d.items.push({name:name,meal:meal,g:g});
  buzz(10);SFX.add();
  const k=nut(f,g).k;
  if(f.sugar){const pen=Math.min(10,20-d.sugarPen);if(pen>0){d.sugarPen+=pen;addAura(-pen)}
    sys('Warning: sugar detected. '+f.name+' is '+Math.round(k)+' kcal, '+Math.round(k/T.kcal*100)+'% of today.','bad')}
  else if(f.out)sys(f.name+': '+Math.round(k)+' kcal, '+Math.round(k/T.kcal*100)+'% of today.','');
  save();checkProtein();return true;
}
function addTyped(){
  const inp=$('#mIn'),txt=inp.value.trim();if(!txt)return;
  const miss=[];
  txt.split(/,|\+|\band\b/i).forEach(p=>{
    const r=parsePart(p);if(!r||!r.name)return;
    const hit=scoreFoods(r.name,sh.meal)[0];
    if(hit){applyAdd(hit.name,r.g!=null?r.g:r.units!=null?r.units*hit.ug:r.tn!=null?r.tn:null,sh.meal);return}
    const kc=r.kc!=null?r.kc:r.tn;
    if(kc){const nm=r.name;S.custom[nm]={name:nm,kcal:kc,p:0,unit:'serving',sugar:false,out:true,ug:100,k100:kc,p100:0,cat:'treat',custom:true};applyAdd(nm,r.g!=null?r.g:100,sh.meal);return}
    miss.push(r.name);
  });
  inp.value='';$('#mSug').innerHTML='';
  if(miss.length)sys('Not found: '+miss.join(', ')+'. Add a number, like "momos 350".','bad');
  drawRows();drawPlate();drawTotals();
}

/* ---- workout ---- */
let gymStep='choose',gymTmp=null;
function gymSheet(){
  const d=dayObj();
  sh={type:'gym'};
  gymStep=d.workout==='done'?'pain':'choose';
  gymTmp={lift:(d.mins&&d.mins.lift)||TREAD.lift,walk:(d.mins&&d.mins.walk)||TREAD.walk.min,run:(d.mins&&d.mins.run)||TREAD.run.min,free:d.runFree!=null?d.runFree:3};
  renderGym();
}
const seg=(g,opts,cur)=>`<div class="seg">${opts.map(o=>`<button data-a="${g}:${o[0]}" aria-pressed="${cur===o[0]}" class="${o[0]==='sharp'?'sharp':''}">${o[1]}</button>`).join('')}</div>`;
const stp=(k,label,sub,v)=>`<div class="stp"><span>${label}<small>${sub}</small></span><div class="c"><button data-a="st:${k}:-5" aria-label="Less ${label}">−</button><i>${v}</i><button data-a="st:${k}:5" aria-label="More ${label}">+</button></div></div>`;
const kgNow=()=>trendNow()||S.startW;
function renderGym(){
  const d=dayObj(),plan=planFor();
  if(plan==='Rest'){openSheet('Rest day','<div class="hint">Recovery is part of the plan. Do your rehab and walk.</div>'+seg('sess',[['Push','Push'],['Pull','Pull'],['Legs','Legs'],['Rest','Rest']],plan)+'<div class="small">Wrong day? Pick today\'s real session. The cycle follows from there.</div>','<button class="btn ghost" data-a="close">Got it</button>');return}
  if(gymStep==='details'){
    const est=burnEst(kgNow(),gymTmp.lift,gymTmp.walk,gymTmp.run);
    openSheet(plan+' report',
      '<div class="hint">Quick numbers for your burn estimate.</div>'+
      stp('lift','Lifting','minutes',gymTmp.lift)+
      stp('walk','Incline walk','5 km/h, 9% incline, minutes',gymTmp.walk)+
      stp('run','Run','9 km/h, minutes done',gymTmp.run)+
      stp('free','Run minutes before pain','0 if no pain at all',gymTmp.free)+
      `<div class="est">~${fmt(est)} kcal burned<small>Rough estimate, can be off by 30%. Info only: your calorie target already includes training, so do not eat it back.</small></div>`,
      '<button class="btn" data-a="gymNext">Next</button>');
    return;
  }
  if(gymStep==='pain'){
    const p=d.pain||{knee:'none',back:'none'};
    openSheet(plan+' done','<div class="hint">How did it feel? This goes in your pain log for the physio.</div>'+
      '<div class="sec">Right knee</div>'+seg('pk',[['none','None'],['mild','Mild'],['sharp','Sharp']],p.knee)+
      '<div class="sec">Lower back</div>'+seg('pb',[['none','None'],['mild','Mild'],['sharp','Sharp']],p.back)+
      (p.knee==='sharp'||p.back==='sharp'?'<div class="warn">Sharp pain is a stop signal for that movement. Note which exercise caused it and tell your physio.</div>':''),
      '<button class="btn good" data-a="gymFinish">Finish</button>');
    return;
  }
  if(d.workout==='pain'||d.workout==='lazy'){openSheet(plan+(d.workout==='pain'?': pain day':': skipped'),'<div class="hint">'+(d.workout==='pain'?'No penalty. Tell your physio what hurt.':'Logged. Tomorrow you show up.')+'</div>','<button class="btn ghost" data-a="close">Close</button>');return}
  const capn=plan==='Legs'?'<div class="note">Your own cap: 30 to 40 kg on squats and deadlifts until your physio says otherwise.</div>':'';
  openSheet(plan+' day','<div class="hint">Did you train?</div>'+seg('sess',[['Push','Push'],['Pull','Pull'],['Legs','Legs'],['Rest','Rest']],plan)+capn+'<div class="small">Wrong session? Pick the right one. The cycle follows from there.</div>',
    '<button class="btn" data-a="gym:done">Done</button><button class="btn vio" data-a="gym:pain">Pain day, could not train</button><button class="btn bad" data-a="gym:lazy">Skipped</button>');
}

/* ---- rehab: transcribed from the physio plan, frozen until your physio confirms it ---- */
let rehTab=0;
function rehabSheet(){
  sh={type:'rehab'};const d=dayObj();
  if(!d.reh)d.reh={items:{},day:S.rehab.next,knee:0,back:0,sharp:false,done:false,n:0};
  rehTab=d.reh.day;renderRehab();
}
function renderRehab(){
  const d=dayObj(),r=d.reh;
  const chk=(key,t,s,skip)=>`<button class="chk${skip?' skipd':''}" data-a="rt:${esc(key)}" aria-pressed="${!!r.items[key]}"><i>✓</i><span>${esc(t)}<small>${esc(s)}${skip?' · skipped by you':''}</small></span></button>`;
  const day=RDAYS[rehTab];
  openSheet('Rehab',
    `<div class="warn" style="margin-top:0">This is your physio's written plan, from when you were 19. I have not changed it. Confirm it with your current physio before relying on it.</div>
     <button class="chk" data-a="rconf" aria-pressed="${S.rehab.confirmed}" style="margin-top:6px"><i>✓</i><span>My current physio confirmed this plan<small>Tick only after they have seen it</small></span></button>
     <div class="sec">Daily block</div>${BLOCK.map((b,i)=>chk('b'+i,b[0],b[1])).join('')}
     <div class="sec">Strength rotation</div>
     <div class="tg">${RDAYS.map((x,i)=>`<button data-a="rtab:${i}" aria-pressed="${rehTab===i}">Day ${i+1}</button>`).join('')}</div>
     <div class="hint" style="margin-top:10px">${esc(day.t)}${rehTab===1?'. "S/B" is as written in the plan; ask your physio what it stands for.':''}</div>
     ${day.x.map((x,i)=>chk('d'+rehTab+'_'+i,x[0],x[1],x[2])).join('')}
     <div class="note">Also in the plan: pain-free aerobic exercise for 30 minutes, 3 to 4 days a week, and change activities that aggravate pain.</div>
     <div class="sec">Check-in</div>
     <div class="rngl"><span>RIGHT KNEE</span><b id="kv">${r.knee}</b></div><input class="rng" id="kr" type="range" min="0" max="10" value="${r.knee}" aria-label="Right knee pain 0 to 10">
     <div class="rngl"><span>LOWER BACK</span><b id="bv">${r.back}</b></div><input class="rng" id="br" type="range" min="0" max="10" value="${r.back}" aria-label="Lower back pain 0 to 10">
     <div class="tg"><button data-a="rsharp" aria-pressed="${r.sharp}">Sharp pain on any exercise today</button></div>
     ${r.sharp?'<div class="warn">Stop that exercise. Write down which one and tell your physio.</div>':''}`,
    '<button class="btn good" data-a="rehabFinish">Finish rehab</button>');
}
function keepScroll(fn){const y=$('#shBody').scrollTop;fn();$('#shBody').scrollTop=y}
function skippedKey(key){const m=key.match(/^d(\d)_(\d+)$/);return !!(m&&RDAYS[+m[1]].x[+m[2]][2])}

/* ---- weigh-in ---- */
let wVal=84;
function weighSheet(){
  sh={type:'weigh'};
  const ks=Object.keys(S.weights).sort();wVal=S.weights[dkey()]||(ks.length?S.weights[ks[ks.length-1]]:S.startW);
  openSheet('Weigh-in','<div class="hint">Before food, after the toilet. Same scale every day.</div><div class="wnum"><button data-a="wd" aria-label="Down 0.1">−</button><input id="wIn" type="number" step="0.1" inputmode="decimal" value="'+wVal.toFixed(1)+'" aria-label="Weight in kg"><button data-a="wu" aria-label="Up 0.1">+</button></div><div class="note">One reading never moves your trend by more than a quarter. Water weight is noise.</div>','<button class="btn" data-a="wSave">Save</button>');
}

/* ---- clear the day ---- */
function closeSheet2(){
  sh={type:'close'};const d=dayObj(),plan=planFor();
  if(d.closed){openSheet('Day cleared','<div class="hint">'+d.score+' of 4 quests. Aura today: '+(d.delta>=0?'+':'−')+Math.abs(d.delta)+'.</div>','<button class="btn ghost" data-a="close">Close</button>');return}
  const open=quests().filter(q=>q.st==='todo'&&q.id!=='close'&&q.id!=='weigh'&&q.id!=='rehab').map(q=>q.id==='gym'?'Log your workout':'Log or skip '+q.id);
  if(open.length){openSheet('Not yet','<div class="hint">Finish these first, so the tally is honest.</div>'+open.map(o=>'<div class="q"><span>'+esc(o)+'</span><span class="no">OPEN</span></div>').join(''),'<button class="btn ghost" data-a="close">Back</button>');return}
  const tot=totals(d),calOk=tot.k>=T.lo&&tot.k<=T.hi,gymOk=plan==='Rest'||d.workout==='done'||d.workout==='pain',rehOk=!!(d.reh&&d.reh.done);
  const q=[['Protein '+T.protein+' g',d.pAward,Math.round(tot.p)+' g'],['Calories '+fmt(T.lo)+' to '+fmt(T.hi),calOk,fmt(tot.k)],['Workout',gymOk,plan==='Rest'?'Rest day':(d.workout==='done'?'Done':d.workout==='pain'?'Pain day':'Skipped')],['Rehab',rehOk,rehOk?'Done':'Missed']];
  openSheet('Clear the day','<div class="hint">Last look. Clearing adds your calorie reward.</div>'+q.map(x=>'<div class="q"><span>'+esc(x[0])+'</span><span class="'+(x[1]?'ok':'no')+'">'+(x[1]?'✓ ':'')+esc(x[2])+'</span></div>').join('')+(tot.k<T.lo?'<div class="note">Under '+fmt(T.lo)+' kcal does not count. Eating too little costs muscle. If you forgot to log something, go back and add it.</div>':''),
    '<button class="btn" data-a="lock">Clear it</button>');
}
function lockDay(){
  const d=dayObj(),plan=planFor(),tot=totals(d);
  if(d.closed)return;
  const calOk=tot.k>=T.lo&&tot.k<=T.hi,gymOk=plan==='Rest'||d.workout==='done'||d.workout==='pain',rehOk=!!(d.reh&&d.reh.done);
  d.closed=true;d.score=(d.pAward?1:0)+(calOk?1:0)+(gymOk?1:0)+(rehOk?1:0);
  if(calOk){addAura(80);stat('VIT',2)}
  save();justRow='close';buzz([30,40,60]);closeSheet();
  sys(d.score+' of 4 quests. '+(d.score>=3?'Day on track.':'Tomorrow, no excuses. Never miss twice.'),d.score>=3?'good':'');
}

/* ---- physio sheet: summary built only from your own logs ---- */
function physioText(){
  const pd=painDays(14),rd=pd.filter(x=>x.r),n=rd.length;
  const avg=k=>n?(rd.reduce((a,x)=>a+x.r[k],0)/n).toFixed(1):'no data';
  const sharp=rd.filter(x=>x.r.sharp).length;
  const runs=pd.filter(x=>x.run!=null).map(x=>x.run);
  const keys=Object.keys(S.days).filter(k=>daysBetween(k,dkey())<14);
  const gym=keys.filter(k=>S.days[k].workout==='done').length;
  const painGym=keys.filter(k=>S.days[k].pain&&(S.days[k].pain.knee==='sharp'||S.days[k].pain.back==='sharp')).length;
  return 'PHYSIO SHEET (self-logged, last 14 days)\n'+
   'Rehab check-ins: '+n+' of 14 days\nRight knee pain average: '+avg('knee')+' / 10\nLower back pain average: '+avg('back')+' / 10\nDays with sharp pain reported in rehab: '+sharp+'\n'+
   'Gym sessions logged: '+gym+', of which with sharp pain afterwards: '+painGym+'\n'+
   'Run minutes before knee pain (latest entries): '+(runs.length?runs.slice(-5).join(', '):'no data')+'\n'+
   'Self-set limit: 30 to 40 kg on squats and deadlifts\n\nQUESTIONS FOR YOU\n'+
   '1. Is the written plan (daily block, Day 1 to 3) still right for me now?\n2. How deep may I bend the knee under load?\n3. What squat and deadlift load is safe for now, and what is the rule for increasing it?\n'+
   '4. I feel knee pain after about 3 minutes of running at 9 km/h. Should I keep running?\n5. What exactly counts as a stop signal, and when should I come back for review?\n6. Should my right knee (ACL sprain on the 2024 note) be reassessed or re-imaged?\n7. What does "S/B" mean in my plan, and is Jefferson curl safe for me?';
}
function physioSheet(){
  sh={type:'physio'};
  openSheet('Physio sheet','<div class="hint">Built only from what you logged. Show it at your next visit.</div><textarea class="ta" id="phT" readonly aria-label="Physio sheet text">'+esc(physioText())+'</textarea>','<button class="btn" data-a="copy">Copy text</button>');
}

/* =====================================================================
   6. EVENTS
   ===================================================================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,k=a.split(':')[0],v=a.slice(a.indexOf(':')+1),d=dayObj();
  switch(k){
    case 'tab':tab=v;SFX.tap();render();break;
    case 'node':SFX.tap();openNode(v);break;
    case 'snack':SFX.tap();plateSheet('snack');break;
    case 'close':closeSheet();break;
    case 'ovClose':$('#ov').className='';break;
    case 'sound':S.sound=!S.sound;save();if(S.sound){ensureAC();SFX.sys()}render();break;
    /* plate */
    case 'add':applyAdd(v,null,sh.meal);drawRows();drawPlate();drawTotals();break;
    case 'mAdd':addTyped();break;
    case 'edit':sh.edit=(sh.edit===+v)?-1:+v;SFX.tap();drawPlate();break;
    case 'edClose':sh.edit=-1;drawPlate();break;
    case 'gm':{const it=d.items[sh.edit];if(it){it.g=Math.max(5,Math.round(it.g+ +v));save();checkProtein();drawPlate();drawRows();drawTotals()}break}
    case 'gx':{const it=d.items[sh.edit],f=it&&food(it.name);if(it){it.g=Math.round(f.ug*+v);save();checkProtein();drawPlate();drawRows();drawTotals()}break}
    case 'gdel':{const it=d.items[sh.edit];if(it){const f=food(it.name);if(f.sugar&&d.sugarPen>0){const r=Math.min(10,d.sugarPen);d.sugarPen-=r;S.aura+=r;d.delta+=r}d.items.splice(sh.edit,1);sh.edit=-1;save();drawPlate();drawRows();drawTotals()}break}
    case 'mealDone':{
      const m=sh.meal;if(m==='snack'){closeSheet();break}
      if(!d.items.some(i=>i.meal===m)){sys('Add something first, or skip the meal.','bad');break}
      d.done[m]=true;delete d.skip[m];stat('VIT',1);save();justRow=m;buzz([20,30,30]);SFX.quest();closeSheet();break}
    case 'mealSkip':{d.skip[sh.meal]=true;save();closeSheet();sys('Meal skipped. Your calories will show it.','');break}
    /* gym */
    case 'sess':setSession(v);save();gymStep='choose';renderGym();break;
    case 'gym':{
      const plan=planFor();
      if(v==='done'){
        if(d.workout!=='done'){const yk=dkey(new Date(Date.now()-864e5)),y=S.days[yk];
          addAura(100);stat('STR',3);if(y&&y.workout==='lazy'){addAura(40);sys('Comeback bonus. You showed up after a skip.','good')}}
        d.workout='done';save();justRow='gym';buzz([20,30,40]);SFX.quest();gymStep='details';renderGym();
      }else if(v==='pain'){d.workout='pain';stat('SNS',1);save();justRow='gym';closeSheet();sys('Smart call. Pain day, no penalty. Log what hurt and tell your physio.','')}
      else if(v==='lazy'){d.workout='lazy';addAura(-60);save();closeSheet();buzz([80,50,80]);overlay('bad','QUEST FAILED','−60','Skipped '+plan+'. Tomorrow you owe it.')}
      break}
    case 'st':{const parts=v.split(':'),key=parts[0],dl=+parts[1];gymTmp[key]=Math.max(0,gymTmp[key]+dl);SFX.tap();buzz(6);renderGym();break}
    case 'gymNext':{d.mins={lift:gymTmp.lift,walk:gymTmp.walk,run:gymTmp.run};d.burn=burnEst(kgNow(),gymTmp.lift,gymTmp.walk,gymTmp.run);d.runFree=gymTmp.free;
      stat('AGI',Math.floor((gymTmp.walk+gymTmp.run)/10));save();gymStep='pain';renderGym();break}
    case 'pk':case 'pb':{d.pain=d.pain||{knee:'none',back:'none'};if(k==='pk')d.pain.knee=v;else d.pain.back=v;save();renderGym();break}
    case 'gymFinish':{d.pain=d.pain||{knee:'none',back:'none'};save();closeSheet();break}
    /* rehab */
    case 'rt':{if(skippedKey(v))break;d.reh.items[v]=!d.reh.items[v];buzz(8);SFX.tap();save();keepScroll(renderRehab);break}
    case 'rtab':{rehTab=+v;keepScroll(renderRehab);break}
    case 'rconf':{S.rehab.confirmed=!S.rehab.confirmed;save();keepScroll(renderRehab);break}
    case 'rsharp':{d.reh.sharp=!d.reh.sharp;if(d.reh.sharp)SFX.warn();save();keepScroll(renderRehab);break}
    case 'rehabFinish':{
      const r=d.reh,n=Object.keys(r.items).filter(x=>r.items[x]).length;
      if(!n){sys('Tick at least one exercise, or close this window.','bad');break}
      if(!r.done){r.done=true;r.n=n;r.day=rehTab;addAura(Math.min(80,n*10));stat('SNS',2)}else{r.n=n}
      const day=RDAYS[rehTab],need=day.x.filter(x=>!x[2]).length,got=day.x.filter((x,i)=>!x[2]&&r.items['d'+rehTab+'_'+i]).length;
      if(got>=need)S.rehab.next=(rehTab+1)%3;
      save();justRow='rehab';closeSheet();sys('Rehab logged: '+n+' exercises.','good');break}
    /* weigh */
    case 'wd':case 'wu':{const i=$('#wIn');let x=parseFloat(i.value)||wVal;x=Math.round((x+(k==='wu'?.1:-.1))*10)/10;i.value=x.toFixed(1);buzz(6);SFX.tap();break}
    case 'wSave':{
      const x=parseFloat($('#wIn').value);if(!(x>30&&x<250)){sys('Enter your weight in kg.','bad');break}
      const first=!d.weighed;S.weights[dkey()]=Math.round(x*10)/10;d.weighed=true;
      if(first){addAura(15);stat('SNS',1)}
      const tr=trendNow();let cleared=null;
      LADDER.forEach(s=>{if(tr<=s+1e-6&&!S.gates.includes(s)){S.gates.push(s);addAura(150);cleared=s}});
      save();justRow='weigh';buzz([20,30,30]);closeSheet();
      if(cleared)setTimeout(()=>overlay('','GATE CLEARED',cleared+' kg','Weight trend broke through.'),400);
      else sys('Logged '+x.toFixed(1)+' kg. Trend '+tr.toFixed(1)+' kg.','');
      break}
    case 'lock':lockDay();break;
    case 'physio':physioSheet();break;
    case 'copy':{const t=$('#phT');t.select();let ok=false;try{ok=navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(err){}try{if(!ok)document.execCommand('copy')}catch(err){}sys('Copied. Paste it into a message to your physio.','good');break}
    case 'saveSteps':{const s=$('#stepsIn').value;d.steps=s;if(s&&!d.stepsAward){d.stepsAward=true;stat('AGI',1)}save();sys(s?'Steps saved: '+fmt(+s)+'.':'Cleared.','good');break}
    case 'reset':{
      if(b.dataset.armed){S=blank();save();tab='quests';render();sys('Prototype data cleared.','')}
      else{b.dataset.armed='1';b.textContent='Tap again to erase';b.style.color='var(--red)';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset data';b.style.color=''}},3000)}
      break}
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='mIn'&&sh){
    const last=e.target.value.split(/,|\+|\band\b/i).pop();
    const r=parsePart(last);const list=r&&r.name?scoreFoods(r.name,sh.meal).slice(0,6):[];
    $('#mSug').innerHTML=list.map(f=>`<button class="pc" data-a="sugadd:${esc(f.name)}">${esc(f.name)}<small>${f.kcal}</small></button>`).join('');
  }else if(id==='edG'&&sh){
    const it=dayObj().items[sh.edit];const g=parseFloat(e.target.value);
    if(it&&g>0){it.g=g;save();checkProtein();drawEdInfo();drawTotals();drawRows();
      const chip=document.querySelector('.pc.sel small');if(chip)chip.textContent=Math.round(g)+' g'}
  }else if(id==='kr'||id==='br'){
    const r=dayObj().reh;if(!r)return;
    if(id==='kr'){r.knee=+e.target.value;$('#kv').textContent=r.knee}else{r.back=+e.target.value;$('#bv').textContent=r.back}
    save();
  }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a^="sugadd:"]');if(!b||!sh)return;
  const name=b.dataset.a.slice(7),inp=$('#mIn');
  const parts=inp.value.split(/(,|\+|\band\b)/i);const lastRaw=parts.pop();const r=parsePart(lastRaw)||{};
  const f=food(name);
  applyAdd(name,r.g!=null?r.g:r.units!=null?r.units*f.ug:null,sh.meal);
  inp.value=parts.join('').replace(/[,+]\s*$/,'').trim();$('#mSug').innerHTML='';
  drawRows();drawPlate();drawTotals();inp.focus();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='mIn'){e.preventDefault();addTyped()}
  if(e.key==='Escape'&&sh)closeSheet();
});

/* hook for the automated checks */
window.HS={state:()=>S,burnEst:burnEst,parsePart:parsePart,lv:lv,totals:()=>totals(dayObj())};

render();
})();
</script>
