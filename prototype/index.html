<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Habit Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="burst" aria-hidden="true"></canvas>
<div class="app">
  <div class="strip"><span>[ SYSTEM ]</span><button id="sndBtn" data-a="sound" aria-label="Toggle sound"></button></div>
  <main class="screen" id="screen"></main>
</div>
<nav class="dock" id="dock" role="tablist" aria-label="Main">
  <i class="dind" id="dockInd"></i>
  <button role="tab" data-a="tab:home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Quests</span></button>
  <button role="tab" data-a="tab:hunter" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"/><path d="M9 12l2 2 4-4"/></svg><span>Hunter</span></button>
  <button role="tab" data-a="tab:settings" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Forge</span></button>
</nav>
<div id="scrim" data-a="close"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="shh"><h2 id="shT"></h2><button class="x" data-a="close" aria-label="Close">&times;</button></div>
  <div id="shBody"></div>
  <div id="shFoot"></div>
</div>
<div id="sys" role="status" aria-live="polite"><b>[SYSTEM]</b><span id="sysT"></span></div>
<div id="ov" data-a="ovClose"><div class="ovb"><h1 id="ovH"></h1><div class="big" id="ovBig"></div><p id="ovP"></p></div></div>
<script src="js/data.js"></script>
<script src="js/figures.js"></script>
<script src="js/engine.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-home.js"></script>
<script src="js/ui-sheets.js"></script>
<script>HS.ui.boot();</script>
</body>
</html>
