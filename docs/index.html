  return out;
};
E.progress=function(){
  const tr=E.trend(),total=S.startW-S.cfg.goalW,left=Math.max(0,tr-S.cfg.goalW);
  const pct=total>0?Math.max(0,Math.min(1,(S.startW-tr)/total)):0;
  const weeks=left/.5,eta=new Date();eta.setDate(eta.getDate()+Math.round(weeks*7));
  return{pct:pct,left:left,weeks:weeks,eta:eta,day:Math.max(1,E.daysBetween(S.start,dkey())+1)};
};
E.logWeight=function(x){
  const d=E.day(),first=!d.weighed;
  S.weights[dkey()]=Math.round(x*10)/10;d.weighed=true;
  if(first){E.addAura(15);E.stat('SNS',1)}
  const tr=E.trend(),all=[];
  /* gates are a high-water mark: only ground lower than anything cleared before pays, so changing the start weight or the gate size can never pay a gate twice */
  const lo=S.gates.length?Math.min.apply(null,S.gates):Infinity;
  E.ladder().forEach(g=>{
    if(tr>g.kg+1e-6||S.gates.includes(g.kg))return;
    S.gates.push(g.kg);S.gateDates[g.kg]=dkey();
    if(g.kg<lo-1e-6){E.addAura(150);all.push(g);if(E.onGate)E.onGate(g)}
  });
  /* several gates can fall at once (a big drop after a break): show the most important one, a boss first */
  const cleared=all.length?(all.find(g=>g.boss)||all[all.length-1]):null;
  E.save();E.emit('weigh',{kg:x,trend:tr});
  if(cleared)E.emit('gate',Object.assign({},cleared,{count:all.length}));
  return{trend:tr,cleared:cleared};
};

/* ---- aura, level, rank, stats ---- */
const LV=a=>Math.floor(Math.sqrt(Math.max(0,a)/200))+1;
const LVF=L=>200*(L-1)*(L-1);
const rankOf=L=>L>=61?'S':L>=41?'A':L>=26?'B':L>=16?'C':L>=8?'D':'E';
E.rankOf=rankOf;E.LVF=LVF;
E.lv=function(){
  const raw=LV(S.aura),locked=!!(S.fatigue&&S.fatigue.on&&raw>S.fatigue.lock),L=locked?S.fatigue.lock:raw;
  const a=LVF(L),b=LVF(L+1);
  return{L:L,raw:raw,locked:locked,rank:rankOf(L),pct:locked?1:(S.aura-a)/(b-a),have:Math.round(S.aura-a),need:b-a};
};
E.addAura=function(n){
  const before=E.lv(),d=E.day(),fat=S.fatigue&&S.fatigue.on;
  if(n>0&&fat)n=Math.floor(n/2);
  const real=Math.max(-S.aura,n);
  S.aura+=real;d.delta+=real;
  E.emit('aura',real);
  const after=E.lv();
  if(after.L>before.L)E.emit('level',{from:before,to:after,rankUp:after.rank!==before.rank});
  else if(after.locked&&real>0&&!before.locked)E.emit('locked',after);
  return real;
};
E.stat=function(k,n){S.stats[k]=Math.max(0,(S.stats[k]||0)+n);E.emit('stat',{k:k,n:n})};

/* ---- fatigue, penalties, rest pass (the real consequences) ---- */
E.fatigued=()=>!!(S.fatigue&&S.fatigue.on);
E.startFatigue=function(reason){
  if(E.fatigued())return;
  S.fatigue={on:true,lock:LV(S.aura),since:dkey(),reason:reason||'missed'};
  E.emit('fatigue',true);
};
E.clearFatigue=function(){
  if(!E.fatigued())return false;
  const before=E.lv();S.fatigue.on=false;const after=E.lv();
  E.emit('fatigue',false);
  if(after.L>before.L)E.emit('level',{from:before,to:after,rankUp:after.rank!==before.rank});
  return true;
};
const weekOf=k=>{const p=k.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()-(d.getDay()+6)%7);return dkey(d)};
E.passLeft=function(k){return!S.passUsed[k?weekOf(k):weekKey()]};
E.usePass=function(k){const w=k?weekOf(k):weekKey();if(S.passUsed[w])return false;S.passUsed[w]=1;if(w===weekKey())S.pass={wk:w,used:true};E.save();return true};
/* A skipped session without pain. Chill: aura only. Standard: aura plus fatigue (half aura, no level-ups until you train).
   Hard: bigger loss, a strength point, and a second miss in a row hits twice. */
E.penalty=function(why){
  const st=S.cfg.strict,base=st==='chill'?30:st==='hard'?100:60;let extra=0;
  E.addAura(-base);
  if(st!=='chill')E.startFatigue(why);
  if(st==='hard'){E.stat('STR',-1);if(S.missStreak>=1){E.addAura(-100);E.stat('STR',-2);extra=100}}
  S.missStreak=(S.missStreak||0)+1;
  E.save();
  E.emit('penalty',{base:base,extra:extra,strict:st,why:why,streak:S.missStreak});
};
/* a day is settled once: a second tap on any of these (or a different one right after) must not change it or cost anything twice */
E.skipWorkout=function(){const d=E.day();if(d.workout)return;d.workout='lazy';E.penalty('skipped');E.save()};
E.painDay=function(){const d=E.day();if(d.workout)return;d.workout='pain';E.stat('SNS',1);E.save()};
E.restPass=function(){const d=E.day();if(d.workout||!E.usePass())return false;d.workout='pass';E.save();return true};
/* On open: any planned session in the last 3 days with nothing logged is an absence. A rest pass covers one per week. */
E.sweep=function(){
  const out=[],chill=S.cfg.strict==='chill';let touched=false;
  for(let i=3;i>=1;i--){
    const dt=E.now();dt.setDate(dt.getDate()-i);const k=dkey(dt);
    if(k<=S.start||S.swept[k])continue;
    S.swept[k]=1;touched=true;
    if(chill)continue;   /* Chill never punishes an absence, but the day is still settled so switching to Standard later cannot punish it */
    if(E.planFor(k)==='Rest')continue;
    const d=S.days[k];if(d&&d.workout)continue;
    const dd=E.day(k);
    if(E.usePass(k)){dd.workout='pass';out.push({k:k,pass:true})}
    else{dd.workout='lazy';E.penalty('absent');out.push({k:k,pass:false})}
  }
  if(out.length)E.save();else if(touched)E.persist();
  return out;
};
E.contractMessage=function(why){
  const c=S.cfg;
  return (c.name||'I')+' here. I broke my own rule ('+why+'). My contract: '+(c.contract||'you pick my penalty')+'. Hold me to it.';
};

/* ---- workouts ---- */
E.routine=type=>S.routine[type]||[];
E.exState=function(ex){
  const d=E.day();d.lift=d.lift||{};
  if(!d.lift[ex.n]){
    const last=S.last[ex.n];
    d.lift[ex.n]={sets:Array.from({length:ex.sets},()=>({w:last?last.w:0,r:last?last.r:ex.reps,done:false})),pr:false};
  }
  const st=d.lift[ex.n];
  while(st.sets.length<ex.sets)st.sets.push({w:st.sets.length?st.sets[st.sets.length-1].w:0,r:ex.reps,done:false});
  return st;
};
E.liftProgress=function(plan){
  let done=0,total=0;
  E.routine(plan).forEach(ex=>{const st=E.exState(ex);st.sets.slice(0,ex.sets).forEach(s=>{total++;if(s.done)done++})});
  return{done:done,total:total};
};
E.setDone=function(ex,i,on){
  const st=E.exState(ex),s=st.sets[i];if(!s)return{};
  s.done=on;let pr=false;
  if(on){
    S.last[ex.n]={w:s.w,r:s.r};
    const e1=s.w*(1+s.r/30);
    if(s.w>0&&S.pr[ex.n]&&e1>S.pr[ex.n]*1.005&&!st.pr){pr=true;st.pr=true;S.counters.pr++;const wkk=E.weekKey();S.prWeeks[wkk]=(S.prWeeks[wkk]||0)+1;E.addAura(25);E.stat('STR',1)}
    if(s.w>0&&(!S.pr[ex.n]||e1>S.pr[ex.n]))S.pr[ex.n]=e1;
  }
  E.save();E.emit('set',{ex:ex,on:on,pr:pr,over:!!(ex.cap&&s.w>HS.CAP_KG)});
  return{pr:pr};
};
E.completeWorkout=function(plan){
  const d=E.day(),p=E.liftProgress(plan),frac=p.total?Math.min(1,p.done/p.total/.8):1;
  const comeback=E.clearFatigue();if(comeback)S.counters.comeback++;
  const award=Math.round(100*frac);
  d.workout='done';
  E.addAura(award);E.stat('STR',3);
  if(comeback)E.addAura(40);
  S.missStreak=0;
  E.save();E.emit('workout',{award:award,comeback:comeback,done:p.done,total:p.total});
  return{award:award,comeback:comeback};
};
/* calories burned: net of resting, ACSM treadmill equations; lifting at about 4.5 MET. Information only. */
E.burnEst=function(kg,lift,walkMin,runMin){
  const m=v=>v*1000/60,wk=(0.1*m(5)+1.8*m(5)*.09)*kg/1000*5*walkMin,rn=(0.2*m(9))*kg/1000*5*runMin,lf=3.5*kg*(lift/60);
  return Math.round(wk+rn+lf);
};

/* ---- rehab and pain ---- */
E.painDays=function(n){
  const out=[];
  for(let i=n-1;i>=0;i--){const x=E.now();x.setDate(x.getDate()-i);const k=dkey(x),d=S.days[k];out.push({k:k,r:d&&E.checkedIn(d.reh)?d.reh:null,run:d&&d.runFree!=null&&d.workout==='done'?d.runFree:null,d:d})}
  return out;
};
/* proposed pain traffic light, to be confirmed by the physio: green 0-3, amber 4-5, red 6+ or any sharp pain */
/* a rehab record counts as a pain check-in only when the player really entered something. A finished session with untouched sliders is not "green". */
E.checkedIn=r=>!!r&&(r.checked===true||r.knee>0||r.back>0||!!r.sharp||(r.checked===undefined&&!!r.done));
E.light=function(r){if(!r)return null;const m=Math.max(r.knee,r.back);return r.sharp||m>=6?'red':m>=4?'amber':'green'};
E.exportJSON=()=>JSON.stringify(S,null,1);
})();

</script>
<script>
/* engine-plus.js: the long game. Streaks, unlocks, short-term goals, the campaign plan to the goal weight, camp weeks,
   weekly report, rehab schedule, water and sleep, the daily chest, and the data vault (backup, restore, compaction). No DOM here. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E,dkey=E.dkey;
const S=()=>E.S();
const addDays=E.addDays=function(k,n){const p=k.split('-').map(Number);const t=new Date(Date.UTC(p[0],p[1]-1,p[2])+n*864e5);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0')};
const keyOffset=n=>addDays(dkey(),n);
E.keyOffset=keyOffset;

/* ======================== streaks ======================== */
function dayPred(kind,d,k){
  const plan=E.planFor(k);
  switch(kind){
    case 'protein':return d&&d.pAward?1:0;
    case 'weigh':return d&&d.weighed?1:0;
    case 'log':return d&&Object.keys(d.done||{}).length>=2?1:0;
    case 'water':return d&&d.waterHit?1:0;
    case 'rehab':return d&&d.reh&&d.reh.done?1:0;
    case 'clear':return d&&d.closed&&d.score>=3?1:0;
    case 'workout':
      if(plan==='Rest')return -1;
      if(!d)return 0;
      if(d.workout==='done')return 1;
      if(d.workout==='pain'||d.workout==='pass')return -1;
      return 0;
  }
  return 0;
}
/* a pain day, a rest pass and a rest day never break a training streak. The clear streak forgives one gap: never miss twice. */
E.streakInfo=function(kind){
  const s=S();let n=0,gap=0,start=null;
  const span=Math.max(0,E.daysBetween(s.start,dkey()))+1;   /* the whole history: a streak must not slide after a year and a half */
  for(let i=0;i<=span;i++){
    const k=keyOffset(-i);
    if(k<s.start&&i>0)break;
    const v=dayPred(kind,s.days[k],k);
    if(v===-1)continue;
    if(v===1){n++;gap=0;start=k;continue}
    if(i===0)continue;
    if(kind==='clear'){gap++;if(gap>=2)break;continue}
    break;
  }
  return{n:n,start:start};
};
E.streak=kind=>E.streakInfo(kind).n;

/* ======================== counters, unlocks, realms ======================== */
E.RANK_LV={E:1,D:8,C:16,B:26,A:41,S:61};
E.bossKgs=()=>E.ladder().filter(g=>g.boss).map(g=>g.kg);
E.bossCleared=function(){const b=E.bossKgs();return S().gates.filter(kg=>b.indexOf(kg)>=0).length};
E.counters=function(){
  const s=S(),c={workouts:0,rehab:0,logdays:0,water:0,protein:0,weigh:0};
  Object.keys(s.days).forEach(k=>{
    const d=s.days[k];
    if(d.workout==='done')c.workouts++;
    if(d.reh&&d.reh.done)c.rehab++;
    if(Object.keys(d.done||{}).length>=2)c.logdays++;
    if(d.waterHit)c.water++;
    if(d.pAward)c.protein++;
    if(d.weighed)c.weigh++;
  });
  c.gates=s.gates.length;c.boss=E.bossCleared();c.prs=s.counters.pr;c.comeback=s.counters.comeback;c.goals=s.counters.goals;c.bonus=s.counters.bonus||0;
  c.streak=Math.max(s.bestStreak||0,E.streak('clear'));c.level=E.lv().L;
  return c;
};
E.reqMet=function(it,c){
  const r=it.req;
  if(r.t==='free')return true;
  if(r.t==='level')return c.level>=r.v;
  if(r.t==='rank')return c.level>=E.RANK_LV[r.v];
  return(c[r.t]||0)>=r.v;
};
const LABEL={level:v=>'Reach level '+v,rank:v=>'Reach rank '+v,boss:v=>'Clear boss gate '+v,gates:v=>'Clear '+v+' gates',workouts:v=>'Finish '+v+' workouts',streak:v=>'A '+v+'-day clear streak',prs:v=>v+' personal records',rehab:v=>v+' rehab days',comeback:()=>'Break fatigue by training',logdays:v=>v+' days logging 2+ meals',water:v=>v+' days at your water target',goals:v=>'Clear '+v+' short-term goals',bonus:v=>v+' bonus quests',protein:v=>v+' protein days',weigh:v=>v+' weigh-ins'};
E.reqProgress=function(it,c){
  c=c||E.counters();const r=it.req;
  if(r.t==='free')return{have:1,need:1,pct:1,text:'Yours'};
  let have,need;
  if(r.t==='rank'){have=c.level;need=E.RANK_LV[r.v]}
  else{have=c[r.t]||0;need=r.v}
  return{have:Math.min(have,need),need:need,pct:Math.min(1,have/need),text:LABEL[r.t]?LABEL[r.t](r.v):''};
};
E.ensureOwned=function(){const s=S();HS.ITEMS.forEach(it=>{if(it.req.t==='free'&&!s.owned[it.id])s.owned[it.id]=s.start})};
E.owned=id=>!!S().owned[id];
E.nextUnlock=function(){
  const c=E.counters();let best=null;
  HS.ITEMS.forEach(it=>{if(S().owned[it.id])return;const p=E.reqProgress(it,c);if(!best||p.pct>best.p.pct)best={it:it,p:p}});
  return best;
};
E.realmsOpen=()=>Math.min(HS.REALMS.length,1+E.bossCleared());
E.realm=function(){const id=S().realm;return HS.REALMS.find(r=>r.id===id)||HS.REALMS[0]};
let checking=false;
E.checkUnlocks=function(){
  if(checking)return;checking=true;
  try{
    const s=S();E.ensureOwned();
    const c=E.counters(),fresh=[];
    if(c.streak>(s.bestStreak||0))s.bestStreak=c.streak;
    HS.ITEMS.forEach(it=>{if(!s.owned[it.id]&&E.reqMet(it,c)){s.owned[it.id]=dkey();s.equip[it.slot]=it.id;fresh.push(it)}});
    const open=E.realmsOpen();let realm=null;
    if(open>s.realmSeen){s.realmSeen=open;s.realm=HS.REALMS[open-1].id;realm=HS.REALMS[open-1]}
    if(fresh.length||realm){E.persist();fresh.forEach(it=>E.emit('unlock',it));if(realm)E.emit('realm',realm)}
  }finally{checking=false}
};

/* ======================== short-term goals ======================== */
const hash=str=>{let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
function weekKeys(){const wk=E.weekKey(),out=[];for(let i=0;i<7;i++){const k=addDays(wk,i);if(k>dkey())break;out.push(k)}return out}
E.goalHave=function(g){
  const s=S(),ks=weekKeys(),ds=ks.map(k=>s.days[k]).filter(Boolean);
  const n=f=>ds.filter(f).length;
  switch(g.id){
    case 'g_gate':return Object.keys(s.gateDates).filter(kg=>ks.indexOf(s.gateDates[kg])>=0).length;
    case 'g_protein':return n(d=>d.pAward);
    case 'g_weigh':return n(d=>d.weighed);
    case 'g_train':return n(d=>d.workout==='done');
    case 'g_water':return n(d=>d.waterHit);
    case 'g_rehab':return n(d=>d.reh&&d.reh.done);
    case 'g_cal':return n(d=>d.closed&&d.calOk);
    case 'g_sleep':return n(d=>d.sleep>=7);
    case 'g_log':return n(d=>Object.keys(d.done||{}).length>=3);
    case 'g_pr':return s.prWeeks[E.weekKey()]||0;
    case 'g_steps':return n(d=>d.steps);
    case 'g_clear':return n(d=>d.closed&&d.score>=3);
  }
  return 0;
};
E.goalsActive=function(){
  const wk=E.weekKey(),s=S();
  const always=HS.GOALS.filter(g=>g.always),arr=HS.GOALS.filter(g=>!g.always);
  let h=hash(wk);
  for(let i=arr.length-1;i>0;i--){h=(Math.imul(h,1664525)+1013904223)>>>0;const j=h%(i+1);const t=arr[i];arr[i]=arr[j];arr[j]=t}
  return always.concat(arr.slice(0,4)).map(g=>{
    const have=Math.min(g.need,E.goalHave(g));
    return Object.assign({},g,{have:have,done:have>=g.need,claimed:!!s.claimed[g.id+'@'+wk]});
  });
};
E.checkGoals=function(){
  const s=S(),wk=E.weekKey();let any=false;
  E.goalsActive().forEach(g=>{
    if(g.done&&!g.claimed){s.claimed[g.id+'@'+wk]=1;s.counters.goals++;any=true;E.addAura(g.aura);E.emit('goal',g)}
  });
  ['protein','weigh','log','water','rehab','workout','clear'].forEach(kind=>{
    const si=E.streakInfo(kind);
    HS.STREAK_STEPS.forEach(step=>{
      if(si.n>=step){
        const key='s:'+kind+':'+step+':'+si.start;
        if(!s.claimed[key]){s.claimed[key]=1;s.counters.goals++;any=true;const a=HS.STREAK_AURA[step];E.addAura(a);E.emit('streak',{kind:kind,step:step,aura:a})}
      }
    });
  });
  if(any)E.persist();
};
/* ======================== bonus quests: three small optional ones each day ======================== */
/* One ticks itself from your data, two you tick yourself. They never cost aura if skipped, but a clean row of three raises the day's chest. */
const BONUS=[
  {id:'b_meals',t:'Log all three meals',s:'Breakfast, lunch and dinner.',a:20,auto:d=>Object.keys(d.done||{}).length>=3,p:d=>Math.min(3,Object.keys(d.done||{}).length)+' of 3 meals'},
  {id:'b_stars',t:'Earn a three-star plate',s:'Protein, a veg side, no sugar.',a:25,auto:d=>Object.keys(d.stars||{}).some(m=>d.stars[m]>=3),p:d=>{const v=Object.keys(d.stars||{}).map(m=>d.stars[m]);return v.length?'best plate so far: '+Math.max.apply(null,v)+' of 3':'no plate rated yet'}},
  {id:'b_sleep',t:'Sleep seven hours',s:'Tell the System at your weigh-in.',a:15,auto:d=>d.sleep!=null&&d.sleep>=7,p:d=>d.sleep!=null?d.sleep+' of 7 h':'not logged yet'},
  {id:'b_water',t:'Drink two litres of water',s:'Tap the bottle on Home.',a:15,auto:d=>(d.water||0)>=2000,p:d=>((d.water||0)/1000).toFixed(1).replace(/\.0$/,'')+' of 2 L'},
  {id:'b_steps',t:'Log your steps',s:'Samsung Health fills this in for you.',a:10,auto:d=>!!d.steps,p:d=>d.steps?String(d.steps)+' steps':'not logged yet'},
  {id:'m_stretch',t:'Gentle stretch, three minutes',s:'Hips and hamstrings. Stop if anything pinches.',a:10},
  {id:'m_walk',t:'Ten-minute easy walk',s:'Flat ground, relaxed pace.',a:12,calm:true},
  {id:'m_breath',t:'Ten slow breaths',s:'In for four, out for six.',a:8},
  {id:'m_desk',t:'Stand and walk for two minutes',s:'After a long sit. Your back likes it.',a:8},
  {id:'m_screen',t:'Phone down 30 minutes before bed',s:'Sleep is where the gains get built.',a:12},
  {id:'m_sun',t:'Ten minutes of daylight',s:'Step outside. Sunglasses optional.',a:10},
  {id:'m_prep',t:'Set out tomorrow\u2019s gym clothes',s:'Future you says thanks.',a:8},
  {id:'m_win',t:'Say one win from today out loud',s:'Small counts. Say it anyway.',a:10}
];
E.BONUS=BONUS;
const BONUS_ALL_AURA=E.BONUS_ALL=25;
/* the same three for the whole day, picked from the date so the list does not shuffle on you */
E.bonusToday=function(k){
  k=k||dkey();const s=S(),d=s.days[k]||{};
  let x=hash(k+'bonus');const rnd=()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296};
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
  const gentle=E.lastLight()==='red';   /* after a red check-in no walking quest is offered */
  const autos=shuf(BONUS.filter(b=>b.auto)),manuals=shuf(BONUS.filter(b=>!b.auto&&!(gentle&&b.calm)));
  return[autos[0],manuals[0],manuals[1]].map(b=>({id:b.id,t:b.t,s:b.s,a:b.a,auto:!!b.auto,
    done:b.auto?!!b.auto(d):!!(d.bonus&&d.bonus[b.id]),claimed:!!s.claimed['bonus:'+k+':'+b.id],
    prog:b.auto&&b.p?b.p(d):''}));
};
E.tickBonus=function(id){
  const b=BONUS.find(x=>x.id===id);if(!b||b.auto)return null;
  if(!E.bonusToday().some(x=>x.id===id))return null;   /* only today's three */
  const d=E.day();d.bonus=d.bonus||{};d.bonus[id]=!d.bonus[id];
  E.persist();E.checkBonus();
  return!!d.bonus[id];
};
E.checkBonus=function(){
  const s=S(),k=dkey();let any=false;
  const row=E.bonusToday(k);
  row.forEach(b=>{
    if(b.done&&!b.claimed){s.claimed['bonus:'+k+':'+b.id]=1;s.counters.bonus=(s.counters.bonus||0)+1;any=true;E.addAura(b.a);E.emit('bonus',b)}
  });
  const d=s.days[k];
  if(d&&!d.bonusAll&&row.every(b=>b.done)){d.bonusAll=true;any=true;E.addAura(BONUS_ALL_AURA);E.emit('bonusall',{aura:BONUS_ALL_AURA})}
  if(any){E.persist();E.checkUnlocks()}
};
/* the next streak step to chase, for the "short-term" strip */
E.streakTargets=function(){
  const out=[];
  Object.keys(HS.STREAK_NAMES).forEach(kind=>{
    const n=E.streak(kind),step=HS.STREAK_STEPS.find(x=>x>n);
    if(step)out.push({kind:kind,name:HS.STREAK_NAMES[kind],have:n,need:step,aura:HS.STREAK_AURA[step]});
  });
  return out;
};
let afterT=null;
E.afterSave=function(){clearTimeout(afterT);afterT=setTimeout(()=>{E.checkUnlocks();E.checkGoals();E.checkBonus()},0)};

/* ======================== numbers: maintenance, targets, plan ======================== */
E.maint=function(kg){const c=S().cfg;return Math.round((10*kg+6.25*c.height-5*c.age+5)*1.45/10)*10};
E.kcalFor=kg=>Math.round((E.maint(kg)-S().cfg.deficit)/10)*10;
E.campInfo=function(){
  const s=S();if(!s.camp)return null;
  const left=E.daysBetween(dkey(),s.camp.until);
  if(left<0)return null;
  return{left:left+1,kcal:s.camp.kcal};
};
/* called from logWeight for every gate crossed */
/* the automatic calorie step only ever lowers the target: one you set lower yourself stays */
E.onGate=function(g){
  const s=S();
  if(!g.boss)return;
  const n=E.bossKgs().indexOf(g.kg)+1,last=g.kg===s.cfg.goalW;
  if(s.cfg.autoKcal&&!last){const to=E.kcalFor(g.kg);if(to&&to<s.cfg.kcal){const from=s.cfg.kcal;s.cfg.kcal=to;E.emit('kcal',{from:from,to:to})}}
  if(s.cfg.camp!==false&&!last){s.camp={from:dkey(),until:addDays(dkey(),6),kcal:E.maint(E.trend())};E.emit('camp',s.camp)}
  E.emit('boss',{kg:g.kg,n:n,last:last});
};
/* The whole campaign: one row per gate with its week and date, realm summaries, camp weeks after each boss, and a finish date. */
E.plan=function(){
  const s=S(),c=s.cfg,lad=E.ladder(),per=(c.gateStep||.5)/.5,campOn=c.camp!==false;
  const gates=[],realms=[];let wk=0,rFrom=s.startW,rW0=1,rN=0,camps=0;
  lad.forEach((g,i)=>{
    wk+=per;rN++;
    const rec={kg:g.kg,boss:g.boss,week:wk,date:addDays(s.start,Math.round(wk*7)),kcal:E.kcalFor(g.kg)};
    gates.push(rec);
    if(g.boss){
      realms.push({n:realms.length+1,from:rFrom,to:g.kg,w0:rW0,w1:wk,gates:rN,kcal0:E.kcalFor(rFrom),kcal1:E.kcalFor(g.kg),name:(HS.REALMS[realms.length]||{}).name});
      const last=i===lad.length-1;
      if(campOn&&!last){wk+=1;camps++;rec.camp=wk}
      rFrom=g.kg;rW0=wk+1;rN=0;
    }
  });
  if(rN>0)realms.push({n:realms.length+1,from:rFrom,to:c.goalW,w0:rW0,w1:wk,gates:rN,kcal0:E.kcalFor(rFrom),kcal1:E.kcalFor(c.goalW),name:(HS.REALMS[realms.length]||{}).name});
  return{gates:gates,realms:realms,weeks:wk,camps:camps,finish:addDays(s.start,Math.round(wk*7)),startW:s.startW,goalW:c.goalW};
};
E.trendAt=function(k){const s=S();let t=s.startW;Object.keys(s.weights).sort().forEach(d=>{if(d<=k)t=t+.25*(s.weights[d]-t)});return Math.round(t*100)/100};
/* where the plan says your trend should be today, and how far ahead or behind you are (positive = ahead of plan) */
E.expected=function(){
  const s=S(),p=E.plan(),w=Math.max(0,E.daysBetween(s.start,dkey()))/7;
  const nodes=[{w:0,kg:s.startW}];
  p.gates.forEach(g=>{nodes.push({w:g.week,kg:g.kg});if(g.camp)nodes.push({w:g.camp,kg:g.kg})});
  let exp=s.cfg.goalW;
  for(let i=1;i<nodes.length;i++){
    if(w<=nodes[i].w){const a=nodes[i-1],b=nodes[i],f=b.w===a.w?1:(w-a.w)/(b.w-a.w);exp=a.kg+(b.kg-a.kg)*f;break}
  }
  exp=Math.round(exp*10)/10;
  return{expected:exp,ahead:Math.round((exp-E.trend())*10)/10};
};
/* pace-based finish: your recent real rate instead of the plan's 0.5 kg a week */
E.eta=function(){
  const s=S(),tr=E.trend(),left=Math.max(0,tr-s.cfg.goalW);
  const ins=Object.keys(s.weights).length;
  let rate=.5,real=false;
  if(ins>=6&&E.daysBetween(s.start,dkey())>=21){
    const r=(E.trendAt(keyOffset(-28))-tr)/4;
    if(isFinite(r)){rate=Math.max(.2,Math.min(.9,r));real=true}
  }
  const bossLeft=E.bossKgs().filter(kg=>kg<tr&&kg>s.cfg.goalW).length,campWeeks=s.cfg.camp!==false?bossLeft:0;
  const weeks=left/rate+campWeeks;
  return{rate:rate,real:real,weeks:weeks,date:addDays(dkey(),Math.round(weeks*7))};
};

/* ======================== weekly report ======================== */
E.report=function(){
  const s=S(),T=E.T(),ks=[];for(let i=6;i>=0;i--)ks.push(keyOffset(-i));
  const ds=ks.map(k=>s.days[k]).filter(Boolean),closed=ds.filter(d=>d.closed);
  const r={closed:closed.length,cal:closed.filter(d=>d.calOk).length,protein:ds.filter(d=>d.pAward).length,workouts:ds.filter(d=>d.workout==='done').length,skipped:ds.filter(d=>d.workout==='lazy').length,
    rehab:ds.filter(d=>d.reh&&d.reh.done).length,water:ds.filter(d=>d.waterHit).length,weighIns:ds.filter(d=>d.weighed).length,
    sleepAvg:null,kcalAvg:null,rate:null,trend:E.trend(),advice:{tone:'info',title:'Keep logging',text:'The System needs a few more days of data to give you a real read.'}};
  const sl=ds.filter(d=>d.sleep!=null);if(sl.length)r.sleepAvg=Math.round(sl.reduce((a,d)=>a+d.sleep,0)/sl.length*10)/10;
  const eaten=ds.filter(d=>E.totals(d).k>500);if(eaten.length)r.kcalAvg=Math.round(eaten.reduce((a,d)=>a+E.totals(d).k,0)/eaten.length);
  const ins14=Object.keys(s.weights).filter(k=>k>=keyOffset(-14)).length;
  if(ins14>=4){
    r.rate=Math.round((E.trendAt(keyOffset(-7))-r.trend)*100)/100;
    const adherent=closed.length>=3&&r.cal/closed.length>=.7;
    if(r.rate>.9)r.advice={tone:'warn',title:'Dropping fast',text:'Your trend fell '+r.rate.toFixed(1)+' kg this week. Faster than about 0.9 kg is hard on muscle and joints. Add 100 kcal a day and keep your protein.'};
    else if(r.rate<.15&&adherent)r.advice={tone:'warn',title:'Plateau, with good adherence',text:'Trend is flat but you hit your window most days. Check weekend portions and drinks first. If it stays flat another week, trim 100 kcal a day or add a walk.'};
    else if(r.rate<.15)r.advice={tone:'info',title:'Adherence first',text:'Trend is flat and the calorie window was missed on several days. Land the window on 5 of 7 days before changing the plan.'};
    else r.advice={tone:'good',title:'On pace',text:'Trend down '+r.rate.toFixed(2)+' kg this week. This is the pace the plan wants. Do not change anything.'};
  }else{
    r.advice={tone:'info',title:'Weigh in more',text:'Only '+ins14+' weigh-ins in 14 days. The trend needs at least 4 to say anything.'};
  }
  return r;
};

/* ======================== rehab schedule ======================== */
/* The external physio's list, spread over the training cycle. Push gets Day 1, Pull gets Day 2 plus pain-free aerobic, Legs is Day 3 itself,
   rest days get the block, aerobic and optional extras. The pain traffic light holds the strength work back when the knee or back is amber or red. */
E.lastLight=function(){
  const s=S();
  for(let i=0;i<2;i++){const d=s.days[keyOffset(-i)];if(d&&E.checkedIn(d.reh))return E.light(d.reh)}
  return null;
};
E.rehabToday=function(k,noHold){
  k=k||dkey();
  const plan=E.planFor(k),dow=(new Date(k+'T12:00:00').getDay()+6)%7;
  const o={plan:plan,block:[0,1,2,3],knee:[0,1,3,4,5].indexOf(dow)>=0,finisher:null,only:null,aerobic:false,bonus:null,hold:null};
  if(plan==='Push')o.finisher=0;
  else if(plan==='Pull'){o.finisher=1;o.aerobic=true}
  else if(plan==='Legs'){o.finisher=2;o.only=[6]}   /* the other Day 3 moves are your leg workout */
  else{o.finisher=0;o.aerobic=true;o.bonus=1}
  const lt=noHold?null:E.lastLight();
  if(lt==='amber'){o.hold='amber';o.finisher=null;o.only=null;o.bonus=null}
  if(lt==='red'){o.hold='red';o.finisher=null;o.only=null;o.bonus=null;o.aerobic=false}
  return o;
};
/* the finisher list as [index, entry] pairs, skipping anything you opted out of (the Jefferson curl) */
E.finisherItems=function(t){
  if(t.finisher==null)return[];
  const out=[];HS.RDAYS[t.finisher].x.forEach((e,i)=>{if(e[3])return;if(t.only&&t.only.indexOf(i)<0)return;out.push([i,e])});
  return out;
};
/* every key that counts towards today's rehab */
E.rehabKeys=function(k,noHold){
  const t=E.rehabToday(k,noHold),keys=[];
  t.block.forEach(i=>keys.push('b'+i));
  if(t.knee)keys.push('b4');
  E.finisherItems(t).forEach(x=>keys.push('d'+t.finisher+'_'+x[0]));
  if(t.aerobic)keys.push('aero');
  return keys;
};
/* today's rehab as ordered groups, ready for the checklist and the guided session */
E.rehabGroups=function(k){
  const t=E.rehabToday(k),g=[];
  const mk=(key,e)=>({key:key,name:e[0],rx:e[1],fig:e[2]||null});
  const blk=t.block.map(i=>mk('b'+i,HS.BLOCK[i]));if(t.knee)blk.push(mk('b4',HS.BLOCK[4]));
  g.push({id:'block',title:'Daily block',sub:'Every day \u00B7 about '+Math.round(blk.length*1.5)+' min',items:blk});
  const fin=E.finisherItems(t);
  if(fin.length)g.push({id:'fin',title:HS.RDAYS[t.finisher].t,sub:t.only?'The rest of Day 3 is your leg workout':'Strength and control',items:fin.map(x=>mk('d'+t.finisher+'_'+x[0],x[1]))});
  if(t.aerobic)g.push({id:'aero',title:'Pain-free aerobic',sub:'30 minutes \u00B7 3 to 4 days a week',items:[{key:'aero',name:'30 minutes of easy cardio',rx:'Stay pain-free. Your incline walk counts.',fig:'walk'}]});
  if(t.bonus!=null)g.push({id:'bonus',title:'Bonus \u00B7 '+HS.RDAYS[t.bonus].t,sub:'Optional extra healing on a rest day',bonus:true,items:HS.RDAYS[t.bonus].x.map((e,i)=>e[3]?null:mk('x'+t.bonus+'_'+i,e)).filter(Boolean)});
  return{t:t,groups:g};
};
/* what each day of the week asks for, for the roadmap */
E.rehabWeek=function(){
  const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],out=[];
  for(let i=0;i<7;i++){
    const k=addDays(E.weekKey(),i),t=E.rehabToday(k,true);
    const fin=t.finisher!=null?(t.only?'balance':'Day '+(t.finisher+1)):'';
    out.push({d:names[i],k:k,plan:E.planFor(k),fin:fin,aero:t.aerobic,bonus:t.bonus!=null,n:E.rehabKeys(k,true).length});
  }
  return out;
};
E.rehabProgress=function(){
  const d=E.day(),r=d.reh,keys=E.rehabKeys(),done=r?keys.filter(x=>r.items[x]).length:0;
  return{done:done,total:keys.length,ok:keys.length>0&&done>=Math.ceil(keys.length*.8)};
};

/* ======================== water, sleep ======================== */
E.addWater=function(ml){
  const d=E.day(),c=S().cfg;
  d.water=Math.max(0,(d.water||0)+ml);
  let hit=false;
  if(!d.waterHit&&d.water>=c.water){d.waterHit=true;hit=true;E.addAura(30);E.stat('VIT',1)}
  E.save();E.emit('water',{ml:ml,total:d.water,hit:hit});
  return hit;
};
E.logSleep=function(h){
  const d=E.day();d.sleep=h;
  if(!d.sleepAward){d.sleepAward=true;const a=h>=7?15:h>=6?8:0;if(a)E.addAura(a);E.stat('SNS',1)}
  E.save();E.emit('sleep',{h:h});
};

/* ======================== the daily chest: a small surprise after you clear the day ======================== */
E.rng=Math.random;
E.openChest=function(score){
  const d=E.day();if(d.chest)return d.chest;
  const sc=(score||0)+(d.bonusAll?1:0);   /* a clean bonus row lifts the chest one tier */
  const tier=sc>=4?'epic':sc>=3?'rare':'common',r=E.rng();let aura,crit=false;
  if(tier==='common')aura=15+Math.floor(r*16);
  else if(tier==='rare'){aura=30+Math.floor(r*41);if(E.rng()<.1){aura*=2;crit=true}}
  else{aura=60+Math.floor(r*61);if(E.rng()<.1){aura=200;crit=true}}
  d.chest={tier:tier,aura:aura,crit:crit};
  E.addAura(aura);E.persist();E.emit('chest',d.chest);
  return d.chest;
};

/* ======================== logging helpers: usuals, repeat, plate stars ======================== */
/* the most recent earlier day where this meal was logged, to repeat in one tap */
E.lastMeal=function(meal){
  const s=S(),today=dkey(),ks=Object.keys(s.days).filter(k=>k<today).sort().reverse();
  for(let i=0;i<ks.length;i++){
    const d=s.days[ks[i]];if(d.compact)continue;
    const its=d.items.filter(x=>x.meal===meal&&E.food(x.name));
    if(its.length)return{k:ks[i],items:its.map(x=>({name:x.name,g:x.g})),kcal:Math.round(its.reduce((a,x)=>a+E.nut(E.food(x.name),x.g).k,0))};
  }
  return null;
};
/* what you actually eat at this meal, with your typical portion */
E.usuals=function(meal){
  const s=S(),today=dkey(),from=keyOffset(-28),cnt={};
  Object.keys(s.days).forEach(k=>{
    if(k>=today||k<from)return;const d=s.days[k];if(d.compact)return;
    d.items.forEach(i=>{if(i.meal!==meal||!E.food(i.name))return;const c=cnt[i.name]||(cnt[i.name]={n:0,gs:[]});c.n++;c.gs.push(i.g)});
  });
  return Object.keys(cnt).sort((a,b)=>cnt[b].n-cnt[a].n).slice(0,6).map(n=>{const gs=cnt[n].gs.sort((a,b)=>a-b);return{name:n,g:gs[Math.floor(gs.length/2)],n:cnt[n].n}});
};
/* three stars for a plate: logged, enough protein, balanced (a veg side, no sugar, not a blowout) */
E.rateMeal=function(meal){
  const d=E.day(),T=E.T();let k=0,p=0,side=false,sugar=false;
  d.items.forEach(i=>{if(i.meal!==meal)return;const f=E.food(i.name);if(!f)return;const n=E.nut(f,i.g);k+=n.k;p+=n.p;if(f.cat==='side')side=true;if(f.sugar)sugar=true});
  const notes=[];let stars=1;
  if(p>=25)stars++;else notes.push('Aim for about 25 g of protein in a meal.');
  if(side&&!sugar&&k<=T.kcal*.5)stars++;else notes.push(!side?'Add a veg side for the third star.':sugar?'Sugar keeps this plate at two stars.':'Big plate. Trim a portion next time.');
  return{stars:stars,k:Math.round(k),p:Math.round(p),notes:notes};
};
/* mark a meal done; the star aura is paid once per meal per day */
E.finishMeal=function(meal){
  const d=E.day();d.done[meal]=true;delete d.skip[meal];
  const r=E.rateMeal(meal);d.stars=d.stars||{};
  const first=d.stars[meal]==null;
  if(first){d.stars[meal]=r.stars;E.addAura(r.stars*4);E.stat('VIT',1)}
  E.save();E.emit('meal',{meal:meal,rating:r,first:first});
  return Object.assign({first:first},r);
};

/* ======================== the day: status, clearing, and what the System has to say ======================== */
E.dayStatus=function(){
  const d=E.day(),plan=E.planFor(),T=E.T(),tot=E.totals(d);
  const calOk=tot.k>=T.lo&&tot.k<=T.hi,gymOk=plan==='Rest'||d.workout==='done'||d.workout==='pain'||d.workout==='pass',rehOk=!!(d.reh&&d.reh.done);
  return{plan:plan,T:T,tot:tot,calOk:calOk,gymOk:gymOk,rehOk:rehOk,protOk:!!d.pAward,score:(d.pAward?1:0)+(calOk?1:0)+(gymOk?1:0)+(rehOk?1:0)};
};
E.closeDay=function(){
  const d=E.day();if(d.closed)return null;
  const st=E.dayStatus();
  d.closed=true;d.calOk=st.calOk;d.score=st.score;
  if(st.calOk){E.addAura(80);E.stat('VIT',2)}
  E.save();E.emit('clear',st);
  return st;
};
/* which roast applies right now, if any. Roasts only ever target a skipped habit, never the body. */
E.situation=function(){
  const d=E.day(),h=Math.floor(E.nowMin()/60),cfg=S().cfg,tot=E.totals(d);
  if(E.fatigued())return'fatigue';
  if(d.workout==='lazy')return'skip';
  if(d.sugarPen>0)return'sugar';
  const did=Object.keys(d.done||{}).length+(d.workout==='done'?1:0)+(d.weighed?1:0);
  if(h>=21&&!d.closed)return'late';
  if(h>=14&&did===0&&tot.k===0)return'idle';
  if(h>=11&&!d.weighed)return'weigh';
  if(h>=15&&(d.water||0)<cfg.water*.35)return'water';
  if(h>=15&&!d.done.breakfast&&!d.skip.breakfast&&!d.items.some(i=>i.meal==='breakfast'))return'mealSkip';
  return null;
};
/* ml you should have drunk by now if you spread the target from 8:00 to 22:00 */
E.waterPace=function(){const c=S().cfg,f=Math.max(0,Math.min(1,(E.nowMin()-480)/(22*60-480)));return Math.round(c.water*f/50)*50};
E.equip=function(id){
  const it=HS.ITEM_BY_ID[id];if(!it||!S().owned[id])return false;
  S().equip[it.slot]=id;E.persist();E.emit('equip',it);return true;
};
E.setRealm=function(id){
  const i=HS.REALMS.findIndex(r=>r.id===id);if(i<0||i+1>E.realmsOpen())return false;
  S().realm=id;E.persist();E.emit('realmpick',HS.REALMS[i]);return true;
};
E.reviewDue=function(){return S().reviewSeen!==E.weekKey()&&E.daysBetween(S().start,dkey())>=6};
E.reviewSeen=function(){S().reviewSeen=E.weekKey();E.persist()};
/* the gate you are working on now, and the distance to the next boss */
E.nextGates=function(){
  const s=S(),lad=E.ladder(),tr=E.trend();
  const next=lad.find(g=>s.gates.indexOf(g.kg)<0),boss=lad.find(g=>g.boss&&s.gates.indexOf(g.kg)<0);
  return{next:next||null,boss:boss||null,toNext:next?Math.max(0,Math.round((tr-next.kg)*100)/100):0,toBoss:boss?Math.max(0,Math.round((tr-boss.kg)*100)/100):0};
};
/* weeks since the start and where the plan says that falls */
E.weekNo=function(){return Math.floor(Math.max(0,E.daysBetween(S().start,dkey()))/7)+1};

/* ======================== avatar mood ======================== */
E.mood=function(){
  if(E.fatigued())return'tired';
  const d=E.day();
  if(d.closed&&d.score>=3)return'proud';
  if(E.streak('clear')>=3)return'pumped';
  return'idle';
};

/* ======================== data vault: backup, restore, compaction ======================== */
E.backupText=function(){
  const s=S();
  return JSON.stringify({app:'habit-sync',version:s.v,exported:new Date().toISOString(),state:s});
};
/* the backup reminder is silenced only once the backup has really been handed over (saved, shared or copied) */
E.markBackup=function(){S().lastBackup=Date.now();E.persist()};
E.importText=function(txt){
  let obj;
  try{obj=JSON.parse(txt)}catch(e){throw new Error('That is not a Habit Sync backup (could not read it).')}
  const st=obj&&obj.app==='habit-sync'?obj.state:(obj&&obj.days&&obj.cfg?obj:null);
  if(!st||!st.days||!st.cfg)throw new Error('That file is not a Habit Sync backup.');
  const next=E.migrate(st);E.snapshot();E._set(next);E.ensureOwned();E.persist();E.emit('reset');
  return Object.keys(S().days).length;
};
E.restoreAuto=function(){
  const t=localStorage.getItem(E.KEY+'.bak');if(!t)throw new Error('No automatic backup yet. One is made on the first save of each day.');
  const next=E.migrate(JSON.parse(t));E.snapshot();E._set(next);E.ensureOwned();E.persist();E.emit('reset');
  return Object.keys(S().days).length;
};
E.dataInfo=function(){
  const s=S();let bytes=0;
  try{bytes=new Blob([localStorage.getItem(E.KEY)||'']).size}catch(e){}
  return{bytes:bytes,days:Object.keys(s.days).length,since:s.start,lastBackup:s.lastBackup,backupAgeDays:s.lastBackup?Math.floor((Date.now()-s.lastBackup)/864e5):null};
};
/* Old days keep their totals and flags but drop the line-by-line detail, so the app can run for years inside browser storage limits. */
E.compact=function(){
  const s=S(),cutoff=keyOffset(-120);let n=0;
  Object.keys(s.days).forEach(k=>{
    const d=s.days[k];
    if(k<cutoff&&!d.compact){d.sum=E.totals(d);d.compact=true;d.items=[];d.lift={};n++}
  });
  const stale=keyOffset(-60);let pruned=0;   /* bonus claims only matter for the day they were earned */

<script>
/* health.js: Samsung Health through Android Health Connect, read-only.
   Samsung Health writes steps, active calories, sleep, weight and workouts into Health Connect, and this module reads them.
   It only runs inside the Android app. Nothing here is written back and nothing leaves the phone. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E,H=HS.health={};
const P=()=>HS.native&&HS.native.plugin('Health');
const READ=['steps','calories','sleep','weight','workouts'];
H.native=()=>!!(HS.native&&HS.native.native()&&P());
H.types=READ;

H.connect=async function(){
  const p=P();
  if(!p)return{ok:false,msg:'Samsung Health sync works in the Android app.'};
  try{
    const av=await p.isAvailable();
    if(!av.available)return{ok:false,msg:(av.reason||'Health Connect is not available on this phone.')+' On Android 13 or older, install Health Connect from the Play Store, then turn on Samsung Health inside it.'};
    const st=await p.requestAuthorization({read:READ,write:[]});
    const got=st.readAuthorized||[];
    if(!got.length)return{ok:false,msg:'No permission was granted. Open Health Connect, App permissions, Habit Sync, and allow reading.'};
    const S=E.S();S.health.on=true;S.health.got=got;E.save();
    return{ok:true,got:got};
  }catch(e){return{ok:false,msg:'Could not connect: '+((e&&e.message)||e)}}
};

const sum=(r)=>(r&&r.samples||[]).reduce((a,s)=>a+(s.value||0),0);
H.sync=async function(){
  const p=P(),S=E.S();
  if(!p)return{ok:false,msg:'Samsung Health sync works in the Android app.'};
  if(!S.health.on)return{ok:false,msg:'Connect Samsung Health first.'};
  const now=new Date(),mid=new Date(E.dkey()+'T00:00:00');   /* the app's day, which can run past midnight */
  const out={ok:true},d=E.day();
  const day={startDate:mid.toISOString(),endDate:now.toISOString(),bucket:'day',aggregation:'sum'};
  const tryit=async(label,fn)=>{try{await fn()}catch(e){out.errors=(out.errors||[]).concat(label)}};
  await tryit('steps',async()=>{const v=Math.round(sum(await p.queryAggregated(Object.assign({dataType:'steps'},day))));if(v>=0){out.steps=v;d.hSteps=v;if(!d.steps||+d.steps<v)d.steps=String(v);if(v>0&&!d.stepsAward){d.stepsAward=true;E.stat('AGI',1)}}});
  await tryit('calories',async()=>{const v=Math.round(sum(await p.queryAggregated(Object.assign({dataType:'calories'},day))));if(v>=0){out.act=v;d.hAct=v}});
  await tryit('sleep',async()=>{
    const from=new Date(mid.getTime()-6*3600e3);   /* from 6pm yesterday */
    const r=await p.readSamples({dataType:'sleep',startDate:from.toISOString(),endDate:now.toISOString(),limit:30});
    let mins=0;
    (r.samples||[]).forEach(s=>{
      if(new Date(s.endDate)<mid)return;   /* a session that ended before midnight is not last night's */
      let m=s.value||0;
      if(s.stages&&s.stages.length)m-=s.stages.filter(x=>x.stage==='awake'||x.stage==='inBed').reduce((a,x)=>a+(x.durationMinutes||0),0);
      mins+=Math.max(0,m);
    });
    if(mins>60){const hrs=Math.round(mins/60*10)/10;out.sleep=hrs;d.hSleep=hrs;if(d.sleep==null)E.logSleep(Math.round(hrs*2)/2)}
  });
  await tryit('weight',async()=>{
    const r=await p.readSamples({dataType:'weight',startDate:new Date(now.getTime()-3*864e5).toISOString(),endDate:now.toISOString(),limit:5,ascending:false});
    const s=(r.samples||[])[0];
    if(s&&s.value>30&&s.value<250){out.weight=Math.round(s.value*10)/10;d.hWeight=out.weight}
  });
  await tryit('workouts',async()=>{
    const r=await p.queryWorkouts({startDate:mid.toISOString(),endDate:now.toISOString(),limit:20});
    const w=r.workouts||[];
    if(w.length){

};
/* quiet refresh when the app opens, at most every 10 minutes */
H.auto=async function(){
  const S=E.S();
  if(!H.native()||!S.health.on||Date.now()-(S.health.last||0)<600000)return null;
  try{return await H.sync()}catch(e){return null}
};
})();

F.play=function(name,arg){if(!ctx())return;try{SND[name]&&SND[name](arg)}catch(e){}};

/* sound and haptics for the game events */
E.on('aura',n=>{if(n>0){F.play('auraUp',n);F.vib(n>=100?[20,30,30]:12)}else if(n<0){F.play('auraDown');F.vib([60,40,90])}});
E.on('level',e=>{F.play(e.rankUp?'rank':'level');F.vib([60,40,60,40,160]);F.burstCenter(e.rankUp?90:60)});

E.on('gate',()=>{F.play('gate');F.vib([40,40,40,40,200]);F.burstCenter(120)});

E.on('streak',()=>{F.play('streak');F.vib([30,30,30,30,90])});

E.on('water',w=>{F.play('water');F.vib(w.hit?[20,30,60]:8)});

/* ---------------- themes: five realm looks, plus Jade for fun ---------------- */
/* glr and acr are r,g,b triples so the stylesheet can use rgba(var(--glr),.2) everywhere. */
const T=(name,glow,d,acc,glr,acr,bg,panel,p2,line,sheet,tile1,tile2,b1,b2)=>({name:name,glow:glow,d:d,acc:acc,glr:glr,acr:acr,bg:bg,panel:panel,p2:p2,line:line,sheet:sheet,tile1:tile1,tile2:tile2,b1:b1,b2:b2});
const THEMES={
  shadow: T('Shadow','#3aa8ff','#1b6fb8','#8b5cff','58,168,255','139,92,255','#05070d','rgba(9,17,36,.82)','#0d1a33','#1d4d7e','#070d1c','#10203d','#0a1429','#1a2f55','#060b18'),
  monarch:T('Monarch','#a678ff','#5b32b8','#ff5fd2','166,120,255','255,95,210','#08050f','rgba(20,11,42,.82)','#1a0f33','#4a2a86','#0c0718','#241448','#140a2c','#2b1a55','#0b0618'),
  ember:  T('Ember','#ff8a3d','#b4501a','#ffd24a','255,138,61','255,210,74','#0d0705','rgba(34,15,7,.82)','#2a120a','#7a3a14','#12090a','#3a1b0d','#1f0d07','#4a2210','#12070a'),
  frost:  T('Frost','#7fe3ff','#2a8fb0','#c9f1ff','127,227,255','201,241,255','#040a10','rgba(8,25,38,.82)','#0c2233','#2a6a86','#061219','#12354b','#091a28','#1f4a63','#06121c'),
  gold:   T('Gold','#f5c451','#a8761a','#fff1b8','245,196,81','255,241,184','#0b0803','rgba(32,23,7,.82)','#261c08','#7a5a1a','#100b04','#3a2a0c','#1f1606','#4d3811','#120d04'),
  jade:   T('Jade','#2ee6a6','#12805c','#4ab8ff','46,230,166','74,184,255','#040d0a','rgba(6,29,23,.82)','#0a2a20','#1d7058','#06130f','#0f3a2c','#082219','#17503d','#06150f')
};
F.THEMES=THEMES;
F.themeId=function(){const c=E.cfg().theme;return c==='auto'||!THEMES[c]?E.realm().theme:c};
F.applyTheme=function(){
  const t=THEMES[F.themeId()]||THEMES.shadow,r=document.documentElement,st=r.style;
  st.setProperty('--glow',t.glow);st.setProperty('--glow-d',t.d);st.setProperty('--violet',t.acc);st.setProperty('--glr',t.glr);st.setProperty('--acr',t.acr);
  st.setProperty('--bg',t.bg);st.setProperty('--panel',t.panel);st.setProperty('--panel2',t.p2);st.setProperty('--line',t.line);st.setProperty('--sheet',t.sheet);
  st.setProperty('--tile1',t.tile1);st.setProperty('--tile2',t.tile2);st.setProperty('--b1',t.b1);st.setProperty('--b2',t.b2);
  r.dataset.realm=E.realm().id;r.dataset.theme=F.themeId();
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t.bg);
  lastCol=0;
};

/* ---------------- count up ---------------- */
F.countTo=function(el,to,fmtFn,ms){
  if(!el)return;fmtFn=fmtFn||(v=>Math.round(v).toLocaleString('en-US'));
  const from=parseFloat(el.dataset.v);const start=isNaN(from)?to:from;el.dataset.v=to;
  if(start===to||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){el.textContent=fmtFn(to);return}
  const t0=performance.now(),dur=ms||700;
  (function step(t){const u=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-u,3);el.textContent=fmtFn(start+(to-start)*e);if(u<1&&el.isConnected)requestAnimationFrame(step);else el.textContent=fmtFn(to)})(t0);
};

/* ---------------- flying orbs ---------------- */
F.fly=function(from,to,html,opts){
  opts=opts||{};
  const a=from.getBoundingClientRect?from.getBoundingClientRect():{left:from.x,top:from.y,width:0,height:0},b=to.getBoundingClientRect();
  const sx=a.left+a.width/2,sy=a.top+a.height/2,ex=b.left+b.width/2,ey=b.top+b.height/2;
  const el=document.createElement('div');el.className='orb '+(opts.cls||'');el.innerHTML=html;document.body.appendChild(el);
  const dx=ex-sx,dy=ey-sy,mx=dx*.5,my=dy*.5-(opts.arc||60);
  if(!el.animate){el.remove();if(opts.done)opts.done();return}
  const an=el.animate([{transform:'translate('+sx+'px,'+sy+'px) translate(-50%,-50%) scale(.6)',opacity:0},
    {transform:'translate('+(sx+mx)+'px,'+(sy+my)+'px) translate(-50%,-50%) scale(1.25)',opacity:1,offset:.45},
    {transform:'translate('+ex+'px,'+ey+'px) translate(-50%,-50%) scale(.5)',opacity:.9}],{duration:opts.ms||620,easing:'cubic-bezier(.3,.7,.3,1)'});
  an.onfinish=()=>{el.remove();if(opts.done)opts.done()};
};

/* ---------------- ambient particles: each realm has its own weather ---------------- */
const reduce=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=n=>Math.random()*n;
let bg,bx,parts=[],W=0,H=0,glowCol='#3aa8ff',accCol='#8b5cff',lastCol=0,kindNow='';
function sizeCanvas(c){const r=window.devicePixelRatio||1;c.width=innerWidth*r;c.height=innerHeight*r;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);W=innerWidth;H=innerHeight}
/* spawn(any) makes one particle; step moves it and returns true when it is gone; draw paints it */
const KINDS={
  souls:{n:46,
    spawn:any=>({x:rnd(W||400),y:any?rnd(H||800):(H||800)+10,v:.15+rnd(.5),r:.8+rnd(1.8),a:.2+rnd(.5),ph:rnd(6)}),
    step:(p,ts,sl)=>{p.y-=p.v*sl;p.x+=Math.sin(ts/900+p.ph)*.25;return p.y<-10},
    draw:(p,ts,sl)=>{bx.globalAlpha=p.a*(.5+.5*Math.sin(ts/500+p.ph))*sl;bx.fillStyle=glowCol;bx.beginPath();bx.arc(p.x,p.y,p.r,0,6.283);bx.fill()}},
  wisps:{n:30,
    spawn:any=>({x:rnd(W||400),y:any?rnd(H||800):(H||800)+20,v:.25+rnd(.5),r:6+rnd(14),a:.18+rnd(.35),ph:rnd(6),dir:Math.random()<.5?-1:1}),
    step:(p,ts,sl)=>{p.y-=p.v*sl;p.x+=Math.sin(ts/1300+p.ph)*.5*p.dir;return p.y<-30},
    draw:(p,ts,sl)=>{bx.globalAlpha=p.a*(.5+.5*Math.sin(ts/700+p.ph))*sl;bx.strokeStyle=p.dir>0?glowCol:accCol;bx.lineWidth=1.4;bx.beginPath();bx.moveTo(p.x,p.y);bx.quadraticCurveTo(p.x+p.dir*p.r*.8,p.y-p.r*.6,p.x,p.y-p.r*1.6);bx.stroke()}},
  embers:{n:44,
    spawn:any=>({x:rnd(W||400),y:any?rnd(H||800):(H||800)+10,v:.5+rnd(1.1),r:.9+rnd(1.8),a:.4+rnd(.5),ph:rnd(6),hot:Math.random()<.4}),
    step:(p,ts,sl)=>{p.y-=p.v*sl;p.x+=Math.sin(ts/380+p.ph)*.55;return p.y<-10},
    draw:(p,ts,sl)=>{bx.globalAlpha=p.a*(.4+.6*Math.abs(Math.sin(ts/170+p.ph)))*sl;bx.fillStyle=p.hot?accCol:glowCol;bx.fillRect(p.x,p.y,p.r,p.r)}},
  snow:{n:60,
    spawn:any=>({x:rnd(W||400),y:any?rnd(H||800):-10,v:.35+rnd(.8),r:.9+rnd(2.2),a:.35+rnd(.5),ph:rnd(6)}),
    step:(p,ts,sl)=>{p.y+=p.v*sl;p.x+=Math.sin(ts/1100+p.ph)*.45;return p.y>(H||800)+10},
    draw:(p,ts,sl)=>{bx.globalAlpha=p.a*sl;bx.fillStyle='#e8f6ff';bx.beginPath();bx.arc(p.x,p.y,p.r,0,6.283);bx.fill()}},
  gold:{n:40,
    spawn:any=>({x:rnd(W||400),y:any?rnd(H||800):(H||800)+10,v:.12+rnd(.35),r:1.4+rnd(2.6),a:.4+rnd(.5),ph:rnd(6)}),
    step:(p,ts,sl)=>{p.y-=p.v*sl;p.x+=Math.sin(ts/1000+p.ph)*.2;return p.y<-10},
    draw:(p,ts,sl)=>{const tw=Math.max(0,Math.sin(ts/260+p.ph));bx.globalAlpha=p.a*tw*sl;bx.strokeStyle=tw>.8?'#fff6cf':glowCol;bx.lineWidth=1.2;const r=p.r*(1+tw);bx.beginPath();bx.moveTo(p.x-r,p.y);bx.lineTo(p.x+r,p.y);bx.moveTo(p.x,p.y-r);bx.lineTo(p.x,p.y+r);bx.stroke()}}
};
F.startBg=function(){
  bg=document.getElementById('bg');if(!bg)return;bx=bg.getContext('2d');sizeCanvas(bg);
  addEventListener('resize',()=>sizeCanvas(bg));
  (function loop(ts){
    requestAnimationFrame(loop);
    if(document.hidden||reduce())return;
    if(ts-lastCol>1500){lastCol=ts;const cs=getComputedStyle(document.documentElement);glowCol=cs.getPropertyValue('--glow').trim()||glowCol;accCol=cs.getPropertyValue('--violet').trim()||accCol}
    const kind=E.realm().fx||'souls',K=KINDS[kind]||KINDS.souls;
    if(kind!==kindNow){kindNow=kind;parts=[];for(let i=0;i<K.n;i++)parts.push(K.spawn(true))}
    bx.clearRect(0,0,W,H);
    const lvl=E.lv(),fat=E.fatigued(),n=fat?Math.round(K.n*.4):Math.min(K.n,Math.round(K.n*.5)+lvl.L*2),sl=fat?.4:1;
    for(let i=0;i<n;i++){
      const p=parts[i];if(!p)continue;
      if(K.step(p,ts,sl)){parts[i]=K.spawn(false);continue}
      if(fat){bx.globalAlpha=1}
      K.draw(p,ts,fat?.4:1);
    }
    bx.globalAlpha=1;
  })(0);
};
let burstC,bctx,bparts=[],bRun=false;
F.burst=function(x,y,n,cols){
  if(reduce())return;
  burstC=burstC||document.getElementById('burst');if(!burstC)return;
  if(!bctx){bctx=burstC.getContext('2d');sizeCanvas(burstC);addEventListener('resize',()=>sizeCanvas(burstC))}
  const cs=cols||[glowCol,'#f5c451','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*7;bparts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:2+Math.random()*3,c:cs[i%cs.length],l:1})}
  if(!bRun){bRun=true;requestAnimationFrame(stepB)}
};
function stepB(){
  bctx.clearRect(0,0,W,H);
  bparts=bparts.filter(p=>p.l>0);
  bparts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.985;p.l-=.016;bctx.globalAlpha=Math.max(0,p.l);bctx.fillStyle=p.c;bctx.fillRect(p.x,p.y,p.r,p.r*1.6)});
  bctx.globalAlpha=1;
  if(bparts.length)requestAnimationFrame(stepB);else{bRun=false;bctx.clearRect(0,0,W,H)}
}
F.burstCenter=function(n,cols){F.burst(innerWidth/2,innerHeight*.38,n||60,cols)};
F.burstAt=function(el,n,cols){const r=el.getBoundingClientRect();F.burst(r.left+r.width/2,r.top+r.height/2,n||24,cols)};
/* a ring of upward sparks, for the daily chest and unlocks */
F.confetti=function(n){const cols=[glowCol,accCol,'#f5c451','#ffffff'];F.burst(innerWidth/2,innerHeight*.55,n||80,cols)};
})();

</script>

U.copyText=function(text,fallbackEl){
  const viaExec=()=>{try{if(fallbackEl){fallbackEl.focus();fallbackEl.select();return!!document.execCommand('copy')}}catch(e){}return false};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).then(()=>true,()=>viaExec());

/* ---------------- the celebration queue ----------------
   Level ups, gates, realms and new gear arrive close together. They wait their turn and play one after another.
   Tap anywhere to move on. */
const Q=[];let showing=false,tOv=null,kick=null;
/* order of importance when several moments arrive together: a penalty, the gate, the new realm, level-ups, gear, then the rest */
const PRIO={bad:1,boss:2,gate:2,realm:3,level:4,item:5};
U.cele=function(c){
  c.prio=PRIO[c.kind]||6;
  /* two level-ups in one go: only the last one matters */
  if(c.kind==='level'){for(let i=Q.length-1;i>=0;i--)if(Q[i].kind==='level')Q.splice(i,1)}
  Q.push(c);
  if(!showing){clearTimeout(kick);kick=setTimeout(()=>{Q.sort((a,b)=>a.prio-b.prio);nextCele()},70)}
};
function defaultHtml(c){
  return '<h1>'+esc(c.h||'')+'</h1>'+(c.big?'<div class="big">'+esc(c.big)+'</div>':'')+(c.p?'<p>'+esc(c.p)+'</p>':'')+(c.btn?'<button class="btn ovbtn" data-a="'+c.btn[0]+'">'+esc(c.btn[1])+'</button>':'');
}
function nextCele(){
  const c=Q.shift();
  if(!c){showing=false;return}
  showing=true;
  const o=$('#ov');$('#ovb').innerHTML=c.html||defaultHtml(c);
  $('#ovb').className='ovb k-'+(c.kind||'plain');
  o.className='on '+(c.kind||'');
  if(c.sound)F.play(c.sound);
  if(c.vib)F.vib(c.vib);
  if(c.fx)try{c.fx()}catch(e){}
  clearTimeout(tOv);tOv=setTimeout(closeCele,c.ms||2800);
}
let closing=false;
function closeCele(){
  if(closing)return;   /* two quick taps must close one card, not skip the next one unseen */
  closing=true;clearTimeout(tOv);$('#ov').className='';
  setTimeout(()=>{closing=false;nextCele()},260);
}
U.act.ovClose=closeCele;
U.clearCele=function(){Q.length=0;freshGear=[];clearTimeout(tOv);clearTimeout(kick);$('#ov').className='';showing=false;closing=false};
U.overlay=function(kind,h,big,p,ms){U.cele({kind:kind||'',h:h,big:big,p:p,ms:ms})};

/* ---------------- sheets ---------------- */
/* One history entry per open sheet, so the phone's Back button closes the sheet instead of leaving the app.
   The "pop" is delayed a moment: if another sheet opens straight away it reuses the same entry. */
let histOpen=false,backT=null,skipPop=0,pushWait=false;
const doPush=()=>{try{history.pushState({hs:1},'');histOpen=true}catch(e){}};
function pushHist(){
  if(backT){clearTimeout(backT);backT=null;histOpen=true;return}
  if(histOpen)return;
  if(skipPop>0){pushWait=true;return}   /* our own Back is still landing: push right after it, never in the middle of it */
  doPush();
}
function popHist(){
  if(!histOpen){pushWait=false;return}
  histOpen=false;
  backT=setTimeout(()=>{backT=null;skipPop++;try{history.back()}catch(e){skipPop--}setTimeout(()=>{skipPop=Math.max(0,skipPop-1);if(!skipPop&&pushWait){pushWait=false;doPush()}},700)},120);
}
U.openSheet=function(title,body,foot,opts){
  opts=opts||{};
  $('#shT').textContent=title;const b=$('#shBody');b.innerHTML=body;b.className=opts.col?'col':'';
  $('#shFoot').innerHTML=foot||'';$('#shFoot').hidden=!foot;
  $('#sheet').className=(opts.full?'full ':'')+'on';
  $('#scrim').classList.add('on');document.body.classList.add('lock');b.scrollTop=0;
  pushHist();
};
U.hideSheet=function(){
  $('#scrim').classList.remove('on');$('#sheet').classList.remove('on');document.body.classList.remove('lock');
  U.sh=null;
};
U.closeSheet=function(){U.hideSheet();U.render();popHist()};
U.closeSheetQuiet=function(){U.hideSheet();popHist()};
window.addEventListener('popstate',()=>{
  if(skipPop>0){skipPop--;if(!skipPop&&pushWait){pushWait=false;doPush()}return}
  if(backT){clearTimeout(backT);backT=null;return}
  if(histOpen){histOpen=false;U.hideSheet();U.render()}
});
U.act.close=U.closeSheet;
U.keepScroll=function(fn){const y=$('#shBody').scrollTop;fn();$('#shBody').scrollTop=y};

/* ---------------- navigation and rendering ---------------- */
const TABS=['home','armory','path','forge'];
U.render=function(anim){
  F.applyTheme();
  /* a plain re-render (after logging something) must not replay the whole entrance; only tab switches and boot do */
  $('#screen').classList.toggle('quiet',!anim);
  const v=U.views[U.tab];if(v)v();
  const idx=TABS.indexOf(U.tab),S=E.S();
  document.querySelectorAll('#dock button').forEach((b,i)=>{b.setAttribute('aria-selected',i===idx)});
  $('#dockInd').style.transform='translateX('+(idx*100)+'%)';
  const dots={armory:S.newItems.length>0,path:E.reviewDue(),forge:!!(E.backupDue&&E.backupDue())||!!U.update};
  TABS.forEach((t,i)=>{const b=document.querySelectorAll('#dock button')[i];if(b)b.classList.toggle('dot',!!dots[t])});
  const sb=$('#sndBtn');sb.innerHTML=E.cfg().sound?IC.on:IC.off;sb.className=E.cfg().sound?'':'off';
  const sc=$('#screen');
  if(anim){sc.classList.remove('in');void sc.offsetWidth;sc.classList.add('in')}
};
U.act.tab=function(v){if(v===U.tab)return;U.tab=v;F.play('nav');F.vib(8);U.render(true);$('#screen').scrollTop=0};
U.act.sound=function(){
  const c=E.cfg();c.sound=!c.sound;E.save();
  if(c.sound){F.unlock();F.play('pick')}
  U.render();
};

/* ---------------- event dispatch: data-a="name:arg" ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
  const fn=U.act[k];if(fn)fn(v,b,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sh)U.closeSheet()});

/* ---------------- voice ---------------- */
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
U.say=function(group,key,ctx){
  const lvl=E.cfg().roast||'playful';
  return HS.say(group,key,lvl,ctx||{seed:hashStr(E.dkey()+key+new Date().getHours())});
};
U.hype=function(key,ctx){const t=HS.say('hype',key,'playful',ctx);U.lastHype={text:t,t:Date.now()};return t};

/* ---------------- game events become moments ---------------- */
E.on('aura',n=>{
  if(!n)return;
  const e=document.createElement('div');e.className='apop '+(n<0?'neg':'pos');e.textContent=(n>0?'+':'−')+Math.abs(n)+' AURA';
  document.body.appendChild(e);setTimeout(()=>e.remove(),1400);
});
const ray='<div class="rays" aria-hidden="true"></div>';
E.on('level',e=>{
  const rk=e.rankUp,line=U.hype('level'),nx=E.lv();
  const hex='<svg class="hexb" viewBox="0 0 58 64" aria-hidden="true"><polygon points="29,2 55,17 55,47 29,62 3,47 3,17"/><text x="29" y="43" text-anchor="middle">'+e.to.rank+'</text></svg>';
  U.cele({kind:'level',sound:null,ms:rk?3800:3000,
    html:ray+'<h1>'+(rk?'RANK UP':'LEVEL UP')+'</h1>'+(rk?hex:'<div class="big">LV '+e.to.L+'</div>')+(rk?'<div class="big sm">LEVEL '+e.to.L+'</div>':'')+'<p>'+esc(line)+'</p><p class="sub">Next level at '+fmt(E.LVF(e.to.L+1))+' aura.</p>'});
});
E.on('locked',()=>U.sys('Level-up locked by fatigue. Train to break it.','bad'));
E.on('protein',()=>{U.sys(U.hype('protein'),'good');if(HS.ui.bubble)HS.ui.bubble()});
E.on('fatigue',on=>{if(on)U.sys('FATIGUED. Aura gains halved and levels locked until you train.','bad')});
E.on('penalty',p=>{
  const total=p.base+p.extra,roast=U.say('roast',p.why==='absent'?'absent':'skip');
  U.cele({kind:'bad',ms:p.why==='absent'?5200:4200,
    html:'<h1>'+(p.why==='absent'?'ABSENT':'QUEST FAILED')+'</h1><div class="big">−'+total+'</div><p>'+esc((p.why==='absent'?'You did not show up. ':'You skipped. ')+(p.strict==='chill'?'Aura lost.':'Fatigue holds your level until you train.')+(p.extra?' Second miss in a row hits twice.':''))+'</p>'+(roast?'<p class="roast">'+esc(roast)+'</p>':'')+(E.cfg().contract?'<p class="contract">Your contract: '+esc(E.cfg().contract)+'</p>':'')});
});
/* a gate falls: the shadow soldier rises from the ground */
E.on('kcal',k=>{(U.bossInfo=U.bossInfo||{}).kcal=k});
E.on('camp',c=>{(U.bossInfo=U.bossInfo||{}).camp=c});
E.on('boss',b=>{(U.bossInfo=U.bossInfo||{}).boss=b});
E.on('gate',g=>{
  const info=U.bossInfo||{};U.bossInfo=null;
  const n=E.S().gates.length,boss=!!g.boss,last=boss&&info.boss&&info.boss.last;
  const extra=[];
  if(boss&&!last&&info.kcal)extra.push('Daily target now '+info.kcal.to+' kcal (was '+info.kcal.from+').');
  if(boss&&!last&&info.camp)extra.push('Camp week: eat at '+fmt(info.camp.kcal)+' kcal for 7 days, train as normal.');
  const sold='<svg class="asold" viewBox="0 0 160 220" aria-hidden="true"><path d="'+HS.avatar.BODY+'"/><path d="'+HS.avatar.HEAD+'"/><rect class="se" x="67" y="29" width="10" height="4" rx="2"/><rect class="se" x="83" y="29" width="10" height="4" rx="2"/></svg>';
  U.cele({kind:boss?'boss':'gate',ms:boss?5200:3800,sound:'arise',vib:[40,40,40,40,220],
    fx:()=>F.burstCenter(boss?160:110),
    html:'<div class="arise"><div class="smoke">'+[0,1,2,3,4,5,6,7].map(i=>'<i style="--i:'+i+'"></i>').join('')+'</div>'+sold+'</div><h1 class="atxt">ARISE</h1><div class="big">'+g.kg+' kg</div><p>'+esc(boss?(last?'FINAL BOSS DOWN. You reached your goal.':'BOSS DOWN. A stronger shadow joins your army.'):(g.count>1?g.count+' gates fell at once. ':'Gate cleared. ')+'Shadow '+n+' joins your army.')+'</p>'+extra.map(x=>'<p class="sub">'+esc(x)+'</p>').join('')});
});
/* a new realm: the whole world changes */
E.on('realm',r=>{
  U.cele({kind:'realm',ms:4600,sound:'level',
    fx:()=>{setTimeout(()=>{F.applyTheme();U.render()},900);F.confetti(120)},
    html:ray+'<div class="kicker">NEW REALM</div><h1>'+esc(r.name.toUpperCase())+'</h1><p>'+esc(r.line)+'</p><p class="sub">The look of the whole app has changed. Change it any time in the Armory.</p>'});
});
E.on('realmpick',()=>{F.applyTheme();F.play('equip');U.render()});
/* gear that unlocks together is shown together: one card for one item, a grid for several */
let freshGear=[],freshT=null;
E.on('unlock',it=>{
  const S=E.S();if(S.newItems.indexOf(it.id)<0)S.newItems.push(it.id);E.persist();
  freshGear.push(it);clearTimeout(freshT);freshT=setTimeout(showGear,60);
});
function showGear(){
  const list=freshGear;freshGear=[];if(!list.length)return;
  const S=E.S();
  if(list.length===1){
    const it=list[0],slot=(HS.SLOTS.find(s=>s[0]===it.slot)||[0,it.slot])[1];
    U.cele({kind:'item',ms:3400,fx:()=>F.confetti(70),
      html:ray+'<div class="kicker">ITEM ACQUIRED</div><div class="icard">'+(it.slot==='title'?'<div class="ttl">\u00AB '+esc(it.name)+' \u00BB</div>':'<div class="iprev">'+HS.avatar.thumb(it,S.equip)+'</div>')+'<b>'+esc(it.name)+'</b><small>'+esc(slot)+' \u00B7 equipped</small></div><p>'+esc(it.desc)+'</p><button class="btn ovbtn" data-a="gotoArmory">Open the Armory</button>'});
    return;
  }
  U.cele({kind:'item',ms:4200,fx:()=>F.confetti(110),
    html:ray+'<div class="kicker">'+list.length+' ITEMS ACQUIRED</div><div class="igrid">'+list.slice(0,6).map(it=>'<div class="icard sm">'+(it.slot==='title'?'<div class="ttl sm">\u00AB '+esc(it.name)+' \u00BB</div>':'<div class="iprev">'+HS.avatar.thumb(it,S.equip)+'</div>')+'<b>'+esc(it.name)+'</b></div>').join('')+'</div>'+(list.length>6?'<p class="sub">and '+(list.length-6)+' more</p>':'')+'<button class="btn ovbtn" data-a="gotoArmory">Open the Armory</button>'});
}
U.act.gotoArmory=function(){closeCele();setTimeout(()=>{U.act.tab('armory')},120)};
E.on('goal',g=>{U.sys('Goal cleared: '+g.t+'. +'+g.aura+' aura. '+U.hype('goal'),'good',true);F.burstCenter(40)});
E.on('streak',s=>{
  const nm=HS.STREAK_NAMES[s.kind]||'Streak';
  U.sys(nm+' milestone! '+U.hype('streak',{n:s.step})+' +'+s.aura+' aura.','good',true);F.burstCenter(70);
});
E.on('bonus',b=>{
  if(b.auto){U.sys('Bonus quest done: '+b.t+'. +'+b.a+' aura. '+U.hype('bonus'),'good',true);F.play('goal');F.vib([20,40,20])}
  if(U.refreshBonus)U.refreshBonus(b.id);
});
E.on('bonusall',()=>{
  U.sys(U.hype('bonusall')+' +'+E.BONUS_ALL+' aura.','good',true);F.play('streak');F.vib([30,30,30,30,90]);F.confetti(70);
  if(U.refreshBonus)U.refreshBonus();
});
E.on('equip',()=>{F.play('equip');F.vib(12)});
E.on('clear',st=>{
  const line=st.score>=3?U.hype('clear'):st.score===2?'Half a day banked. Tomorrow is a clean slate. Never miss twice.':'Rough one. It happens. The System logged it honestly, and that counts. Show up tomorrow.';
  F.burstCenter(st.score>=3?60:20);
  U.cele({kind:'clear',ms:6000,sound:'quest',
    html:ray+'<h1>DAY CLEARED</h1><div class="big">'+st.score+' / 4</div><p>'+esc(line)+'</p><button class="btn ovbtn" data-a="chestOpen">Open today\'s chest</button>'});
});
E.on('reset',()=>{F.applyTheme();U.render(true)});
/* another copy of the app saved something: show it, but never rebuild the screen under an open sheet */
E.on('external',()=>{F.applyTheme();if(!U.sh)U.render()});
E.on('storagefail',()=>U.sys('This phone refused to save. Storage may be full or blocked. Save a backup file now (Forge, Data vault).','bad'));
E.on('pwa-update',()=>U.sys('A new version is ready. Close and reopen the app to get it.','',true));

/* quest combo: finishing quests back to back builds a combo with a rising note */
let comboN=0,comboT=0;
U.bump=function(){
  const now=Date.now();
  comboN=(now-comboT<90*60000)?comboN+1:1;comboT=now;
  if(comboN<2)return;
  const e=document.createElement('div');e.className='combo2';e.innerHTML='QUEST COMBO \u00D7'+comboN+'<small>'+(comboN>=4?'ON FIRE':'KEEP IT GOING')+'</small>';
  document.body.appendChild(e);setTimeout(()=>e.remove(),1500);
  F.play('star',Math.min(comboN-2,5));
};
E.on('meal',m=>{if(m.first)U.bump()});
E.on('workout',()=>U.bump());
E.on('protein',()=>U.bump());
E.on('rehab',()=>U.bump());
E.on('clear',()=>U.bump());
E.on('water',w=>{if(w.hit)U.bump()});
/* the backdrop drifts slower than the page as you scroll */
(function(){
  const sc=document.getElementById('screen');if(!sc)return;let raf=0;
  sc.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;sc.style.setProperty('--sy',sc.scrollTop+'px')})},{passive:true});
})();

/* ---------------- first run, boot ---------------- */
U.boot=function(){
  HS.avatar.mount();
  F.applyTheme();F.startBg();
  if(HS.pwa)HS.pwa.persist();
  E.compact();
  const sw=E.sweep(),S=E.S();
  E.checkUnlocks();E.checkGoals();
  U.render(true);
  if(!S.welcomed){
    if(Object.keys(S.weights).length||S.aura>0){S.welcomed=true;E.persist()}
    else setTimeout(()=>U.welcome&&U.welcome(),250);
  }
  /* Samsung Health: a quiet refresh when the app opens and whenever it comes back to the front (at most every 10 minutes) */
  const hAuto=()=>{if(HS.health&&HS.health.auto)HS.health.auto().then(r=>{if(r&&r.ok&&U.tab==='home'&&!U.sh)U.render()}).catch(()=>{})};
  hAuto();document.addEventListener('visibilitychange',()=>{if(!document.hidden)hAuto()});
  if(E.unreadable)setTimeout(()=>U.sys(E.recovered?'Your saved data could not be read, so yesterday\u2019s automatic copy was restored. The unreadable text is kept aside.':'Your saved data could not be read. The text is kept aside and nothing was overwritten. In the Forge, \u201cRestore yesterday\u2019s automatic copy\u201d may help.','bad'),900);
  if(sw.length){
    const missed=sw.filter(x=>!x.pass).length,pass=sw.filter(x=>x.pass).length;
    setTimeout(()=>{
      if(missed)U.sys('The System noticed '+missed+' missed session'+(missed>1?'s':'')+'. '+(U.say('roast','absent')||'Penalty applied.'),'bad');
      else if(pass)U.sys('A missed session was covered by your weekly rest pass.','');
    },700);
  }
  /* the Android app learns when a newer build is out */
  if(HS.native&&HS.native.checkUpdate)HS.native.checkUpdate().then(u=>{if(u){U.update=u;setTimeout(()=>{U.sys('A newer version is ready (build '+u.latest+'). Open the Forge to download it.','good',true);U.render()},1500)}}).catch(()=>{});
  /* manifest shortcuts: ?go=food | water | weigh */
  const go=(new URLSearchParams(location.search)).get('go');
  if(go)setTimeout(()=>{
    if(go==='food')U.plateSheet(U.mealNow());
    else if(go==='water')U.act.water&&U.act.water();
    else if(go==='weigh')U.weighSheet();
  },500);
  /* coming back to the app after a while: new day, new windows */
  let lastDay=E.dkey();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    if(E.dkey()!==lastDay){lastDay=E.dkey();E.sweep();E.checkUnlocks();E.checkGoals()}
    if(!U.sh)U.render();
  });
  setInterval(()=>{if(!document.hidden&&!U.sh&&U.tab==='home'&&!showing)U.views.home()},60000);
};
})();

</script>
<script>
/* ui-home.js: the Quests screen. The hunter in his realm, one clear next move, three quick tiles (water, streak, chest),
   this week's goals, today's rings and the daily quest list. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E,F=HS.fx,U=HS.ui;
const esc=U.esc,fmt=U.fmt,cap=U.cap,hhmm=U.hhmm,IC=U.IC,$=U.$,A=U.act;
const RCOL={E:'#8aa5c2',D:'#3ddc97',C:'#3aa8ff',B:'#8b5cff',A:'#f5c451',S:'#ff4d5e'};
const prev={};
function cnt(id,val,f,ms){const el=$('#'+id);if(!el)return;if(prev[id]!=null)el.dataset.v=prev[id];F.countTo(el,val,f,ms);prev[id]=val}
U.RCOL=RCOL;

/* ---------------- quests ---------------- */
U.rehabAura=n=>Math.min(100,n*8);
function rehabMinutes(){const k=E.rehabKeys().filter(x=>x!=='aero');return Math.max(4,Math.round(k.length*1.4))}
function gymQ(d,plan){
  if(plan==='Rest')return{id:'gym',ic:'moon',st:'done',t:'Rest day',s:'Recovery counts',r:''};
  const n=E.routine(plan).length;
  if(d.workout==='done')return{id:'gym',ic:'check',st:'done',t:plan+' day',s:'Done'+(d.burn?' · ~'+fmt(d.burn)+' kcal burned':''),r:'+100'};
  if(d.workout==='pain')return{id:'gym',ic:'check',st:'done',t:plan+' day',s:'Pain day, no penalty',r:''};
  if(d.workout==='pass')return{id:'gym',ic:'pass',st:'skip',t:plan+' day',s:'Rest pass used',r:''};
  if(d.workout==='lazy')return{id:'gym',ic:'x',st:'miss',t:plan+' day',s:'Skipped',r:'PENALTY'};
  return{id:'gym',ic:'gym',st:'todo',t:'Train: '+plan,s:E.fatigued()?'Comeback quest: breaks fatigue':n+' exercises',r:'+100'};
}
function rehabQ(d){
  const r=d.reh,pr=E.rehabProgress(),t=E.rehabToday();
  if(r&&r.done)return{id:'rehab',ic:'check',st:'done',t:'Rehab',s:pr.done+' of '+pr.total+' moves',r:'+'+U.rehabAura(r.n||pr.done)};
  const part=pr.done>0;
  const sub=part?pr.done+' of '+pr.total+' moves so far':pr.total+' moves · about '+rehabMinutes()+' min'+(t.hold?' · gentle ('+t.hold+')':'');
  return{id:'rehab',ic:'rehab',st:'todo',t:'Rehab',s:sub,r:'+'+U.rehabAura(pr.total)};
}
U.quests=function(){
  const d=E.day(),plan=E.planFor(),t=E.nowMin(),T=E.T(),tot=E.totals(d),out=[];
  out.push(d.weighed?{id:'weigh',ic:'scale',st:'done',t:'Weigh-in',s:E.S().weights[E.dkey()].toFixed(1)+' kg'+(d.sleep!=null?' · slept '+d.sleep+' h':''),r:'+15'}:{id:'weigh',ic:'scale',st:'todo',t:'Weigh-in',s:'Before food, plus last night’s sleep',r:'+15'});
  U.MEALS.forEach(m=>{
    const k=E.mealKcal(d,m),n=d.items.filter(i=>i.meal===m).length,w=U.WIN[m];
    const q={id:m,ic:'plate',t:cap(m),r:''};
    if(d.done[m])Object.assign(q,{st:'done',s:fmt(k)+' kcal'+(d.stars&&d.stars[m]?' · '+'★'.repeat(d.stars[m]):'')});
    else if(d.skip[m])Object.assign(q,{st:'skip',s:'Skipped',ic:'dash'});
    else if(!n&&t>w[1]+120)Object.assign(q,{st:'late',s:'Window missed',ic:'dash'});
    else Object.assign(q,{st:'todo',s:n?fmt(k)+' kcal so far':hhmm(w[0])+' to '+hhmm(w[1])});
    if(m==='dinner')out.push(gymQ(d,plan),rehabQ(d));
    out.push(q);
  });
  out.push(d.pAward?{id:'protein',ic:'prot',st:'done',t:'Protein '+T.protein+' g',s:Math.round(tot.p)+' g locked in',r:'+60'}:{id:'protein',ic:'prot',st:'prog',t:'Protein '+T.protein+' g',s:Math.round(tot.p)+' of '+T.protein+' g',r:'+60'});

/* ---------------- the one next move ---------------- */
U.nextMove=function(){
  const d=E.day(),m=E.nowMin(),T=E.T(),plan=E.planFor(),fat=E.fatigued(),qs=U.quests();
  const q=id=>qs.find(x=>x.id===id);
  const mk=(id,ic,title,sub,reward)=>({id:id,ic:ic,title:title,sub:sub,reward:reward});
  if(d.closed){
    if(!d.chest)return mk('chest','star','Open today’s chest','You cleared the day. Loot is waiting.','?');
    const left=E.bonusToday().filter(b=>!b.done);
    if(left.length)return mk('bonus','bolt','Bonus quests',left.length+' left today. Easy points, no penalty.','+'+left.reduce((a,b)=>a+b.a,0));
    return mk('rest','moon','Day cleared','Nothing left. Sleep is the last quest: aim for 7 hours.','');
  }
  const gq=q('gym'),open=gq&&gq.st==='todo';
  if(fat&&open)return mk('gym','gym','Break the fatigue','Finish '+plan+' day to lift the level lock and the aura penalty.','+100');
  if(!d.weighed&&m<720)return mk('weigh','scale','Step on the scale','Before food. Then tell the System how you slept.','+15');
  for(let i=0;i<3;i++){
    const ml=U.MEALS[i],w=U.WIN[ml],mq=q(ml);
    if(mq&&mq.st==='todo'&&m>=w[0]-30&&m<=w[1]+90){
      const mm=E.mealKcal(d,ml);
      return mk(ml,'plate','Log '+ml,mm?fmt(mm)+' kcal so far. Add more or finish the plate.':'Window '+hhmm(w[0])+' to '+hhmm(w[1])+'. Build your plate, 10 seconds.','+'+E.rateMeal(ml).stars*4);
    }
  }
  if(open)return mk('gym','gym','Train: '+plan,E.routine(plan).length+' exercises. Tap a bubble per set.','+100');
  const rq=q('rehab');
  if(rq&&rq.st==='todo')return mk('rehab','rehab','Rehab session',rq.s+'. The boring work that heals you.','+'+U.rehabAura(E.rehabProgress().total));
  if(!d.weighed)return mk('weigh','scale','Weigh in','Even late counts. Data beats guessing.','+15');
  const mpend=U.MEALS.find(ml=>{const mq=q(ml);return mq&&mq.st==='todo'&&m>U.WIN[ml][0]});
  if(mpend)return mk(mpend,'plate','Log '+mpend,'Still open. Fast taps, no judgement.','+8');
  if((d.water||0)<E.waterPace()-300)return mk('water','drop','Drink water',fmt(d.water||0)+' of '+fmt(E.cfg().water)+' ml. A bottle now catches you up.','+30');
  if(!d.pAward)return mk('protein','prot','Close the protein gap',fmt(Math.max(0,T.protein-E.totals(d).p))+' g to go. Eggs, soya or chicken do it.','+60');
  if(E.nowMin()>=1140||qs.every(x=>x.id==='close'||x.st!=='todo'))return mk('close','moon','Clear the day','Final tally, then your chest.','+80');
  return mk('close','moon','You are ahead of the day','Keep going, or clear the day when you are done.','');
};

};

<script>
/* ui-path.js: the Path. Final form, pace against plan, the whole campaign to 70 kg, streaks, weekly report, recovery, steps. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E,F=HS.fx,U=HS.ui;
const esc=U.esc,fmt=U.fmt,cap=U.cap,IC=U.IC,$=U.$,A=U.act;
const prev={};
function cnt(id,val,f,ms){const el=$('#'+id);if(!el)return;if(prev[id]!=null)el.dataset.v=prev[id];F.countTo(el,val,f,ms);prev[id]=val}

const BODY=HS.avatar.BODY,HEAD=HS.avatar.HEAD;
function ghost(){
  return `<svg class="gsil" viewBox="0 0 160 220" aria-hidden="true"><defs><clipPath id="gclip"><rect id="gclipR" x="0" y="220" width="160" height="0" style="y:${prev.gy!=null?prev.gy:220}px;height:${prev.gh!=null?prev.gh:0}px"/></clipPath></defs>

    <g class="gfill" clip-path="url(#gclip)"><path d="${BODY}"/><path d="${HEAD}"/></g></svg>`;
}
function radar(st){
  const keys=['STR','VIT','AGI','SNS'],mx=Math.max.apply(null,keys.map(k=>st[k])),cap2=Math.max(10,Math.ceil(mx/10)*10),cx=110,cy=110,R=70;
  const ang=[-90,0,90,180];
  const pt=(i,f)=>[cx+Math.cos(ang[i]*Math.PI/180)*R*f,cy+Math.sin(ang[i]*Math.PI/180)*R*f];
  const ring=f=>keys.map((k,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' ');
  const poly=keys.map((k,i)=>pt(i,Math.max(.04,st[k]/cap2)).map(n=>n.toFixed(1)).join(',')).join(' ');
  let s='<svg class="radar" viewBox="-40 0 300 220" role="img" aria-label="Stat radar">';
  [.25,.5,.75,1].forEach(f=>{s+='<polygon class="rg" points="'+ring(f)+'"/>'});
  keys.forEach((k,i)=>{const p=pt(i,1);s+='<line class="rg" x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>'});
  s+='<polygon class="rpoly" points="'+poly+'"/>';
  keys.forEach((k,i)=>{const p=pt(i,1.2);const a=i===3?'end':i===1?'start':'middle';s+='<text class="rtx" x="'+p[0].toFixed(1)+'" y="'+(p[1]+(i===0?-2:i===2?10:4)).toFixed(1)+'" text-anchor="'+a+'">'+k+' <tspan class="rv">'+st[k]+'</tspan></text>'});

}

/* ---------------- plan versus you: the line you are supposed to follow and the line you are actually on ---------------- */
function planChart(){
  const S=E.S(),p=E.plan(),today=Math.max(0,E.daysBetween(S.start,E.dkey()));
  const span=Math.max(56,Math.ceil((today+42)/7)*7);
  const W=320,H=170,pl=36,pr=8,pt=10,pb=24,pw=W-pl-pr,ph=H-pt-pb;
  const nodes=[{d:0,kg:S.startW}];p.gates.forEach(g=>{nodes.push({d:g.week*7,kg:g.kg});if(g.camp)nodes.push({d:g.camp*7,kg:g.kg})});
  const wAt=d=>{for(let i=1;i<nodes.length;i++){if(d<=nodes[i].d){const a=nodes[i-1],b=nodes[i],f=b.d===a.d?1:(d-a.d)/(b.d-a.d);return a.kg+(b.kg-a.kg)*f}}return S.cfg.goalW};
  const wk=Object.keys(S.weights).sort();
  const yMax=Math.ceil(S.startW+.3),yMin=Math.floor(Math.min(wAt(span),E.trend(),wk.length?Math.min.apply(null,wk.map(k=>S.weights[k])):99)-.3);
  const X=d=>pl+d/span*pw,Y=kg=>pt+(yMax-kg)/(yMax-yMin)*ph;
  let g='';
  for(let kg=yMax;kg>=yMin;kg--)g+='<line class="cg" x1="'+pl+'" y1="'+Y(kg).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(kg).toFixed(1)+'"/><text class="cx" x="'+(pl-6)+'" y="'+(Y(kg)+3).toFixed(1)+'" text-anchor="end">'+kg+'</text>';
  for(let w=0;w*7<=span;w+=Math.max(1,Math.round(span/7/5)))g+='<text class="cx" x="'+X(w*7).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">W'+w+'</text>';
  let plan='';for(let d=0;d<=span;d+=2)plan+=(d?'L':'M')+X(d).toFixed(1)+' '+Y(wAt(d)).toFixed(1);
  let tp='',dots='';
  wk.forEach((k,i)=>{const d=E.daysBetween(S.start,k);if(d<0||d>span)return;tp+=(tp?'L':'M')+X(d).toFixed(1)+' '+Y(E.trendAt(k)).toFixed(1);dots+='<circle class="cd" cx="'+X(d).toFixed(1)+'" cy="'+Y(S.weights[k]).toFixed(1)+'" r="2.4"/>'});
  const tx=X(today).toFixed(1);
  return `<svg class="pchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight against the plan">${g}
    <path class="cplan" d="${plan}"/>${tp?'<path class="ctrend" d="'+tp+'" pathLength="100"/>':''}${dots}
    <line class="ctoday" x1="${tx}" y1="${pt}" x2="${tx}" y2="${pt+ph}"/><text class="cx" x="${tx}" y="${pt+8}" text-anchor="${today>span*.75?'end':'start'}" dx="${today>span*.75?-4:4}">today</text></svg>
    <div class="legend"><span><b style="background:var(--gold)"></b>The plan</span><span><b style="background:var(--glow)"></b>Your trend</span><span><b style="background:#fff;border-radius:50%"></b>Weigh-ins</span></div>`;
}

/* ---------------- the Path screen ---------------- */
function paceCopy(ex){
  if(!Object.keys(E.S().weights).length)return{c:'info',t:'Weigh in to see your pace'};
  if(ex.ahead>=.2)return{c:'good',t:'AHEAD OF PLAN · '+ex.ahead.toFixed(1)+' kg'};
  if(ex.ahead<=-.2)return{c:'warn',t:'BEHIND PLAN · '+Math.abs(ex.ahead).toFixed(1)+' kg. Normal. Adjust, don’t panic.'};
  return{c:'good',t:'ON PLAN'};
}
