      <div class="rcn">${esc(r.name||'Realm '+(i+1))}</div>
      <div class="rcw">${r.from} → ${r.to} kg · weeks ${r.w0} to ${r.w1} · ${r.gates} gates</div>
      <div class="rcw">Eat about <b>${r.kcal0}→${r.kcal1} kcal</b> a day · protein ${S.cfg.protein} g</div>
      <div class="rcr">Boss gate at ${r.to} kg unlocks: ${rewards.length?esc(rewards.join(', ')):'new gear'}${i<pl.realms.length-1?' · then a camp week at maintenance':''}</div>
      <button class="rcb" data-a="rcopen:${i}" aria-expanded="${open}">${open?'Hide':'Show'} the ${gates.length} gates</button>
      ${open?'<div class="gl">'+gates.map(g=>`<div class="${S.gates.indexOf(g.kg)>=0?'got':''}"><b>${g.kg} kg</b><span>week ${g.week} · ${U.date(g.date)}</span><i>${S.gates.indexOf(g.kg)>=0?'✓':g.boss?'★':''}</i></div>`).join('')+'</div>':''}
    </div>`;
  };
  const palace=HS.REALMS[HS.REALMS.length-1];
  U.openSheet('The campaign',
    `<div class="hint">Your whole route from ${S.startW} kg to ${S.cfg.goalW} kg, one realm at a time.</div>
    <div class="dis"><div><span>GATES</span><b>${pl.gates.length}</b></div><div><span>WEEKS</span><b>${pl.weeks}</b></div><div><span>CAMP WEEKS</span><b>${camps}</b></div></div>
    <div class="note">At plan pace you cross the finish line around <b>${U.dateY(pl.finish)}</b>. Right now you are ${ex.ahead>=.2?ex.ahead.toFixed(1)+' kg ahead of plan':ex.ahead<=-.2?Math.abs(ex.ahead).toFixed(1)+' kg behind plan':'on plan'}.</div>
    <div class="sec">The realms</div>
    ${pl.realms.map(realmCard).join('')}
    <div class="rc2 final"><div class="rch"><b>FINAL FORM</b><span>${S.gates.indexOf(S.cfg.goalW)>=0?'REACHED':'THE END'}</span></div><div class="rcn">${esc(palace.name)}</div><div class="rcw">Reach ${S.cfg.goalW} kg and the palace opens: gold light, the Halo, the Regalia and the title Shadow Monarch.</div></div>
    <div class="sec">How the plan adapts</div>
    <ul class="stop"><li><b>Boss gates</b> lower your daily calories a little (about 60 kcal), so the pace holds as you get lighter.</li>
    <li><b>Camp weeks</b>: after each boss you eat at maintenance for seven days and train as normal. It protects muscle, mood and your next push.</li>
    <li><b>Weekly report</b> looks at your real trend and tells you to hold, trim or add food. If you drop faster than about 0.9 kg a week it adds calories, because fast loss costs muscle.</li>
    <li>Every gate is 0.5 kg of <i>trend</i>, not one scale reading. One heavy day moves it a quarter of the way at most.</li></ul>
    <div class="small">Dates assume you hold about 0.5 kg a week. Real life varies. If you fall behind, the plan stretches. It never punishes you with a worse target.</div>`,
    '<button class="btn ghost" data-a="close">Close</button>');
}
A.rcopen=function(v){U.sh.open[v]=!U.sh.open[v];U.keepScroll(renderCampaign)};
A.campaign=function(){F.play('nav');U.campaignSheet()};

/* ---------------- weekly report ---------------- */
U.reportSheet=function(){
  U.sh={type:'report'};
  const r=E.report(),tgt=E.T(),S=E.S();
  const row=(l,v,sub)=>`<div class="q"><span>${l}${sub?'<small class="sb2">'+sub+'</small>':''}</span><span>${v}</span></div>`;
  U.openSheet('Weekly report',
    `<div class="hint">The last seven days, read by the System.</div>
    <div class="adv ${r.advice.tone}"><b>${esc(r.advice.title)}</b><span>${esc(r.advice.text)}</span></div>
    <div class="sec">The week</div>
    ${row('Days cleared',r.closed+' / 7')}
    ${row('Inside the calorie window',r.cal+' / '+r.closed,'Target '+fmt(tgt.lo)+' to '+fmt(tgt.hi)+' kcal')}
    ${row('Protein target days',r.protein+' / 7','Target '+tgt.protein+' g')}
    ${row('Workouts finished',String(r.workouts),r.skipped?r.skipped+' skipped':'')}
    ${row('Rehab days',r.rehab+' / 7')}
    ${row('Water target days',r.water+' / 7','Target '+(S.cfg.water/1000).toFixed(1)+' L')}
    ${row('Weigh-ins',r.weighIns+' / 7')}
    ${row('Sleep, average',r.sleepAvg!=null?r.sleepAvg+' h':'not logged')}
    ${row('Eaten on average',r.kcalAvg!=null?fmt(r.kcalAvg)+' kcal':'no data')}
    ${row('Trend change',r.rate!=null?(r.rate>=0?'−':'+')+Math.abs(r.rate).toFixed(2)+' kg':'needs 4 weigh-ins')}
    <div class="note">Trend is the smoothed line, not one reading. Honest logging matters more than a perfect week.</div>`,
    '<button class="btn good" data-a="shareWeek">Share this week</button><button class="btn ghost" data-a="close">Got it</button>');
  E.reviewSeen();
};
A.report=function(){F.play('nav');U.reportSheet()};
A.shareWeek=function(){
  const S=E.S(),r=E.report(),L=E.lv(),tr=E.trend(),n=S.cfg.name||'Hunter';
  const t=n+' \u00B7 Level '+L.L+' (rank '+L.rank+') \u00B7 '+tr.toFixed(1)+' kg ('+(tr<=S.startW?'\u2212':'+')+Math.abs(S.startW-tr).toFixed(1)+' since the start)\nThis week: '+r.workouts+' workouts, '+r.rehab+' rehab days, protein hit '+r.protein+' days, water '+r.water+' days.\nClear streak: '+E.streak('clear')+' days. Gates cleared: '+S.gates.length+' of '+E.ladder().length+'.';
  if(navigator.share){navigator.share({title:'My week on Habit Sync',text:t}).catch(()=>{});return}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');
};

/* ---------------- goals and streaks ---------------- */
U.goalsSheet=function(){
  U.sh={type:'goals'};
  const goals=E.goalsActive(),daysLeft=7-E.di();
  const card=g=>`<div class="gl2${g.done?' done':''}"><div><b>${esc(g.t)}</b><small>${esc(g.d)}</small><div class="xp"><i style="width:${Math.min(100,g.have/g.need*100)}%"></i></div></div><span>${g.done?'✓':g.have+'/'+g.need}<em>+${g.aura}</em></span></div>`;
  const strk=Object.keys(HS.STREAK_NAMES).map(k=>{
    const n=E.streak(k),next=HS.STREAK_STEPS.find(x=>x>n);
    return `<div class="gl2"><div><b>${esc(HS.STREAK_NAMES[k])}</b><small>${next?next-n+' more day'+(next-n===1?'':'s')+' to the '+next+'-day reward (+'+HS.STREAK_AURA[next]+')':'Every milestone cleared. Legend.'}</small><div class="xp"><i style="width:${next?Math.min(100,n/next*100):100}%"></i></div></div><span class="fl">${U.flame(n)}<b>${n}</b></span></div>`}).join('');
  U.openSheet('Goals and streaks',
    `<div class="hint">Five goals each week, picked fresh every Monday. They reset in ${daysLeft} day${daysLeft===1?'':'s'}.</div>
    ${goals.map(card).join('')}
    <div class="sec">Streaks</div>
    <div class="small" style="margin-top:0">Milestones at ${HS.STREAK_STEPS.join(', ')} days pay ${HS.STREAK_STEPS.map(s=>'+'+HS.STREAK_AURA[s]).join(', ')} aura. Training streaks ignore rest days and pain days. The clear streak forgives one off day, because never missing <i>twice</i> is the rule that works.</div>
    ${strk}`,
    '<button class="btn ghost" data-a="close">Close</button>');
};
A.streaks=function(){F.play('nav');U.goalsSheet()};
})();

</script>
<script>
/* ui-forge.js: the Forge. Everything you can customise, plus the data vault (backup, restore, storage) that keeps the app alive for years.
   Also the first-run welcome. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E,F=HS.fx,U=HS.ui;
const esc=U.esc,fmt=U.fmt,cap=U.cap,IC=U.IC,$=U.$,A=U.act;
let rTab='Push';

const NUMF=[
  ['Profile and goals',[
    ['name','Name','text'],['startW','Starting weight (kg)','num',{step:.1,root:true}],['goalW','Goal weight (kg)','num',{step:.5}],['bossEvery','Boss gate every (kg)','num',{step:1}]]],
  ['Daily targets',[['kcal','Daily calories','num',{step:50}],['protein','Daily protein (g)','num',{step:5}],['water','Water target (ml)','num',{step:250}],['stepGoal','Step goal (0 = none yet)','num',{step:500}]]]
];
function fieldRow(f){
  const c=E.cfg(),S=E.S(),val=f[3]&&f[3].root?S[f[0]]:c[f[0]];
  return `<label class="fr"><span>${f[1]}</span><input ${f[2]==='num'?'type="number" inputmode="decimal" step="'+((f[3]&&f[3].step)||1)+'"':'type="text" maxlength="14"'} data-cfg="${f[0]}" ${f[3]&&f[3].root?'data-root="1"':''} value="${esc(val)}"></label>`;
}
const seg=(act,opts,cur)=>`<div class="seg2">${opts.map(o=>`<button data-a="${act}:${o[0]}" aria-pressed="${String(cur)===String(o[0])}">${o[1]}</button>`).join('')}</div>`;
function routineEditor(){
  const list=E.routine(rTab);
  return `<div class="tg">${['Push','Pull','Legs'].map(t=>`<button data-a="rtab:${t}" aria-pressed="${rTab===t}">${t}</button>`).join('')}</div>
   <div class="small">${list.length} exercises · ${list.reduce((a,x)=>a+x.sets,0)} sets. Two exercises per muscle at three sets each is plenty on a deficit. Weights are logged in the workout, so this list only holds the plan.</div>
   ${list.map((x,i)=>`<div class="rxr"><div class="rxn"><input data-rx="n" data-i="${i}" value="${esc(x.n)}" aria-label="Exercise name"><input data-rx="g" data-i="${i}" value="${esc(x.g)}" aria-label="Muscle group" class="sm"></div>
     <div class="rxc"><div class="mini"><button data-a="rxs:${i}:-1" aria-label="Fewer sets">−</button><b>${x.sets}</b><span>sets</span><button data-a="rxs:${i}:1" aria-label="More sets">+</button></div>
     <div class="mini"><button data-a="rxr:${i}:-1" aria-label="Fewer reps">−</button><b>${x.reps}</b><span>reps</span><button data-a="rxr:${i}:1" aria-label="More reps">+</button></div>
     <button class="capb" data-a="rxcap:${i}" aria-pressed="${!!x.cap}">cap ${HS.CAP_KG} kg</button><button class="del" data-a="rxdel:${i}" aria-label="Remove">×</button></div></div>`).join('')}
   <div class="rxadd"><input id="rxNew" placeholder="New exercise" aria-label="New exercise name"><input id="rxNewG" placeholder="Muscle" class="sm" aria-label="Muscle group"><button data-a="rxadd">Add</button></div>`;
}
function strictTxt(s){return s==='chill'?'Skipping a session costs 30 aura. No fatigue.':s==='hard'?'Skipping costs 100 aura, a strength point and fatigue. A second miss in a row hits twice.':'Skipping costs 60 aura and fatigue: aura gains are halved and your level is locked until you train. Absence is punished too.'}
function roastTxt(r){return r==='off'?'No teasing. Only encouragement.':r==='savage'?'Savage: sharper lines when you skip. Still only about the habit you skipped, never your body or looks.':'Playful: light teasing when you skip. Only about the habit you skipped, never your body or looks.'}

/* ---------------- data vault ---------------- */
function vaultHtml(){
  const info=E.dataInfo(),P=HS.pwa||{},kb=(info.bytes/1024).toFixed(0);
  const age=info.backupAgeDays;
  const bk=info.lastBackup?(age===0?'today':age===1?'yesterday':age+' days ago'):'never';
  const due=E.backupDue();
  return `<div class="vault ${due?'due':''}"><div><span>DAYS STORED</span><b>${info.days}</b></div><div><span>SIZE</span><b>${kb} KB</b></div><div><span>LAST BACKUP</span><b>${bk}</b></div></div>
   ${due?'<div class="warn" style="margin-top:10px">Your data lives only on this phone. Save a backup file now and then (it takes five seconds). It is your insurance if the phone is lost or reset.</div>':''}
   <div class="stack2"><button class="btn good" data-a="bkSave">${IC.down.replace('<svg','<svg class="bi"')}Save a backup file</button>
    <button class="btn ghost" data-a="bkCopy">Copy backup text</button>
    <label class="btn ghost filebtn">Restore from a backup file<input type="file" accept=".json,application/json,text/plain" id="restoreFile" hidden></label>
    <button class="btn ghost" data-a="bkAuto">Restore yesterday’s automatic copy</button>
    ${E.undoInfo()?'<button class="btn ghost" data-a="undo">Undo last reset or restore \u00B7 '+E.undoInfo().days+' days</button>':''}</div>
   <div class="small">${P.persisted===true?'Storage is protected: the browser will not clear it when space runs low.':P.persisted===false?'The browser may clear storage if the phone runs very low on space. Install the app or save backups.':'Storage protection status is unknown here.'}
     ${P.native?' You are using the Android app, which keeps its data in private app storage.':P.standalone?' Installed as an app.':''}</div>
   ${P.deferred?'<div class="stack2"><button class="btn vio" data-a="install">Install on this phone</button></div>':''}
   <div id="exWrap"></div>`;
}
E.backupDue=function(){const i=E.dataInfo();return i.days>=7&&(i.backupAgeDays==null||i.backupAgeDays>=21)};
E.on('pwa',()=>{if(U.tab==='forge'&&!U.sh)U.views.forge()});

/* ---------------- the screen ---------------- */
U.views.forge=function(){
  const c=E.cfg(),N=HS.native,Hh=HS.health;
  let h='';let i=0;
  if(U.update)h+=`<a class="btn good rise lnk" style="--i:0;margin:0 0 14px" target="_blank" rel="noopener" href="${esc(U.update.url)}">Update ready: download build ${U.update.latest} (you have ${HS.BUILD})</a>`;
  h+=`<button class="btn ghost rise" style="--i:0;margin-bottom:14px" data-a="help">How the game works</button>`;i++;
  NUMF.forEach(sec=>{h+=`<div class="win rise" style="--i:${i++}"><div class="wt">[ ${sec[0]} ]</div><div class="wb">${sec[1].map(fieldRow).join('')}
    ${sec[0]==='Profile and goals'?`<div class="fr"><span>Gate size</span><div class="seg2">${[.5,1].map(g=>`<button data-a="gate:${g}" aria-pressed="${c.gateStep===g}">${g} kg</button>`).join('')}</div></div>
      <div class="fr"><span>Camp week after each boss</span>${seg('camp',[[1,'On'],[0,'Off']],c.camp!==false?1:0)}</div>
      <div class="fr"><span>Auto-lower calories at bosses</span>${seg('autok',[[1,'On'],[0,'Off']],c.autoKcal!==false?1:0)}</div>
      <div class="fr"><span>Your day ends at</span>${seg('dayend',[[0,'12 am'],[2,'2 am'],[3,'3 am'],[4,'4 am']],c.dayStart==null?3:c.dayStart)}</div>
      <div class="small">Go to bed after midnight? Quests, the chest and your streak stay on the same day until this hour.</div>`:''}
    ${sec[0]==='Daily targets'?'<div class="small">Starting estimates. After two to three weeks, your weight trend should decide whether to move them.</div>':''}</div></div>`});
  h+=`<div class="win rise" style="--i:${i++}"><div class="wt">[ Rules, penalties and teasing ]</div><div class="wb">
    <div class="small" style="margin-top:0">Penalties</div>${seg('strict',[['chill','Chill'],['standard','Standard'],['hard','Hard']],c.strict).replace('seg2','seg2 full')}
    <div class="small" id="strictTxt">${strictTxt(c.strict)}</div>
    <div class="small">Pain days never count as a skip. You also get one rest pass a week.</div>
    <div class="small" style="margin-top:14px">Teasing when you slack</div>${seg('roast',[['off','Off'],['playful','Playful'],['savage','Savage']],c.roast).replace('seg2','seg2 full')}
    <div class="small" id="roastTxt">${roastTxt(c.roast)}</div>
    <label class="fr col"><span>Habit contract: a real cost when you skip (you enforce it)</span><textarea data-cfg="contract" rows="2" placeholder="e.g. No Instagram or YouTube until I train. Rs 100 into the cheat jar.">${esc(c.contract)}</textarea></label></div></div>
   <div class="win rise" style="--i:${i++}"><div class="wt">[ Look and feel ]</div><div class="wb">
    <div class="themes">
      <button class="th auto" data-a="theme:auto" aria-pressed="${c.theme==='auto'}" style="--c:${F.THEMES[E.realm().theme].glow};--c2:${F.THEMES[E.realm().theme].acc}"><i></i>My realm</button>
      ${Object.keys(F.THEMES).map(k=>`<button class="th" data-a="theme:${k}" aria-pressed="${c.theme===k}" style="--c:${F.THEMES[k].glow};--c2:${F.THEMES[k].acc}"><i></i>${F.THEMES[k].name}</button>`).join('')}</div>
    <div class="small">"My realm" changes the look every time a boss gate falls. Pick a fixed colour if you prefer.</div>
    <label class="fr"><span>Sound</span>${seg('snd',[[1,'On'],[0,'Off']],c.sound?1:0)}</label>
    <label class="fr col"><span>Volume</span><input type="range" min="0" max="1" step="0.05" value="${c.volume}" data-vol="1" aria-label="Volume"></label>
    <label class="fr"><span>Vibration</span>${seg('hap',[[1,'On'],[0,'Off']],c.haptics?1:0)}</label></div></div>`;
  if(N&&N.native()){
    const hs=E.S().health,rm=E.S().remind;
    h+=`<div class="win rise" style="--i:${i++}"><div class="wt">[ Samsung Health ]</div><div class="wb">
      ${hs.on?`<div class="hrow"><div><b>Connected</b><small>Steps, active calories, sleep and weight, read-only.</small></div><button class="btn ghost sm" data-a="hsync">Sync now</button></div>`:`<div class="small" style="margin-top:0">Reads steps, active calories, sleep and weight from Samsung Health through Health Connect. Nothing is written back and nothing leaves your phone.</div><div class="stack2"><button class="btn good" data-a="hconnect">Connect Samsung Health</button></div>`}
      <div class="small">If the permission window does not appear, open Samsung Health, then Settings, then Health Connect, and allow it there.</div></div></div>
     <div class="win rise" style="--i:${i++}"><div class="wt">[ Reminders ]</div><div class="wb">
      <label class="fr"><span>Daily nudges</span>${seg('remind',[[1,'On'],[0,'Off']],rm.on?1:0)}</label>
      ${rm.on?['weigh','lunch','dinner','rehab','clear'].map(k=>`<label class="fr"><span>${{weigh:'Weigh-in',lunch:'Lunch',dinner:'Dinner',rehab:'Rehab',clear:'Clear the day'}[k]}</span><input type="time" data-rm="${k}" value="${esc(rm[k]||HS.notify.DEFAULT[k])}"></label>`).join(''):''}
      <div class="small">Friendly pokes from the System at the times you choose. They are scheduled on this phone, no internet needed.</div></div></div>`;
  }
  h+=`<div class="win rise" style="--i:${i++}"><div class="wt">[ Training routine ]</div><div class="wb" id="rxWrap">${routineEditor()}</div></div>
   <div class="win rise" style="--i:${i++}"><div class="wt">[ Data vault ]</div><div class="wb" id="vaultWrap">${vaultHtml()}
    <div class="stack2"><button class="btn bad" data-a="reset" id="resetBtn">Reset everything</button></div></div></div>
   <div class="foot">Habit Sync ${HS.VERSION||''}. Every number on this screen stays on this phone. Calories and protein are rough estimates.</div>`;
  $('#screen').innerHTML=h;
  const rf=$('#restoreFile');if(rf)rf.addEventListener('change',onRestoreFile);
};

/* ---------------- how the game works ---------------- */
A.help=function(){
  U.sh={type:'help'};
  const S=E.S(),c=S.cfg,pl=E.plan();
  const sec=(t,b)=>`<div class="sec">${t}</div><div class="hp2">${b}</div>`;
  U.openSheet('How it works',
    sec('Aura and levels','Everything you do earns <b>aura</b>: a weigh-in, a finished plate, a workout, rehab, water, sleep, a cleared day. Aura builds your level. Level 2 needs 200 aura, level 8 (rank D) about 9,800, and each rank after that takes longer. Early levels come fast so you feel progress. Later ones are earned.')+
    sec('Quests and clearing the day','Each day has quests: weigh-in with last night\u2019s sleep, three meals, a workout (or rest), rehab, protein. Four things score the day: <b>protein</b>, <b>calories inside the window</b>, <b>workout</b> and <b>rehab</b>. Three of four is a good day, four of four is a perfect one. Clearing the day pays a calorie bonus and opens a chest: common, rare for 3 of 4, epic for 4 of 4.')+
    sec('Real penalties','Skipping a session with no pain costs aura and gives you <b>fatigue</b>: aura gains are halved and your level is locked until you train. Missing a planned session without opening the app is punished when you come back. <b>Pain days are never punished</b>, and you get <b>one rest pass a week</b>. Strictness (Chill, Standard, Hard) is in the Forge.')+
    sec('Plates and stars','Every finished plate gets up to three stars: one for logging it, one for 25 g of protein or more, one for balance (a veg side, no sugar, not more than half your day\u2019s calories). Stars pay aura. Sugar and outside food cost a little aura, on purpose.')+
    sec('Streaks and goals','Five weekly goals are picked fresh every Monday. Streaks pay milestone rewards at 3, 7, 14, 30 and 60 days. Training streaks skip rest days and pain days. The clear streak forgives one off day, because never missing <i>twice</i> is the rule that works.')+
    sec('Gates, bosses and realms','You are going from '+S.startW+' kg to '+c.goalW+' kg in '+pl.gates.length+' gates of '+c.gateStep+' kg of <i>trend</i>. Every fourth kilo is a <b>boss gate</b>: it opens a new realm that changes the colours, backdrop and weather of the whole app, unlocks gear, lowers your daily calories a little, and starts a <b>camp week</b> at maintenance so you recover before the next push.')+
    sec('Gear','Gear is never bought. It unlocks when you do the work, and the closest unlock is always shown in the Armory. Wear whatever you have earned.')+
    sec('Rehab','Rehab comes from your physio\u2019s list, spread over the training cycle. The guided session shows one move at a time with a moving outline and a hold timer. Your pain check-in sets a traffic light: green carries on, amber holds the strength work back, red keeps it gentle and tells you to message your physio.')+
    sec('Your data','Everything is stored on this phone only. Save a backup file now and then from the Data vault in the Forge. Your day ends at '+(c.dayStart==null?3:c.dayStart)+' am, so clearing it after midnight still counts for yesterday.'),
    '<button class="btn" data-a="close">Got it</button>');
};

/* ---------------- settings actions ---------------- */
A.gate=v=>{E.cfg().gateStep=parseFloat(v);E.save();U.render()};
A.camp=v=>{E.cfg().camp=v==='1';E.save();U.render()};
A.autok=v=>{E.cfg().autoKcal=v==='1';E.save();U.render()};
A.dayend=v=>{E.cfg().dayStart=+v;E.setShift(+v);E.save();U.render()};
A.strict=v=>{E.cfg().strict=v;E.save();U.render()};
A.roast=v=>{E.cfg().roast=v;E.save();F.play(v==='off'?'pick':'wah');U.render()};
A.theme=v=>{E.cfg().theme=v;E.save();F.applyTheme();F.play('pick');U.render()};
A.snd=v=>{E.cfg().sound=v==='1';E.save();if(E.cfg().sound){F.unlock();F.play('pick')}U.render()};
A.hap=v=>{E.cfg().haptics=v==='1';E.save();F.vib(30);U.render()};
A.rtab=v=>{rTab=v;$('#rxWrap').innerHTML=routineEditor()};
A.rxs=v=>{const p=v.split(':'),x=E.routine(rTab)[+p[0]];x.sets=Math.max(1,Math.min(8,x.sets+ +p[1]));E.save();$('#rxWrap').innerHTML=routineEditor()};
A.rxr=v=>{const p=v.split(':'),x=E.routine(rTab)[+p[0]];x.reps=Math.max(1,Math.min(30,x.reps+ +p[1]));E.save();$('#rxWrap').innerHTML=routineEditor()};
A.rxcap=v=>{const x=E.routine(rTab)[+v];x.cap=!x.cap;E.save();$('#rxWrap').innerHTML=routineEditor()};
A.rxdel=v=>{E.routine(rTab).splice(+v,1);E.save();$('#rxWrap').innerHTML=routineEditor()};
A.rxadd=()=>{const n=$('#rxNew').value.trim();if(!n){U.sys('Type an exercise name first.','bad');return}
  E.routine(rTab).push({n:n,g:$('#rxNewG').value.trim()||'Other',sets:3,reps:10});E.save();F.play('pick');$('#rxWrap').innerHTML=routineEditor()};
A.install=async function(){const ok=await HS.pwa.install();U.sys(ok?'Installed. Open it from your home screen.':'Install cancelled.','');};
A.remind=async function(v){
  const rm=E.S().remind;
  if(v==='1'){
    const r=await HS.notify.enable();
    if(!r.ok){U.sys(r.msg,'bad');return}
    rm.on=true;
  }else{rm.on=false;await HS.notify.disable()}
  E.save();U.render();
};

/* backup and restore */
const stamp=()=>E.dkey();
A.bkSave=async function(){
  const txt=E.backupText(),name='habit-sync-backup-'+stamp()+'.json';
  const showText=(why)=>{$('#exWrap').innerHTML='<div class="small">'+why+'</div><textarea class="ta" id="bkText" readonly aria-label="Backup text">'+esc(txt)+'</textarea>'};
  try{
    if(HS.native&&HS.native.native()&&await HS.native.saveFile(name,txt)){E.markBackup();U.sys('Backup ready. Choose where to keep it: Drive, WhatsApp, Files.','good');U.render();return}
    const blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    E.markBackup();
    U.sys('Backup file requested: '+name+'.','good');
    /* some embedded viewers silently block downloads, so the text is always shown as a fallback */
    showText('If no file appeared in your downloads, copy this text and keep it somewhere safe. It is the same backup.');
  }catch(e){
    showText('Your browser blocked the download. Copy this text and keep it somewhere safe:');
  }
  E.dataInfo();
};
A.bkCopy=function(){
  const txt=E.backupText();
  $('#exWrap').innerHTML='<div class="small" id="bkMsg">Select all of this text and copy it:</div><textarea class="ta" id="bkText" readonly aria-label="Backup text">'+esc(txt)+'</textarea>';
  const ta=$('#bkText');
  U.copyText(txt,ta).then(ok=>{
    const m=$('#bkMsg');if(!m)return;
    if(ok){E.markBackup();m.textContent='Copied to the clipboard. Paste it into a note or message to yourself.';U.sys('Backup text copied.','good')}
    else{ta.focus();ta.select();U.sys('Select and copy the text below.','good')}
  });
};
function onRestoreFile(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const n=E.importText(String(r.result));U.sys('Restored '+n+' days from '+f.name+'.','good');U.tab='home';U.render(true)}
    catch(err){U.sys(err.message,'bad')}
  };
  r.readAsText(f);
}
/* a destructive button needs a deliberate second tap: not an instant double tap, and not after it has timed out */
function armed(el,label,again){
  const now=Date.now();
  if(el.dataset.armed){if(now-(+el.dataset.at||0)<800)return false;return true}
  el.dataset.armed='1';el.dataset.at=now;el.textContent=again;
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;delete el.dataset.at;el.textContent=label}},3500);
  return false;
}
A.bkAuto=function(b,el){
  if(!armed(el,'Restore yesterday’s automatic copy','Tap again to replace everything with the automatic copy'))return;
  try{const n=E.restoreAuto();U.sys('Restored '+n+' days from the automatic copy. You can undo this in the Data vault.','good');U.tab='home';U.render(true)}catch(err){U.sys(err.message,'bad')}
};
A.undo=function(b,el){
  if(!armed(el,el.textContent,'Tap again to bring back what you had before'))return;
  try{const n=E.undoLast();U.sys('Back to '+n+' days, as before.','good');U.tab='home';U.render(true)}catch(err){U.sys(err.message,'bad')}
};
A.reset=function(v,b){
  if(!armed(b,'Reset everything','Tap again to erase everything'))return;
  E.reset();U.tab='home';F.applyTheme();U.render(true);U.sys('Everything cleared. You can undo this in the Data vault.','');
};
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cfg){
    const S=E.S(),c=E.cfg(),k=t.dataset.cfg;let v=t.value;
    if(t.type==='number'){v=parseFloat(v);if(isNaN(v))return}
    if(t.dataset.root)S[k]=v;else c[k]=v;E.save();
  }else if(t.dataset.rx){
    const x=E.routine(rTab)[+t.dataset.i];if(x){x[t.dataset.rx]=t.value;E.save()}
  }else if(t.dataset.vol){
    E.cfg().volume=parseFloat(t.value);E.save();
  }else if(t.dataset.rm){
    const rm=E.S().remind;rm[t.dataset.rm]=t.value;E.save();HS.notify&&HS.notify.schedule();
  }
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.vol){F.play('pick')}});

/* ---------------- first run: the awakening ---------------- */
U.welcome=function(){
  U.sh={type:'welcome',roast:'playful'};
  const c=E.cfg(),S=E.S();
  U.openSheet('Awakening',
    `<div class="wel"><div class="wav">${HS.avatar.svg(S.equip,{mood:'idle'})}</div>
      <h2>Welcome, hunter.</h2>
      <p>Every quest you finish builds your character. Skipped quests cost you. Your data never leaves this phone.</p>
      <label class="fr"><span>Your name</span><input id="wName" type="text" maxlength="14" value="${esc(c.name==='PLAYER'?'':c.name)}" placeholder="PLAYER"></label>
      <label class="fr"><span>Weight today (kg)</span><input id="wStart" type="number" inputmode="decimal" step="0.1" value="${S.startW}"></label>
      <label class="fr"><span>Goal weight (kg)</span><input id="wGoal" type="number" inputmode="decimal" step="0.5" value="${c.goalW}"></label>
      <div class="small" style="margin-top:12px">When you slack, the System can tease you. It only ever teases the skipped habit, never your body.</div>
      <div id="wRoast">${seg('wroast',[['off','Off'],['playful','Playful'],['savage','Savage']],'playful').replace('seg2','seg2 full')}</div></div>`,
    '<button class="btn" data-a="wGo">ARISE</button>');
};
A.wroast=function(v){U.sh.roast=v;$('#wRoast').innerHTML=seg('wroast',[['off','Off'],['playful','Playful'],['savage','Savage']],v).replace('seg2','seg2 full');F.play('pick')};
A.wGo=function(){
  const S=E.S(),c=E.cfg();
  const sw=parseFloat($('#wStart').value),gw=parseFloat($('#wGoal').value),nm=$('#wName').value.trim();
  if(!(sw>30&&sw<250)||!(gw>30&&gw<sw)){U.sys('Enter your weight today, and a goal weight below it.','bad');return}
  S.startW=Math.round(sw*10)/10;c.goalW=Math.round(gw*2)/2;c.name=(nm||'PLAYER').toUpperCase();c.roast=U.sh.roast||'playful';
  c.kcal=E.kcalFor(S.startW);c.protein=Math.round(2*c.goalW/5)*5;
  S.start=E.dkey();S.welcomed=true;E.save();
  U.closeSheetQuiet();
  U.render(true);
  F.play('arise');F.vib([40,40,40,40,200]);F.burstCenter(110);
  U.cele({kind:'realm',ms:3800,html:'<div class="rays"></div><div class="kicker">THE SYSTEM HAS CHOSEN YOU</div><h1>ARISE</h1><p>'+esc(c.name)+', your first gate is '+(S.startW-c.gateStep).toFixed(1)+' kg. Start with the scale.</p>'});
};
})();

<script>
/* ui-sheets.js: the task windows. Plate (food), workout logger, rehab with animated outlines and roadmap, weigh-in, clear the day, physio sheet. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E,F=HS.fx,U=HS.ui;
const esc=U.esc,fmt=U.fmt,cap=U.cap,hhmm=U.hhmm,$=U.$,A=U.act;
const seg=(g,opts,cur)=>`<div class="seg">${opts.map(o=>`<button data-a="${g}:${o[0]}" aria-pressed="${cur===o[0]}" class="${o[0]==='sharp'?'sharp':''}">${o[1]}</button>`).join('')}</div>`;

/* =====================================================================
   PLATE: build the meal. Tiles fly onto a plate, macros fly into the counters, the combo walks up a scale,
   and portions are set by scrolling a ruler that ticks under your thumb.
   ===================================================================== */
const PX=2,MAXG=800;
let rulerTimer=null;
U.plateSheet=function(meal){
  U.sh={type:'plate',meal:meal,edit:-1,combo:0,last:0,lastName:null,rulerUser:false};
  U.openSheet(meal==='snack'?'Snack':cap(meal),
    `<div class="pl">
      <div class="stage">
        <div class="sd"><b id="sK">0</b><span>KCAL TODAY</span><em id="sKL"></em></div>
        <div class="pw"><svg class="pring" viewBox="0 0 180 180" aria-hidden="true"><circle class="trk" cx="90" cy="90" r="82"/><circle id="prK" class="arc k" cx="90" cy="90" r="82" pathLength="100"/><circle class="trk" cx="90" cy="90" r="71"/><circle id="prP" class="arc p" cx="90" cy="90" r="71" pathLength="100"/></svg>
          <div class="disc" id="disc"></div><div class="combo" id="combo"></div></div>
        <div class="sd r"><b id="sP">0</b><span>G PROTEIN</span><em id="sPL"></em></div>
      </div>
      <div class="plate" id="plate"></div><div id="ed"></div>
      <div class="inrow"><input id="mIn" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="none" aria-label="Type what you ate" placeholder="Type: 2 chapati, rice 200g, shake 400 kcal"><button data-a="mAdd">ADD</button></div>
      <div class="sug" id="mSug"></div>
      <div class="rows" id="rows"></div></div>`,
    `<button class="btn" data-a="mealDone">Done</button><button class="link" data-a="mealSkip" id="mSkip">Skip this meal</button>`,{full:true,col:true});
  $('#mSkip').hidden=meal==='snack';
  drawRows();drawPlate();drawStage(true);
};
function items(){const sh=U.sh,d=E.day();return d.items.map((it,ix)=>({it:it,ix:ix})).filter(o=>o.it.meal===sh.meal)}
function drawStage(first){
  const sh=U.sh;if(!sh||sh.type!=='plate')return;
  const d=E.day(),T=E.T(),tot=E.totals(d);
  const kp=Math.min(100,tot.k/T.kcal*100),pp=Math.min(100,tot.p/T.protein*100);
  $('#prK').style.strokeDashoffset=100-kp;$('#prP').style.strokeDashoffset=100-pp;
  $('#prK').classList.toggle('over',tot.k>T.hi);$('#prP').classList.toggle('full',tot.p>=T.protein);
  const sK=$('#sK'),sP=$('#sP');
  F.countTo(sK,tot.k,null,500);F.countTo(sP,tot.p,null,500);
  $('#sKL').textContent=(T.kcal-tot.k>=0?fmt(T.kcal-tot.k)+' left':fmt(tot.k-T.kcal)+' over');
  $('#sPL').textContent=tot.p>=T.protein?'target hit':fmt(T.protein-tot.p)+' to go';
  /* the plate itself */
  const its=items(),n=its.length,disc=$('#disc');
  let h='';
  if(!n)h='<span class="dempty">tap food</span>';
  const show=its.slice(-7);
  show.forEach((o,i)=>{
    const f=E.food(o.it.name),u=E.units(f,o.it.g),sz=Math.round(30+16*Math.max(-.4,Math.min(1.3,u-1)));
    let x=0,y=0;
    if(show.length>1){const a=-Math.PI/2+i*(2*Math.PI/show.length);x=Math.cos(a)*34;y=Math.sin(a)*34}
    h+='<span class="fd'+(sh.lastName===o.it.name&&!first?' drop':'')+(sh.edit===o.ix?' sel':'')+'" style="--x:'+x.toFixed(0)+'px;--y:'+y.toFixed(0)+'px;font-size:'+sz+'px" data-a="edit:'+o.ix+'">'+HS.emoji(o.it.name)+'</span>';
  });
  if(n>7)h+='<em class="more">+'+(n-7)+'</em>';
  disc.innerHTML=h;
}
function drawPlate(){
  const sh=U.sh;if(!sh||sh.type!=='plate')return;
  const its=items(),d=E.day();
  $('#plate').innerHTML=its.map(o=>`<button class="pc${sh.edit===o.ix?' sel':''}" data-a="edit:${o.ix}">${HS.emoji(o.it.name)} ${esc(o.it.name)}<small>${Math.round(o.it.g)} g</small></button>`).join('');
  const ed=$('#ed');
  if(sh.edit>=0&&d.items[sh.edit]&&d.items[sh.edit].meal===sh.meal){
    const it=d.items[sh.edit],f=E.food(it.name);
    let lab='';for(let g=0;g<=MAXG;g+=100)lab+='<b style="left:'+(g*PX)+'px">'+g+'</b>';
    ed.innerHTML=`<div class="ed"><div class="edh"><span>${HS.emoji(it.name)} ${esc(it.name)}</span><button data-a="edClose" aria-label="Close editor">×</button></div>
      <div class="gbigr"><b id="gNum">${Math.round(it.g)}</b><span>g</span><em id="gUnits"></em></div>
      <div class="rw"><div class="ruler" id="ruler" aria-label="Scroll to set grams"><i class="sp"></i><div class="rin">${lab}</div><i class="sp"></i></div><div class="needle"></div></div>
      <div class="edq"><button data-a="gx:.5">½×</button><button data-a="gx:1">1×</button><button data-a="gx:1.5">1½×</button><button data-a="gx:2">2×</button><button class="del" data-a="gdel">Remove</button></div>
      <div class="edi" id="edI"></div></div>`;
    sh.rulerUser=false;
    const ru=$('#ruler');
    requestAnimationFrame(()=>{ru.scrollLeft=it.g*PX;drawEdInfo()});
    const go=()=>{sh.rulerUser=true};
    ru.addEventListener('pointerdown',go);ru.addEventListener('touchstart',go,{passive:true});ru.addEventListener('wheel',go,{passive:true});
    ru.addEventListener('scroll',onRuler,{passive:true});
  }else{sh.edit=-1;ed.innerHTML=''}
}
function onRuler(){
  const sh=U.sh;if(!sh||!sh.rulerUser)return;
  const d=E.day(),it=d.items[sh.edit];if(!it)return;
  const ru=$('#ruler'),g=Math.max(5,Math.min(MAXG,Math.round(ru.scrollLeft/PX/5)*5));
  if(g===it.g)return;
  const oldB=Math.floor(it.g/10);it.g=g;
  if(Math.floor(g/10)!==oldB){F.play('tick',g);F.vib(4)}
  $('#gNum').textContent=g;drawEdInfo();updateChip();
  drawStage();E.checkProtein();
  clearTimeout(rulerTimer);rulerTimer=setTimeout(()=>{E.save();drawRows()},180);
}
function updateChip(){const c=document.querySelector('.pc.sel small');const it=E.day().items[U.sh.edit];if(c&&it)c.textContent=Math.round(it.g)+' g'}
function drawEdInfo(){
  const sh=U.sh;if(!sh||sh.edit<0)return;
  const it=E.day().items[sh.edit];if(!it)return;
  const f=E.food(it.name),n=E.nut(f,it.g),u=E.units(f,it.g);
  const e=$('#edI');if(e)e.textContent='1 serving = '+f.ug+' g ('+f.kcal+' kcal). This is '+u+' serving'+(u===1?'':'s')+': '+Math.round(n.k)+' kcal, '+Math.round(n.p)+' g protein.';
  const gu=$('#gUnits');if(gu)gu.textContent=u+' × '+(/^\d/.test(f.unit)?f.unit:f.unit);
}
function tile(name,cls){
  const f=E.food(name);if(!f)return'';
  const d=E.day(),g=d.items.filter(i=>i.name===name&&i.meal===U.sh.meal).reduce((a,i)=>a+i.g,0);
  const lab=/^\d/.test(f.unit)?f.unit:'1 '+f.unit;
  return `<button class="tile r-${f.rar} ${cls||''}" data-a="add:${esc(name)}"><span class="te">${HS.emoji(name)}</span><span class="tn">${esc(name)}</span><span class="tk">${f.kcal} kcal · ${esc(lab)}</span>${g?`<b>${E.units(f,g)}</b>`:''}</button>`;
}
function utile(u){
  const f=E.food(u.name);if(!f)return'';
  const k=Math.round(E.nut(f,u.g).k);
  return `<button class="tile r-${f.rar} usual" data-a="usual:${esc(u.name)}|${u.g}"><span class="te">${HS.emoji(u.name)}</span><span class="tn">${esc(u.name)}</span><span class="tk">${Math.round(u.g)} g \u00B7 ${k} kcal</span><i class="ux">${u.n}\u00D7</i></button>`;
}
function drawRows(){
  const sh=U.sh;if(!sh||sh.type!=='plate')return;
  const pool=E.poolFor(sh.meal).map(E.food).filter(Boolean),by=c=>pool.filter(f=>f.cat===c).sort((a,b)=>b.p-a.p).map(f=>f.name);
  const pk=E.picks(sh.meal),treats=Array.from(new Set(by('treat').concat(HS.OUTSIDE)));
  const row=(t,names,cls,tc)=>names.length?`<div class="rl2"><div class="rt ${tc||''}">${t}</div><div class="tiles">${names.map(n=>tile(n,cls)).join('')}</div></div>`:'';
  const empty=!items().length,last=empty?E.lastMeal(sh.meal):null,us=E.usuals(sh.meal);
  const rep=last?`<button class="repeat" data-a="repeat"><span class="ri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></span><span class="rm"><b>Same as last time</b><small>${esc(last.items.map(x=>x.name).slice(0,3).join(', '))}${last.items.length>3?' +'+(last.items.length-3):''} \u00B7 ${fmt(last.kcal)} kcal \u00B7 ${U.date(last.k)}</small></span><span class="rg">ONE TAP</span></button>`:'';
  const usr=us.length?`<div class="rl2"><div class="rt pick">Your usuals</div><div class="tiles">${us.map(utile).join('')}</div></div>`:'';
  $('#rows').innerHTML=rep+usr+row('\u2605 System picks for your remaining macros',pk,'pickt','pick')+row('Protein',by('protein'))+row('Carbs',by('carb'))+row('Sides and veg',by('side'))+row('Treats and outside (sugar costs aura)',treats,'trt');
}
const COMBO_MS=4500;
function afterAdd(name,srcEl,mult){
  const sh=U.sh,f=E.food(name),t=Date.now();
  sh.combo=(t-sh.last<COMBO_MS)?sh.combo+1:0;sh.last=t;sh.lastName=name;
  F.play('add',{cat:f.cat,combo:sh.combo});F.vib(sh.combo>=3?[10,20,10]:10);
  const k=Math.round(f.k100*(f.ug)/100*mult),p=Math.round(f.p100*f.ug/100*mult);
  const land=()=>{drawStage();drawPlate();};
  if(srcEl&&$('#disc')){
    F.fly(srcEl,$('#disc'),'<span class="oe">'+HS.emoji(name)+'</span>',{cls:'em',ms:480,arc:70,done:land});
    if(p>=2)F.fly(srcEl,$('#sP'),'+'+p+'g',{cls:'p',ms:760,arc:90});
    F.fly(srcEl,$('#sK'),'+'+k,{cls:'k',ms:700,arc:40});
  }else land();
  const cb=$('#combo');
  if(cb){
    if(sh.combo>=1){cb.textContent='×'+(sh.combo+1)+' COMBO';cb.classList.remove('on');void cb.offsetWidth;cb.classList.add('on');
      if(sh.combo>=3&&$('#disc'))F.burstAt($('#disc'),14);
      clearTimeout(sh.comboT);sh.comboT=setTimeout(()=>{cb.classList.remove('on')},COMBO_MS)}
  }
  drawRows();
}
A.add=function(v,b){
  const sh=U.sh;if(!sh)return;
  const f=E.food(v);if(!f)return;
  E.addFood(v,null,sh.meal);
  afterAdd(v,b,1);
};
E.on('add',a=>{
  if(a.pen)U.sys('Sugar detected: '+a.food.name+' is '+Math.round(a.kcal)+' kcal, '+a.pct+'% of today. −'+a.pen+' aura.','bad',true);
  else if(a.food.sugar)U.sys('Sugar again: '+Math.round(a.kcal)+' kcal ('+a.pct+'% of today). The daily sugar penalty is already used.','',true);
  else if(a.food.out)U.sys(a.food.name+': '+Math.round(a.kcal)+' kcal, '+a.pct+'% of today.','',true);
});
A.sugadd=function(v){
  const sh=U.sh;if(!sh)return;
  const inp=$('#mIn'),parts=inp.value.split(/(,|\+|\band\b)/i),lastRaw=parts.pop(),r=E.parsePart(lastRaw)||{},f=E.food(v);
  E.addFood(v,r.g!=null?r.g:r.units!=null?r.units*f.ug:null,sh.meal);
  afterAdd(v,inp,1);
  inp.value=parts.join('').replace(/[,+]\s*$/,'').trim();$('#mSug').innerHTML='';inp.focus();
};
A.mAdd=function(){
  const sh=U.sh,inp=$('#mIn'),txt=inp.value.trim();if(!sh||!txt)return;
  const miss=[];
  txt.split(/,|\+|\band\b/i).forEach(p=>{
    const r=E.parsePart(p);if(!r||!r.name)return;
    const hit=E.scoreFoods(r.name,sh.meal)[0];
    if(hit){
      let amt=r.g!=null?r.g:r.units!=null?r.units*hit.ug:r.tn!=null?r.tn:null;
      if(r.kc!=null&&r.g==null&&hit.k100>0)amt=Math.round(r.kc/hit.k100*100);   /* "momos 500 kcal" means 500 kcal of momos */
      E.addFood(hit.name,amt,sh.meal);afterAdd(hit.name,inp,1);return;
    }
    const kc=r.kc!=null?r.kc:r.tn;
    if(kc){E.customFood(r.name,kc);E.addFood(r.name,r.g!=null?r.g:100,sh.meal);afterAdd(r.name,inp,1);return}
    miss.push(r.name);
  });
  inp.value='';$('#mSug').innerHTML='';
  if(miss.length)U.sys('Not found: '+miss.join(', ')+'. Add a number, like "momos 350".','bad');
};
A.edit=function(v){const sh=U.sh;if(!sh||sh.type!=='plate')return;sh.edit=(sh.edit===+v)?-1:+v;F.play('pick');drawPlate();drawStage()};
A.edClose=function(){U.sh.edit=-1;drawPlate();drawStage()};
A.gx=function(v){
  const sh=U.sh,it=E.day().items[sh.edit];if(!it)return;
  const f=E.food(it.name),ru=$('#ruler');sh.rulerUser=true;
  ru.scrollTo({left:Math.round(f.ug*(+v))*PX,behavior:'smooth'});
};
A.gdel=function(){const sh=U.sh;E.removeItem(sh.edit);sh.edit=-1;F.play('remove');F.vib(14);drawPlate();drawStage();drawRows()};
A.usual=function(v,b){
  const sh=U.sh;if(!sh)return;
  const i=v.lastIndexOf('|'),name=v.slice(0,i),g=parseFloat(v.slice(i+1));
  if(!E.food(name))return;
  E.addFood(name,g,sh.meal);afterAdd(name,b,g/E.food(name).ug);
};
A.repeat=function(){

function parseRx(rx){
  let m;
  if((m=rx.match(/(\d+)\s*sec\s*[×x]\s*(\d+)\s*reps?/i)))return{reps:+m[2],sets:1,note:m[1]+' sec hold on each rep'};
  if((m=rx.match(/(\d+)\s*sec\s*[×x]\s*(\d+)/i)))return{secs:+m[1],sets:+m[2]};
  if((m=rx.match(/(\d+)\s*laps\s*[×x]\s*(\d+)\s*sets?/i)))return{laps:+m[1],sets:+m[2]};
  if((m=rx.match(/(\d+)\s*[×x]\s*(\d+)/)))return{reps:+m[1],sets:+m[2]};
  return{sets:1,note:''};
}

/* ---- the guided session: one move at a time ---- */
function stopHold(){const g=U.sh&&U.sh.g;if(g&&g.t){clearInterval(g.t.iv);g.t=null}}
function guideList(){const out=[];E.rehabGroups().groups.filter(g=>!g.bonus).forEach(g=>g.items.forEach(it=>out.push(Object.assign({group:g.title},it))));return out}
A.rguide=function(){
  const list=guideList(),items=E.day().reh.items,first=list.findIndex(it=>!items[it.key]);
  U.sh.tab='guide';U.sh.g={list:list,i:first<0?0:first,set:0,t:null};F.play('pick');F.vib(10);renderRehab();
};
function renderGuide(){
  const sh=U.sh,g=sh.g,it=g.list[g.i],px=parseRx(it.rx),total=px.sets||1;
  stopHold();g.busy=false;
  const label=px.secs?'Start hold · '+px.secs+' s'+(total>1?' (set '+(g.set+1)+' of '+total+')':''):total>1?'Set '+(g.set+1)+' of '+total+' done':'Done';
  U.openSheet('Guided rehab',
    `<div class="gd"><div class="gtop"><div class="xp"><i style="width:${g.i/g.list.length*100}%"></i></div><span>${g.i+1} / ${g.list.length}</span></div>
      <div class="ggrp">${esc(it.group)}</div>
      <div class="gfig">${it.fig?HS.figSvg(it.fig,'big'):''}<div class="holdr" id="holdr" hidden><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="arc k" id="holdArc" cx="60" cy="60" r="52" pathLength="100" style="stroke-dashoffset:0"/></svg><b id="holdT">${px.secs||0}</b></div></div>
      <h3>${esc(it.name)}</h3><div class="grx">${esc(it.rx)}${px.note?' · '+esc(px.note):''}</div>
      ${HS.CUES&&HS.CUES[it.fig]?'<div class="gcue">'+esc(HS.CUES[it.fig])+'</div>':''}
      <div class="gsets">${Array.from({length:total},(_,i)=>`<i class="${i<g.set?'on':''}"></i>`).join('')}</div>
      <div class="small gtip">General cue, not a prescription: confirm the exact form with your physio. Stop if you feel sharp pain.</div></div>`,
    `<button class="btn good" id="gsetBtn" data-a="gset">${label}</button><div class="gnav"><button class="link" data-a="gprev">Back</button><button class="link" data-a="gskip">Skip this move</button><button class="link" data-a="gend">Back to the list</button></div>`);
}
function guideNext(){
  const sh=U.sh,g=sh.g;stopHold();
  g.i++;g.set=0;
  if(g.i>=g.list.length){
    sh.tab='today';sh.g=null;F.play('quest');F.vib([30,40,60]);F.burstCenter(60);
    renderRehab();
    U.sys('Session complete. Log how it felt, then finish.','good',true);
    setTimeout(()=>{const c=$('#checkin');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})},300);
    return;
  }
  renderGuide();
}
A.gset=function(){
  const sh=U.sh,g=sh&&sh.g;if(!g||g.busy)return;   /* busy: the move is finished and the next one is about to be drawn */
  if(g.t){stopHold();renderGuide();return}
  const it=g.list[g.i],px=parseRx(it.rx),total=px.sets||1;
  const finishSet=()=>{
    g.set++;F.play('set');F.vib(18);
    if(g.set>=total){
      g.busy=true;const i0=g.i;
      E.day().reh.items[it.key]=true;E.save();F.play('quest');F.burstAt($('.gfig'),16);
      setTimeout(()=>{if(U.sh&&U.sh.g===g&&g.i===i0)guideNext()},350);
    }else renderGuide();
  };
  if(px.secs){
    const end=Date.now()+px.secs*1000,ring=$('#holdr'),arc=$('#holdArc'),tt=$('#holdT'),btn=$('#gsetBtn');
    ring.hidden=false;btn.textContent='Stop';let lastSec=px.secs;
    const iv=setInterval(()=>{
      if(!U.sh||U.sh.g!==g||!g.t){clearInterval(iv);return}   /* the sheet closed or moved on: stop ticking */
      const left=Math.max(0,end-Date.now()),s=Math.ceil(left/1000);
      arc.style.strokeDashoffset=100-left/(px.secs*1000)*100;
      tt.textContent=s;
      if(s!==lastSec){lastSec=s;F.play('tick',200+s*10)}
      if(left<=0){clearInterval(iv);g.t=null;F.play('timer');F.vib([60,50,60]);finishSet()}
    },100);
    g.t={iv:iv};
  }else finishSet();
};
A.gprev=function(){const g=U.sh.g;stopHold();g.i=Math.max(0,g.i-1);g.set=0;F.play('tap');renderGuide()};
A.gskip=function(){F.play('tap');guideNext()};
A.gend=function(){stopHold();U.sh.tab='today';U.sh.g=null;renderRehab()};
A.rehabFinish=function(){
  const sh=U.sh,r=E.day().reh,pr=E.rehabProgress();stopHold();
  if(!pr.done){U.sys('Tick at least one move, or close this window.','bad');return}
  r.n=pr.done;
  if(pr.ok&&!r.done){
    r.done=true;E.addAura(U.rehabAura(pr.done));E.stat('SNS',2);E.save();E.emit('rehab',{n:pr.done});
    U.justRow='rehab';F.play('quest');U.closeSheet();
    U.sys(U.hype('rehab')+' '+pr.done+' of '+pr.total+' moves.','good',true);F.burstCenter(40);
  }else if(pr.ok){
    E.save();U.closeSheet();U.sys('Rehab updated: '+pr.done+' of '+pr.total+' moves.','good',true);
  }else{
    E.save();U.closeSheet();U.sys('Saved '+pr.done+' of '+pr.total+'. Finish at least '+Math.ceil(pr.total*.8)+' to clear the rehab quest.','');
  }
};
function weekPlanHtml(){
  const w=E.rehabWeek(),td=E.dkey();
  return '<div class="rweek">'+w.map(x=>`<div class="${x.k===td?'today':''}"><b>${x.d}</b><span>${x.plan}</span><small>${x.fin||'block'}${x.aero?' + walk':''}${x.bonus?' + bonus':''}</small><i>${x.n}</i></div>`).join('')+'</div><div class="small">The daily block every day. Day 1 core with Push, Day 2 Swiss-ball work with Pull, balance after Legs, and a longer session on the rest day. The number is how many moves count that day.</div>';
}
function roadmapHtml(){
  const pd=E.painDays(14),ci=pd.filter(x=>x.r).length,gr=pd.filter(x=>E.light(x.r)==='green').length,runs=pd.filter(x=>x.run!=null).map(x=>x.run);
  const phase=(n,t,w,goal,dos,gate)=>`<div class="ph"><div class="phh"><b>PHASE ${n}</b><span>${t}</span></div><div class="phw">${w}</div><div class="phg"><b>Goal</b> ${goal}</div><ul>${dos.map(x=>'<li>'+x+'</li>').join('')}</ul><div class="phgate"><b>Gate</b> ${gate}</div></div>`;
  return `<div class="warn" style="margin-top:12px"><b>DRAFT for your physio to approve.</b> Not medical advice. Recovery time varies. Three to six months is a target to aim for, not a promise. Nothing here changes the exercises, sets or reps your physio wrote.</div>
   <div class="sec">Your numbers</div>
   <div class="dis"><div><span>CHECK-INS</span><b>${ci} / 14</b></div><div><span>GREEN DAYS</span><b>${gr}</b></div><div><span>RUN BEFORE PAIN</span><b>${runs.length?runs[runs.length-1]+' min':'no data'}</b></div></div>
   <div class="sec">Your rehab week</div>
   ${weekPlanHtml()}
   <div class="sec">Pain traffic light (proposed)</div>
   <div class="tl"><div class="light green">GREEN 0 to 3: continue as planned</div><div class="light amber">AMBER 4 to 5: hold loads, no progression</div><div class="light red">RED 6 or more, or any sharp pain: stop and message your physio</div></div>
   <div class="sec">Phases</div>
   ${phase(1,'Calm and control','Weeks 1 to 4','Settle the knee and low back, and make the daily block a habit.',['Daily block every day it feels OK','Day 1 and Day 2 strength rotation','Lifting inside pain-free range and your own 30 to 40 kg cap','Pain-free aerobic work, 30 minutes, 3 to 4 days a week'],'Mostly green days for two weeks, with no sharp episodes. Physio agrees.')}
   ${phase(2,'Rebuild strength','Weeks 5 to 12','Add load slowly where the plan allows it.',['Day 3 lower-body work at loads your physio sets','Raise one thing at a time, never two','Track run minutes before pain and let your physio set the next target'],'Pain settles within a day of sessions, three weeks running. Physio agrees.')}
   ${phase(3,'Return to full training','Months 4 to 6','Normal training, with the knee and back in charge of the pace.',['More load and impact only with physio sign-off','Re-check the knee and back at a review','Keep the daily block for good'],'Physio reassessment. Then your cap changes, not before.')}
   <div class="sec">Stop and get checked quickly if</div>
   <ul class="stop"><li>Numbness, pins and needles or growing weakness in a leg</li><li>Trouble controlling your bladder or bowels, or numbness around the groin (urgent)</li><li>The knee gives way, locks or swells</li><li>Sharp pain that does not settle</li></ul>
   <div class="small">These are general safety rules, not from your documents.</div>`;
}

/* ---- physio sheet ---- */
function physioText(){
  const pd=E.painDays(14),rd=pd.filter(x=>x.r),n=rd.length,S=E.S();
  const avg=k=>n?(rd.reduce((a,x)=>a+x.r[k],0)/n).toFixed(1):'no data';
  const sharp=rd.filter(x=>x.r.sharp).length,runs=pd.filter(x=>x.run!=null).map(x=>x.run);
  const keys=Object.keys(S.days).filter(k=>E.daysBetween(k,E.dkey())<14);
  const gym=keys.filter(k=>S.days[k].workout==='done').length;
  const painGym=keys.filter(k=>S.days[k].pain&&(S.days[k].pain.knee==='sharp'||S.days[k].pain.back==='sharp')).length;
  const greens=pd.filter(x=>E.light(x.r)==='green').length;
  return 'PHYSIO SHEET (self-logged, last 14 days)\nRehab check-ins: '+n+' of 14 days ('+greens+' green)\nRight knee pain average: '+avg('knee')+' / 10\nLower back pain average: '+avg('back')+' / 10\nDays with sharp pain reported in rehab: '+sharp+'\n'+
   'Gym sessions logged: '+gym+', of which with sharp pain afterwards: '+painGym+'\nRun minutes before knee pain (latest entries): '+(runs.length?runs.slice(-5).join(', '):'no data')+'\nSelf-set limit: '+HS.CAP_KG+' kg or less on squats and deadlifts\n\nQUESTIONS FOR YOU\n'+
   '1. Is the written plan (daily block, Day 1 to 3) still right for me now?\n2. How deep may I bend the knee under load?\n3. What squat and deadlift load is safe for now, and what is the rule for increasing it?\n4. I feel knee pain after about 3 minutes of running at 9 km/h. Should I keep running?\n'+
   '5. What exactly counts as a stop signal, and when should I come back for review?\n6. Should my right knee (ACL sprain on the 2024 note) be reassessed or re-imaged?\n7. What does "S/B" mean in my plan, and is Jefferson curl safe for me?\n8. May I use a pain traffic light (green 0-3, amber 4-5, red 6+ or sharp) to decide when to progress?';
}
A.physio=function(){
  U.sh={type:'physio'};
  U.openSheet('Physio sheet','<div class="hint">Built only from what you logged. Show it at your next visit.</div><textarea class="ta" id="phT" readonly aria-label="Physio sheet text">'+esc(physioText())+'</textarea>','<button class="btn" data-a="copy">Copy text</button>');
};
A.copy=function(){
  const t=$('#phT');
  U.copyText(t.value,t).then(ok=>U.sys(ok?'Copied. Paste it into a message to your physio.':'Select the text and copy it from the box.','good'));
};

/* =====================================================================
   WEIGH-IN (with last night's sleep) and CLEAR THE DAY
   ===================================================================== */
let wVal=84;
U.weighSheet=function(){
  const S=E.S(),d=E.day(),ks=Object.keys(S.weights).sort();
  wVal=S.weights[E.dkey()]||(ks.length?S.weights[ks[ks.length-1]]:S.startW);
  const lastSleep=ks.map(k=>S.days[k]&&S.days[k].sleep).filter(x=>x!=null).pop();
  U.sh={type:'weigh',sleep:d.sleep!=null?d.sleep:(lastSleep!=null?lastSleep:7),touched:false};
  renderWeigh();
};
const sleepNote=h=>h>=7?'Good. +15 aura':h>=6?'Okay. +8 aura':'Short night. Be kind to yourself today';
function renderWeigh(){
  const sh=U.sh,d=E.day();
  U.openSheet('Morning check-in',
    `<div class="hint">Before food, after the toilet. Same scale every day.</div>
    <div class="wnum"><button data-a="wd" aria-label="Down 0.1">−</button><input id="wIn" type="number" step="0.1" inputmode="decimal" value="${wVal.toFixed(1)}" aria-label="Weight in kg"><button data-a="wu" aria-label="Up 0.1">+</button></div>
    ${d.hWeight&&!d.weighed?`<button class="chipbtn" data-a="useHW"><b>Samsung Health has ${d.hWeight.toFixed(1)} kg</b><span>Use this reading</span></button>`:''}
    <div class="note">One reading never moves your trend by more than a quarter. Water weight is noise.</div>
    <div class="sec">Last night’s sleep</div>
    <div class="stp"><span>Hours slept<small id="slpn">${sleepNote(sh.sleep)}</small></span><div class="c"><button class="sbtn" data-a="slp:-0.5" aria-label="Less sleep">−</button><i class="slpv" id="slpv">${sh.sleep.toFixed(1)}</i><button class="sbtn" data-a="slp:0.5" aria-label="More sleep">+</button></div></div>
    <div class="small">${d.sleep!=null?'Already logged: '+d.sleep+' h. Change it above if it is off.':'Skip this if you would rather not log it today.'}</div>`,
    '<button class="btn" data-a="wSave">Save</button>');
}
A.useHW=function(){const d=E.day();if(!d.hWeight)return;const i=$('#wIn');i.value=d.hWeight.toFixed(1);wVal=d.hWeight;F.play('pick');F.vib(8)};
A.slp=function(v){const sh=U.sh;sh.sleep=Math.max(0,Math.min(14,Math.round((sh.sleep+parseFloat(v))*2)/2));sh.touched=true;F.play('tick',sh.sleep*30);F.vib(5);$('#slpv').textContent=sh.sleep.toFixed(1);$('#slpn').textContent=sleepNote(sh.sleep)};
A.wd=A.wu=function(v,b){
  const i=$('#wIn');let x=parseFloat(i.value)||wVal;
  x=Math.round((x+(b.dataset.a==='wu'?.1:-.1))*10)/10;i.value=x.toFixed(1);F.play('weigh');F.vib(6);
};
A.wSave=function(){
  const x=parseFloat($('#wIn').value);if(!(x>30&&x<250)){U.sys('Enter your weight in kg.','bad');return}
  const sh=U.sh,r=E.logWeight(x);
  if(sh.touched)E.logSleep(sh.sleep);
  U.justRow='weigh';F.vib([20,30,30]);U.closeSheet();
  if(!r.cleared)U.sys('Logged '+x.toFixed(1)+' kg. Trend '+r.trend.toFixed(1)+' kg.'+(sh.touched&&sh.sleep>=7?' '+U.hype('sleep'):''),'',true);
};
U.closeDaySheet=function(){
  U.sh={type:'close'};
  const d=E.day();
  if(d.closed){U.openSheet('Day cleared','<div class="hint">'+d.score+' of 4 quests. Aura today: '+(d.delta>=0?'+':'−')+Math.abs(d.delta)+'.</div>'+(d.chest?'':'<div class="stack2"><button class="btn vio" data-a="chestOpen">Open today’s chest</button></div>'),'<button class="btn ghost" data-a="close">Close</button>');return}
  const open=U.quests().filter(q=>q.st==='todo'&&['close','weigh','rehab'].indexOf(q.id)<0).map(q=>q.id==='gym'?'Log your workout':'Log or skip '+q.id);
  if(open.length){U.openSheet('Not yet','<div class="hint">Finish these first, so the tally is honest.</div>'+open.map(o=>'<div class="q"><span>'+esc(o)+'</span><span class="no">OPEN</span></div>').join(''),'<button class="btn ghost" data-a="close">Back</button>');return}
  const st=E.dayStatus(),T=st.T,tot=st.tot,d2=d;
  const q=[['Protein '+T.protein+' g',st.protOk,Math.round(tot.p)+' g'],['Calories '+fmt(T.lo)+' to '+fmt(T.hi),st.calOk,fmt(tot.k)],['Workout',st.gymOk,st.plan==='Rest'?'Rest day':({done:'Done',pain:'Pain day',pass:'Rest pass'}[d2.workout]||'Skipped')],['Rehab',st.rehOk,st.rehOk?'Done':'Missed']];
  U.openSheet('Clear the day','<div class="hint">Last look. Clearing adds your calorie reward and opens your chest.</div>'+q.map(x=>'<div class="q"><span>'+esc(x[0])+'</span><span class="'+(x[1]?'ok':'no')+'">'+(x[1]?'✓ ':'')+esc(x[2])+'</span></div>').join('')+(tot.k<T.lo?'<div class="note">Under '+fmt(T.lo)+' kcal does not count. Eating too little costs muscle. If you forgot to log something, go back and add it.</div>':''),'<button class="btn" data-a="lock">Clear it</button>');
};
A.lock=function(){
  if(E.day().closed)return;
  U.justRow='close';F.vib([30,40,60]);U.closeSheet();
  E.closeDay();
};
})();

</script>
<script>HS.ui.boot();</script>
