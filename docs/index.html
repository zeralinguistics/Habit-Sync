<style>
/* Layout: a "System" HUD. A living character scene on top, quests as a list, a floating dock, every task in a bottom window. */
:root{
  --bg:#05070d; --panel:rgba(9,17,36,.82); --panel2:#0d1a33; --line:#1d4d7e; --glow:#3aa8ff; --glow-d:#1b6fb8;
  --glr:58,168,255; --acr:139,92,255; --p2r:13,26,51; --sheet:#070d1c; --dockbg:rgba(7,13,28,.78); --sysbg:rgba(6,14,32,.97); --panelsoft:rgba(9,17,36,.7); --tile1:#10203d; --tile2:#0a1429; --b1:#1a2f55; --b2:#060b18;
  --fg:#dff0ff; --mute:#8aa5c2; --violet:#8b5cff; --red:#ff4d5e; --red-d:#8f1f2c; --green:#3ddc97; --gold:#f5c451; --amber:#ffb23d;
  --display:'Rajdhani','Arial Narrow',system-ui,sans-serif;
  --body:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)); --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--body);overflow-x:hidden;overscroll-behavior:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#bg,#burst{position:fixed;left:0;top:0;pointer-events:none}
#bg{z-index:0}
#burst{z-index:96}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.strip{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--sat)) 16px 4px;font:700 13px var(--display);letter-spacing:.24em;color:var(--glow)}
.strip button{background:var(--panelsoft);border:1px solid var(--line);border-radius:8px;width:44px;height:36px;color:var(--glow);display:grid;place-items:center}
.strip button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip button.off{color:var(--mute)}
.screen{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.in{animation:screenin .45s cubic-bezier(.2,.9,.2,1)}
@keyframes screenin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* floating dock */
.dock{position:fixed;z-index:10;left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);width:min(360px,calc(100% - 32px));height:62px;display:grid;grid-template-columns:repeat(4,1fr);border-radius:31px;background:var(--dockbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 24px rgba(var(--glr),.18)}
.dind{position:absolute;left:4px;top:4px;bottom:4px;width:calc((100% - 8px)/4);border-radius:27px;background:linear-gradient(180deg,rgba(var(--glr),.35),rgba(var(--glr),.12));box-shadow:0 0 18px rgba(var(--glr),.4);transition:transform .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.dock button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--mute);font:700 11px var(--display);letter-spacing:.16em;text-transform:uppercase}
.dock button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.dock button[aria-selected="true"]{color:var(--fg)}
.dock button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.15);filter:drop-shadow(0 0 6px var(--glow))}

/* system window */
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 0 22px rgba(var(--glr),.12),inset 0 0 30px rgba(var(--glr),.05);margin-bottom:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.wt{padding:10px 14px 8px;font:700 14px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--glow);border-bottom:1px solid rgba(var(--glr),.18)}
.wb{padding:14px}
.small{color:var(--mute);font-size:13px;margin-top:10px}
.foot{text-align:center;color:#6c7f98;font-size:12px;padding:0 16px}
.link{background:none;border:0;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:12px;display:block;margin:0 auto}
.xp{height:8px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid rgba(var(--glr),.25)}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--glow-d),var(--glow));box-shadow:0 0 10px var(--glow);transition:width 1s cubic-bezier(.2,.9,.2,1)}

/* ---------- the character scene ---------- */
.scene{position:relative;height:310px;margin:0 -16px 12px;overflow:hidden;--rc:#8aa5c2}
.aglow{position:absolute;left:50%;bottom:36px;width:280px;height:280px;margin-left:-140px;border-radius:50%;background:radial-gradient(circle,var(--rc) 0,transparent 62%);opacity:.28;animation:aglow 3.2s ease-in-out infinite}
.ground{position:absolute;left:50%;bottom:-70px;width:340px;height:340px;margin-left:-170px;transform:perspective(520px) rotateX(74deg)}
.ground svg{width:100%;height:100%;animation:spin 26s linear infinite}
.ground circle{fill:none;stroke:var(--rc);stroke-width:2;opacity:.7}
.ground .r1{stroke-dasharray:6 10}.ground .r2{stroke-dasharray:2 6;opacity:.5}.ground .r3{stroke-width:3;opacity:.9}
.hero-av{position:absolute;left:50%;bottom:30px;width:132px;height:182px;margin-left:-66px;animation:idle 3.4s ease-in-out infinite;transform-origin:50% 100%}
.army{position:absolute;left:50%;bottom:30px;width:0;height:0}
.sold{position:absolute;left:0;bottom:var(--b);width:calc(130px*var(--s));height:auto;margin-left:calc(var(--x) - 65px*var(--s));fill:#050a14;stroke:var(--rc);stroke-width:2;stroke-opacity:.5;opacity:.85;animation:flick 3s ease-in-out infinite;animation-delay:var(--d)}
.sold .se{fill:var(--rc);stroke:none}
.s-top{position:absolute;left:16px;right:16px;top:6px;display:flex;align-items:center;gap:12px}
.rbadge{position:relative;width:52px;height:58px;flex:none;display:grid;place-items:center}
.rbadge svg{position:absolute;inset:0;width:100%;height:100%}
.rbadge b{position:relative;font:700 30px var(--display);text-shadow:0 0 14px currentColor}
.who{flex:1;min-width:0}
.who b{display:block;font:700 22px var(--display);letter-spacing:.16em}
.who span{font:600 12px var(--display);letter-spacing:.22em;color:var(--glow)}
.aur{text-align:right}
.aur b{display:block;font:700 30px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(245,196,81,.5)}
.aur span{font:700 11px var(--display);letter-spacing:.28em;color:var(--mute)}
.fatb{position:absolute;left:16px;right:16px;top:70px;padding:8px 12px;border:1px solid var(--red);background:rgba(60,8,16,.82);border-radius:4px;animation:alert 1.6s ease-in-out infinite}
.fatb b{display:block;font:700 14px var(--display);letter-spacing:.3em;color:var(--red)}
.fatb span{font-size:12px;color:var(--fg)}
.s-bot{position:absolute;left:16px;right:16px;bottom:6px}
.xpt{font:600 11px var(--display);letter-spacing:.14em;color:var(--mute);margin-top:4px;text-align:center}
.scene.fat .hero-av{filter:grayscale(.9) brightness(.62);animation:slump 5s ease-in-out infinite}
.scene.fat .aglow{background:radial-gradient(circle,var(--red) 0,transparent 62%);opacity:.22}
.scene.fat .ground{opacity:.3}
.scene.fat .sold{opacity:.4}
.goalchip{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(90deg,rgba(245,196,81,.14),rgba(245,196,81,.03));border:1px solid rgba(245,196,81,.5);border-radius:4px;text-align:left}
.goalchip span{font:700 13px var(--display);letter-spacing:.2em;color:var(--gold)}
.goalchip b{flex:1;text-align:right;font:700 16px var(--display);letter-spacing:.06em}
.goalchip i{font-style:normal;font-size:22px;color:var(--gold)}

/* rings */
.ringrow{display:flex;align-items:center;gap:16px;padding:14px}
.rings{position:relative;width:128px;height:128px;flex:none}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--panel2);stroke-width:9}
.arc{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.2,1),stroke .4s;filter:drop-shadow(0 0 4px currentColor)}
.arc.k{stroke:var(--glow);color:var(--glow)} .arc.k.over{stroke:var(--red);color:var(--red)}
.arc.p{stroke:var(--violet);color:var(--violet)} .arc.p.full{stroke:var(--green);color:var(--green)}
.rings.pulse{animation:pulse .7s ease-out}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.rc span{font:600 10px var(--display);letter-spacing:.18em;color:var(--mute);margin-top:2px}
.rl{flex:1;min-width:0;font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.rl b{color:var(--fg);font:700 18px var(--display);letter-spacing:.04em}
.rl .k{color:var(--glow)} .rl .p{color:var(--violet)}
.rl small{font-size:12px}

/* quests */
.qrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:transparent;border:0;border-top:1px solid rgba(var(--glr),.14);text-align:left;position:relative;animation:rise .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 250ms)}
.wt+.qrow{border-top:0}
.qrow:active{background:rgba(var(--glr),.1)}
.qic{width:42px;height:42px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--glow);flex:none;background:rgba(var(--glr),.06)}
.qic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qm{flex:1;min-width:0;display:block}
.qt{display:block;font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
.qs{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr{font:700 15px var(--display);color:var(--gold);letter-spacing:.06em;flex:none}
.qrow.done .qic{background:var(--glow);color:#02101f;border-color:var(--glow);box-shadow:0 0 14px rgba(var(--glr),.6)}
.qrow.done .qt{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(138,165,194,.5)}
.qrow.done .qr{color:var(--glow)}
.qrow.miss .qic{background:var(--red-d);border-color:var(--red);color:#fff}
.qrow.miss .qr{color:var(--red)}
.qrow.late,.qrow.skip{opacity:.6}
.qrow.next{background:linear-gradient(90deg,rgba(var(--glr),.22),rgba(var(--glr),.02))}
.qrow.next::after{content:"";position:absolute;inset:0;pointer-events:none;animation:nextglow 2s ease-in-out infinite}
.qrow.next .qic{border-color:var(--glow);box-shadow:0 0 14px rgba(var(--glr),.55)}
.qrow.next .qr::before{content:"\25B6";color:var(--glow);margin-right:8px;display:inline-block;animation:nudge 1s ease-in-out infinite}
.qrow.just .qic{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}

/* buttons */
.btn{display:block;width:100%;border:1px solid var(--glow);border-radius:6px;padding:15px;background:linear-gradient(180deg,rgba(var(--glr),.28),rgba(var(--glr),.12));color:var(--fg);font:700 18px var(--display);letter-spacing:.2em;text-transform:uppercase;box-shadow:0 0 18px rgba(var(--glr),.25);transition:transform .08s;text-align:center;text-decoration:none}
.btn:active{transform:scale(.97);background:rgba(var(--glr),.4)}
.btn.good{border-color:var(--green);background:linear-gradient(180deg,rgba(61,220,151,.26),rgba(61,220,151,.1));box-shadow:0 0 18px rgba(61,220,151,.22)}
.btn.vio{border-color:var(--violet);background:linear-gradient(180deg,rgba(var(--acr),.3),rgba(var(--acr),.1));box-shadow:0 0 18px rgba(var(--acr),.25)}
.btn.ghost{border-color:var(--line);background:var(--panel2);box-shadow:none}
.btn.bad{border-color:var(--red-d);background:transparent;color:var(--red);box-shadow:none}
.stack2{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lnk{margin-top:12px;font-size:15px;letter-spacing:.12em}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92%;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(var(--glr),.2);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.95,.25,1);z-index:30;padding-bottom:var(--sab)}
#sheet.full{height:calc(100% - 10px);max-height:none}
#sheet.on{transform:none}
.shh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;gap:10px}
.shh h2{margin:0;font:700 22px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--glow)}
.x{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:22px;line-height:1;color:var(--mute)}
#shBody{overflow-y:auto;padding:4px 16px 14px;flex:1;min-height:0}
#shBody.col{display:flex;flex-direction:column;overflow:hidden;padding:0}
#shFoot{padding:10px 16px 14px;border-top:1px solid rgba(var(--glr),.2);display:flex;flex-direction:column;gap:8px}
#shFoot[hidden]{display:none}
.hint{color:var(--mute);font-size:14px;margin:2px 0 12px}
.sec{font:700 13px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.warn{background:rgba(255,77,94,.1);border:1px solid var(--red-d);border-radius:6px;padding:12px;font-size:14px;margin-top:12px}
.note{background:var(--panel2);border:1px solid rgba(var(--glr),.2);border-radius:6px;padding:12px;font-size:14px;color:var(--mute);margin-top:12px}
.small.pen{color:var(--red)}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;min-height:46px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 15px var(--body)}
.seg button[aria-pressed="true"]{border-color:var(--glow);background:rgba(var(--glr),.2);box-shadow:0 0 12px rgba(var(--glr),.3)}
.seg button[aria-pressed="true"].sharp{border-color:var(--red);background:rgba(255,77,94,.2)}
.stp{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(var(--glr),.14)}
.stp span small{display:block;color:var(--mute);font-size:12px}
.stp .c{display:flex;align-items:center;gap:8px}
.stp .c button{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.stp .c i{font:700 22px var(--display);font-style:normal;min-width:44px;text-align:center}
.est{margin-top:14px;text-align:center;font:700 26px var(--display);letter-spacing:.06em;color:var(--gold)}
.est small{display:block;font:400 12px var(--body);color:var(--mute);letter-spacing:0;margin-top:2px}
.wnum{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}
.wnum input{width:170px;text-align:center;height:84px;border:0;background:transparent;color:var(--fg);font:700 66px var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(var(--glr),.5)}
.wnum button{width:54px;height:54px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:26px}
.q{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(var(--glr),.14);font-weight:600}
.q span:last-child{font:700 17px var(--display);letter-spacing:.06em}
.q .ok{color:var(--green)} .q .no{color:var(--mute)}
.tg{display:flex;gap:6px;margin-top:8px}
.tg button{flex:1;min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--body)}
.tg button[aria-pressed="true"]{border-color:var(--glow);background:rgba(var(--glr),.2)}
textarea.ta{width:100%;min-height:240px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:12px;font:400 13px/1.5 var(--body);resize:vertical}

/* ---------- plate (food) ---------- */
.pl{display:flex;flex-direction:column;flex:1;min-height:0}
.stage{display:grid;grid-template-columns:1fr 152px 1fr;align-items:center;padding:0 10px}
.sd{text-align:center}
.sd b{display:block;font:700 30px/1 var(--display);color:var(--glow);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(var(--glr),.5)}
.sd.r b{color:var(--violet);text-shadow:0 0 14px rgba(var(--acr),.5)}
.sd span{display:block;font:700 10px var(--display);letter-spacing:.2em;color:var(--mute);margin-top:3px}
.sd em{display:block;font-style:normal;font-size:12px;color:var(--fg);margin-top:3px}
.pw{position:relative;width:152px;height:152px}
.pring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pring .trk{stroke-width:7}.pring .arc{stroke-width:7}
.disc{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#2d4170,#0c162b 72%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.07),0 8px 22px rgba(0,0,0,.7)}
.dempty{position:absolute;inset:0;display:grid;place-items:center;font:600 12px var(--display);letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.fd{position:absolute;left:50%;top:50%;translate:calc(-50% + var(--x)) calc(-50% + var(--y));line-height:1;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.fd.drop{animation:dropin .6s cubic-bezier(.2,1.6,.4,1)}
.fd.sel{filter:drop-shadow(0 0 8px var(--glow)) drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.more{position:absolute;right:6px;bottom:8px;font:700 13px var(--display);color:var(--gold);font-style:normal}
.combo{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) scale(0);font:700 22px var(--display);letter-spacing:.14em;color:var(--gold);white-space:nowrap;opacity:0;text-shadow:0 0 14px rgba(245,196,81,.7)}
.combo.on{animation:comboin .55s cubic-bezier(.2,1.6,.4,1) forwards}
.plate{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none;align-items:center}
.plate:empty{display:none}
.plate::-webkit-scrollbar{display:none}
.plate .empty{color:var(--mute);font-size:14px}
.pc{flex:none;min-height:40px;padding:8px 12px;border-radius:6px;border:1px solid var(--glow);background:rgba(var(--glr),.14);font-weight:600;font-size:14px;white-space:nowrap}
.pc small{color:var(--mute);margin-left:6px;font-weight:500}
.pc.sel{background:rgba(var(--glr),.4);box-shadow:0 0 12px rgba(var(--glr),.5)}
.ed{margin:0 16px 8px;padding:12px;border:1px solid var(--glow);border-radius:6px;background:rgba(var(--glr),.08);animation:rise .35s cubic-bezier(.2,.9,.2,1)}
.edh{display:flex;justify-content:space-between;align-items:center;font:700 17px var(--display);letter-spacing:.1em;text-transform:uppercase}
.edh button{background:none;border:0;color:var(--mute);font-size:22px;width:44px;height:36px}
.gbigr{display:flex;align-items:baseline;justify-content:center;gap:6px}
.gbigr b{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(var(--glr),.6)}
.gbigr span{font:700 20px var(--display);color:var(--mute)}
.gbigr em{font-style:normal;font-size:13px;color:var(--gold);margin-left:8px}
.rw{position:relative;margin:4px -4px 0}
.ruler{display:flex;overflow-x:auto;height:62px;scrollbar-width:none;border-radius:4px;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent)}
.ruler::-webkit-scrollbar{display:none}
.ruler .sp{flex:none;width:50%}
.rin{position:relative;flex:none;width:1600px;height:100%;background-image:repeating-linear-gradient(90deg,rgba(138,165,194,.55) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--fg) 0 2px,transparent 2px 100px);background-size:100% 16px,100% 30px;background-repeat:no-repeat;background-position:0 0,-1px 0}
.rin b{position:absolute;top:34px;transform:translateX(-50%);font:600 12px var(--display);color:var(--mute)}
.needle{position:absolute;left:50%;top:0;bottom:6px;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 12px var(--gold);border-radius:2px;pointer-events:none}
.edq{display:flex;gap:6px;margin-top:10px}
.edq button{flex:1;height:42px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font:600 14px var(--body)}
.edq .del{border-color:var(--red-d);color:var(--red)}
.edi{margin-top:8px;color:var(--mute);font-size:13px}
.inrow{display:flex;gap:8px;padding:0 16px}
.inrow input{flex:1;min-width:0;height:48px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--fg);padding:0 12px;font:400 16px var(--body)}
.inrow button{width:72px;border-radius:6px;border:1px solid var(--glow);background:rgba(var(--glr),.25);font:700 16px var(--display);letter-spacing:.14em}
.sug{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.sug:empty{padding:0}
.sug::-webkit-scrollbar{display:none}
.rows{flex:1;min-height:0;overflow-y:auto;padding:6px 0 10px}
.rl2{margin-top:8px}
.rt{font:700 12px var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);padding:0 16px 3px}
.rt.pick{color:var(--gold)}
.tiles{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;scroll-snap-align:start;width:112px;min-height:84px;padding:7px 9px;text-align:left;border-radius:8px;border:1px solid var(--line);background:linear-gradient(180deg,var(--tile1),var(--tile2));transition:transform .1s,box-shadow .15s}
.tile:active{transform:scale(.92)}
.tile .te{display:block;font-size:24px;line-height:1.1}
.tile .tn{display:-webkit-box;font:600 13px/1.15 var(--body);overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:30px}
.tile .tk{display:block;margin-top:2px;font-size:11px;color:var(--mute)}
.tile.r-legend{border-color:var(--gold);box-shadow:0 0 14px rgba(245,196,81,.35)}
.tile.r-epic{border-color:#a678ff;box-shadow:0 0 10px rgba(166,120,255,.28)}
.tile.r-rare{border-color:#3aa8ff}
.tile.r-treat{border-color:#7a4352;border-style:dashed}
.tile.pickt{box-shadow:0 0 16px rgba(245,196,81,.5)}
.tile b{position:absolute;top:-7px;right:-4px;background:var(--glow);color:#02101f;border-radius:8px;min-width:24px;height:22px;padding:0 6px;font:700 14px/22px var(--display);text-align:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.orb{position:fixed;left:0;top:0;z-index:97;pointer-events:none;font:700 16px var(--display);padding:3px 10px;border-radius:14px;background:rgba(10,20,40,.92);border:1px solid var(--glow);color:var(--fg);will-change:transform;opacity:0}
.orb.em{background:none;border:0;padding:0;font-size:34px}
.orb.p{border-color:var(--violet);color:var(--violet)}.orb.k{border-color:var(--glow);color:var(--glow)}

/* ---------- workout ---------- */
.lh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lh .xp{flex:1}.lh span{font:700 14px var(--display);letter-spacing:.14em;color:var(--mute)}
.ex{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:rgba(var(--p2r),.6)}
.ex.fin{border-color:var(--green);box-shadow:0 0 14px rgba(61,220,151,.2)}
.exh{display:flex;align-items:center;gap:10px}
.exe{font-size:24px}
.exn{flex:1;min-width:0}
.exn b{display:block;font:700 17px var(--display);letter-spacing:.06em;text-transform:uppercase}
.exn small{color:var(--mute);font-size:12px}
.exb{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-size:18px}
.exb[aria-pressed="true"]{border-color:var(--glow);background:rgba(var(--glr),.2)}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sb{flex:1 0 56px;min-height:58px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s}
.sb b{font:700 22px/1 var(--display)}
.sb small{font-size:11px;color:var(--mute)}
.sb:active{transform:scale(.92)}
.sb.done{background:linear-gradient(180deg,rgba(61,220,151,.35),rgba(61,220,151,.14));border-color:var(--green);box-shadow:0 0 14px rgba(61,220,151,.35)}
.sb.pop{animation:pop .5s cubic-bezier(.2,1.7,.4,1)}
.capw{margin-top:8px;padding:8px 10px;font-size:13px}
.exe2{margin-top:6px}
.rest{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--violet);border-radius:6px;background:rgba(var(--acr),.12)}
.rest[hidden]{display:none}
.rest svg{width:34px;height:34px;transform:rotate(-90deg)}
.rest .trk{stroke-width:5}.rest .arc{stroke-width:5;stroke-dashoffset:0}
.rest b{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.rest span{flex:1;color:var(--mute);font:600 12px var(--display);letter-spacing:.2em;text-transform:uppercase}
.rest button{min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}

/* ---------- rehab ---------- */
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;background:none;border:0;border-bottom:1px solid rgba(var(--glr),.14);text-align:left}
.chk i{width:28px;height:28px;border:1.5px solid var(--line);border-radius:5px;flex:none;display:grid;place-items:center;font-style:normal;color:transparent;transition:all .2s}
.chk[aria-pressed="true"] i{background:var(--glow);border-color:var(--glow);color:#02101f;box-shadow:0 0 10px rgba(var(--glr),.6)}
.chk span{flex:1;min-width:0}
.chk small{display:block;color:var(--mute);font-size:12px}
.rx.skipd .chk span{text-decoration:line-through;color:var(--mute)}
.rxf{padding:4px 0 10px;border-bottom:1px solid rgba(var(--glr),.14)}
svg.fig{display:block;margin:0 auto;height:118px;width:auto;max-width:100%;background:radial-gradient(ellipse at 50% 100%,rgba(var(--glr),.12),transparent 70%);border-radius:6px}
.fg-floor{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4}
.fg-limb{fill:none;stroke:var(--glow);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--glow))}
.fg-limb.far{opacity:.4;filter:none}
.fg-torso{stroke:var(--fg);stroke-width:7;stroke-linecap:round}
.fg-head{fill:var(--panel2);stroke:var(--fg);stroke-width:3}
.fg-prop{stroke:var(--mute);stroke-width:2;fill:none}.fg-prop.fill{fill:rgba(138,165,194,.25)}
.fg-ball{fill:rgba(var(--acr),.18);stroke:var(--violet);stroke-width:2}
.fg-band{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 3}
.fg-bar{stroke:var(--mute);stroke-width:3;stroke-linecap:round}
.fg-plate{fill:var(--gold);stroke:var(--bg);stroke-width:1}.fg-plate.dim{opacity:.7}
.fg-pillow{fill:var(--gold);opacity:.8}.fg-eye{stroke:var(--fg);stroke-width:1.5}.fg-dot{fill:var(--fg)}
.rng{width:100%;margin:8px 0 2px;accent-color:var(--glow)}
.rngl{display:flex;justify-content:space-between;font:600 14px var(--display);letter-spacing:.12em;color:var(--mute)}
.rngl b{color:var(--fg);font-size:18px}
.light{margin-top:12px;padding:10px 12px;border-radius:6px;font:700 14px var(--display);letter-spacing:.1em;border:1px solid}
.light.green{color:var(--green);border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.08)}
.light.amber{color:var(--amber);border-color:rgba(255,178,61,.5);background:rgba(255,178,61,.08)}

/* pick a line; stable for the same event on the same minute so a re-render does not flicker */
HS.say=function(group,key,roastLevel,ctx){
  let bank;
  if(group==='roast'){
    if(roastLevel==='off')return '';
    bank=(HS.VOICE.roast[roastLevel]||HS.VOICE.roast.playful)[key];
  }else bank=HS.VOICE[group]&&HS.VOICE[group][key];
  if(!bank||!bank.length)return '';
  const seed=(ctx&&ctx.seed!=null)?ctx.seed:Math.floor(Math.random()*bank.length);
  let s=bank[seed%bank.length];
  if(ctx&&ctx.n!=null)s=s.replace('{n}',ctx.n);
  return s;
};

<script>
/* figures.js: simplified stick-figure movement outlines for the rehab exercises.
   Each exercise is two key poses (a, b) that the animator eases between. Limbs are solved with two-bone IK from foot and hand targets,
   so poses are authored as "where the pelvis, feet and hands are". These are movement outlines only, never technique advice. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const FLOOR=124;

function ik(a,b,l1,l2,s){
  let dx=b[0]-a[0],dy=b[1]-a[1];const d0=Math.hypot(dx,dy)||.001;
  const d=Math.min(d0,l1+l2-.01),ux=dx/d0,uy=dy/d0;
  const aa=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-aa*aa));
  const end=[a[0]+ux*d,a[1]+uy*d];
  return{mid:[a[0]+ux*aa+s*h*(-uy),a[1]+uy*aa+s*h*ux],end:end};
}
const rad=d=>d*Math.PI/180;
function solve(P){
  const t=P.t||0,pel=P.p;
  const neck=[pel[0]+Math.sin(rad(t))*34,pel[1]-Math.cos(rad(t))*34];
  const head=[neck[0]+Math.sin(rad(t))*11,neck[1]-Math.cos(rad(t))*11];
  const f1=P.f,f2=P.f2||P.f;
  const l1=ik(pel,f1,30,30,P.kb==null?-1:P.kb),l2=ik(pel,f2,30,30,P.kb2==null?(P.kb==null?-1:P.kb):P.kb2);
  const h1=P.h||[neck[0],neck[1]+40],h2=P.h2||h1;
  const a1=ik(neck,h1,20,20,P.eb==null?1:P.eb),a2=ik(neck,h2,20,20,P.eb==null?1:P.eb);
  const toe=a=>[a[0]+10,Math.min(FLOOR,a[1]+6)];
  return{pel:pel,neck:neck,head:head,l1:l1,l2:l2,a1:a1,a2:a2,toe1:toe(l1.end),toe2:toe(l2.end)};
}

function lerpPose(a,b,u){
  const o={};
  Object.keys(a).forEach(k=>{

    if(typeof x==='number'&&typeof y==='number')o[k]=x+(y-x)*u;
    else if(Array.isArray(x)&&Array.isArray(y)&&typeof x[0]==='number')o[k]=x.map((v,i)=>v+(y[i]-v)*u);
    else o[k]=x;
  });

  return o;
}

/* one shared animation loop for every figure on screen */
let last=0;
function tick(ts){
  if(ts-last>33){

    const u=(1-Math.cos(ts/2600*Math.PI*2))/2;
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const els=document.querySelectorAll('svg.fig');
    for(let i=0;i<els.length;i++){
      const el=els[i],r=el.getBoundingClientRect();

      el.innerHTML=frame(el.dataset.fig,reduce?.5:u);
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
HS.frame=frame;

<script>
/* engine.js: state, nutrition math, aura/level/stats, fatigue and penalties, workouts. No DOM access here; the UI listens to events. */
(function(){
'use strict';
const HS=window.HS=window.HS||{};
const E=HS.E={};

/* ---- tiny event bus: the UI and sound layer subscribe, the engine only emits ---- */
const bus={};
E.on=(n,f)=>{(bus[n]=bus[n]||[]).push(f)};

/* ---- state ---- */
const KEY='habitsync.proto.v4';   /* same key as before, so existing data keeps working; the schema version lives inside */
const SCHEMA=5;
/* The day does not end at midnight: it ends at cfg.dayStart (3 am by default), so clearing the day at 1 am still belongs to yesterday. */
let SHIFT=0;
E.setShift=h=>{SHIFT=Math.max(0,Math.min(6,+h||0))};
E.now=()=>SHIFT?new Date(Date.now()-SHIFT*36e5):new Date();
const dkey=E.dkey=(d)=>{d=d||E.now();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const CFG0={name:'PLAYER',kcal:2050,protein:140,goalW:70,gateStep:.5,bossEvery:4,stepGoal:0,strict:'standard',theme:'auto',volume:.8,haptics:true,sound:true,contract:'',partner:'',
  height:166,age:21,deficit:530,water:3000,roast:'playful',camp:true,autoKcal:true,dayStart:3};
const clone=o=>JSON.parse(JSON.stringify(o));
const blank=()=>({v:SCHEMA,cfg:Object.assign({},CFG0),aura:0,stats:{STR:0,VIT:0,AGI:0,SNS:0},startW:84,start:dkey(),weights:{},gates:[],gateDates:{},cycle:{a:dkey(),i:0},cycles:[{a:dkey(),i:0}],passUsed:{},days:{},custom:{},
  rehab:{confirmed:false,next:0},routine:clone(HS.ROUTINE_DEFAULT),last:{},pr:{},fatigue:null,pass:{wk:'',used:false},missStreak:0,swept:{},
  equip:Object.assign({},HS.EQUIP_DEFAULT),owned:{},realm:'r1',realmSeen:1,claimed:{},counters:{pr:0,comeback:0,goals:0,bonus:0},prWeeks:{},camp:null,bestStreak:0,
  lastBackup:0,lastAutoBak:'',reviewSeen:'',welcomed:false,newItems:[],health:{on:false,last:0},remind:{on:false}});
/* bring any saved state up to the current schema without losing anything */
const DAY0=()=>({items:[],done:{},skip:{},workout:null,pain:null,burn:0,mins:null,runFree:null,reh:null,lift:{},weighed:false,pAward:false,closed:false,calOk:false,delta:0,sugarPen:0,score:0,steps:'',stepsAward:false,water:0,waterHit:false,sleep:null,chest:null});
const kindOf=v=>v===null?'null':Array.isArray(v)?'array':typeof v;
function migrate(p){
  const d=blank(),st=Object.assign({},d,(p&&typeof p==='object')?p:{});
  /* a saved field that is missing, null or the wrong kind of thing falls back to its default, so an old or damaged save cannot crash a screen */
  Object.keys(d).forEach(k=>{if(d[k]!==null&&kindOf(st[k])!==kindOf(d[k]))st[k]=d[k]});
  st.cfg=Object.assign({},CFG0,st.cfg);
  if(!p||(p.v||4)<5){
    if(st.cfg.goalW===75)st.cfg.goalW=70;   /* the goal is 70 kg */
    if(st.cfg.theme==='shadow')st.cfg.theme='auto';   /* follow the realm */
    st.v=SCHEMA;
  }
  ['equip','stats','counters','health','remind','rehab','pass','cycle'].forEach(k=>{st[k]=Object.assign({},d[k],st[k])});
  st.equip=Object.assign({},HS.EQUIP_DEFAULT,st.equip);

  if(!Array.isArray(st.cycles)||!st.cycles.length||!st.cycles.every(c=>c&&typeof c.a==='string'&&typeof c.i==='number'))st.cycles=[Object.assign({},st.cycle)];
  st.cycles.sort((a,b)=>a.a<b.a?-1:a.a>b.a?1:0);
  st.cycle=Object.assign({},st.cycles[st.cycles.length-1]);
  if(st.pass&&st.pass.used&&st.pass.wk&&!st.passUsed[st.pass.wk])st.passUsed[st.pass.wk]=1;
  ['Push','Pull','Legs'].forEach(t=>{if(!Array.isArray(st.routine[t]))st.routine[t]=clone(HS.ROUTINE_DEFAULT[t])});
  Object.keys(st.days).forEach(k=>{
    const x=st.days[k];
    if(!x||typeof x!=='object'||Array.isArray(x)){delete st.days[k];return}
    const z=DAY0();
    Object.keys(z).forEach(f=>{if(x[f]===undefined||(x[f]===null&&z[f]!==null)||(z[f]!==null&&typeof z[f]==='object'&&kindOf(x[f])!==kindOf(z[f])))x[f]=z[f]});

}
let S=blank(),mem=null;
const readable=t=>{try{JSON.parse(t);return true}catch(e){return false}};
(function load(){
  let r=null;
  try{r=localStorage.getItem(KEY)}catch(e){}
  if(r){
    try{S=migrate(JSON.parse(r));return}
    catch(e){
      /* the save could not be read: keep the raw text aside and fall back to yesterday's automatic copy if there is one */
      try{localStorage.setItem(KEY+'.unreadable',r)}catch(_){}
      E.unreadable=true;
      let bak=null;try{bak=localStorage.getItem(KEY+'.bak')}catch(_){}
      if(bak){try{S=migrate(JSON.parse(bak));E.recovered=true;return}catch(_){}}
    }
  }
  if(mem)S=mem;
})();
E.setShift(S.cfg.dayStart);
E.blank=blank;E.migrate=migrate;E.KEY=KEY;E._set=function(x){S=x;E.setShift(S.cfg.dayStart)};
E.S=()=>S;
let warned=false;
E.persist=function(){
  mem=S;
  const today=dkey();
  if(S.lastAutoBak!==today){
    /* once a day the previous save becomes the automatic copy, unless it cannot be read: then the older good copy stays */
    try{const prev=localStorage.getItem(KEY);if(prev&&readable(prev))localStorage.setItem(KEY+'.bak',prev)}catch(e){}
    S.lastAutoBak=today;
  }
  try{localStorage.setItem(KEY,JSON.stringify(S));warned=false}
  catch(e){if(!warned){warned=true;E.emit('storagefail')}}
};
/* a second copy of the app (installed app plus a browser tab) must not overwrite this one with stale data: adopt what the other copy saved */
try{window.addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue)return;
  try{S=migrate(JSON.parse(e.newValue));E.setShift(S.cfg.dayStart);E.emit('external')}catch(_){}
})}catch(_){}
/* before anything destructive, a real save is kept aside once under .undo. It is never rotated, and an empty state never replaces it. */
E.snapshot=function(){
  try{
    const has=Object.keys(S.weights).length>0||S.aura>0||Object.keys(S.days).length>2;
    if(has)localStorage.setItem(KEY+'.undo',JSON.stringify(S));
  }catch(e){}
};
E.undoInfo=function(){
  try{const t=localStorage.getItem(KEY+'.undo');if(!t)return null;const o=JSON.parse(t);return{days:Object.keys(o.days||{}).length,aura:o.aura||0}}catch(e){return null}
};
E.undoLast=function(){
  let t=null;try{t=localStorage.getItem(KEY+'.undo')}catch(e){}
  if(!t)throw new Error('There is nothing to undo.');
  const st=migrate(JSON.parse(t));
  E.snapshot();S=st;E.setShift(S.cfg.dayStart);E.ensureOwned&&E.ensureOwned();E.persist();E.emit('reset');
  return Object.keys(S.days).length;
};
E.save=function(){E.persist();if(E.afterSave)E.afterSave()};
E.reset=function(){E.snapshot();S=blank();E.setShift(S.cfg.dayStart);E.ensureOwned&&E.ensureOwned();E.save();E.emit('reset')};
E.cfg=()=>S.cfg;
E.T=function(){
  const camp=E.campInfo&&E.campInfo();
  if(camp)return{kcal:camp.kcal,protein:S.cfg.protein,lo:Math.round(camp.kcal*.92/10)*10,hi:Math.round(camp.kcal*1.06/10)*10,camp:true};
  const k=S.cfg.kcal;return{kcal:k,protein:S.cfg.protein,lo:Math.round(k*.855/10)*10,hi:Math.round(k*1.05/10)*10};
};

/* ---- dates ---- */
E.daysBetween=function(a,b){const f=s=>{const x=s.split('-').map(Number);return Date.UTC(x[0],x[1]-1,x[2])/864e5};return Math.round(f(b)-f(a))};
E.di=()=>(E.now().getDay()+6)%7;
/* minutes since midnight of the current (shifted) day; past midnight but before the day ends this is above 1440 */
E.nowMin=()=>{const n=new Date(),sh=E.now();return n.getHours()*60+n.getMinutes()+(dkey(n)===dkey(sh)?0:1440)};   /* wall-clock minutes, so a daylight-saving change cannot shift them */
function weekKey(){const d=E.now();d.setDate(d.getDate()-E.di());return dkey(d)}
E.weekKey=weekKey;

/* ---- days ---- */
E.day=function(k){k=k||dkey();return S.days[k]||(S.days[k]=DAY0())};
const SEQ=['Push','Pull','Legs','Push','Pull','Legs','Rest'];
/* each correction starts a new anchor from that day; days before it keep the plan they had */
const anchorFor=k=>{let a=S.cycles[0];for(let i=0;i<S.cycles.length;i++){if(S.cycles[i].a<=k)a=S.cycles[i];else break}return a};
E.planFor=function(k){k=k||dkey();const a=anchorFor(k);return SEQ[(((a.i+E.daysBetween(a.a,k))%7)+7)%7]};
E.setSession=function(type){
  const k=dkey(),a=anchorFor(k),c=(((a.i+E.daysBetween(a.a,k))%7)+7)%7;
  if(SEQ[c]===type)return;
  for(let j=0;j<7;j++){
    const x=(c+j)%7;
    if(SEQ[x]===type){
      const ix=S.cycles.findIndex(q=>q.a===k);
      if(ix>=0)S.cycles[ix]={a:k,i:x};else S.cycles.push({a:k,i:x});
      S.cycles.sort((p,q)=>p.a<q.a?-1:p.a>q.a?1:0);
      S.cycle=Object.assign({},S.cycles[S.cycles.length-1]);
      break;
    }
  }
};

/* ---- nutrition ---- */
E.food=n=>HS.DB[n]||S.custom[n];
E.nut=(f,g)=>({k:f.k100*g/100,p:f.p100*g/100});
E.totals=function(d){if(d.compact&&d.sum)return d.sum;let k=0,p=0;d.items.forEach(i=>{const f=E.food(i.name);if(f){const n=E.nut(f,i.g);k+=n.k;p+=n.p}});return{k:k,p:p}};
E.mealKcal=function(d,m){let k=0;d.items.forEach(i=>{if(i.meal===m){const f=E.food(i.name);if(f)k+=E.nut(f,i.g).k}});return k};
E.units=(f,g)=>Math.round(g/f.ug*10)/10;
E.poolFor=function(meal){return Array.from(new Set(HS.menuFor(meal,E.di()).concat(HS.STAPLES)))};
E.picks=function(meal){
  const d=E.day(),t=E.totals(d),T=E.T(),rK=T.kcal-t.k;
  if(t.p>=T.protein)return[];
  return E.poolFor(meal).map(E.food).filter(f=>f&&!f.sugar&&!f.out&&f.p>=10&&f.kcal<=Math.max(150,rK*.5)).sort((a,b)=>b.p/b.kcal-a.p/a.kcal).slice(0,3).map(f=>f.name);
};
const NUMW={half:.5,one:1,two:2,three:3,four:4,five:5};
E.scoreFoods=function(q,meal){
  q=q.toLowerCase().trim();if(!q)return[];
  const qs=[q];if(q.endsWith('es'))qs.push(q.slice(0,-2));if(q.endsWith('s'))qs.push(q.slice(0,-1));
  const menu=new Set(E.poolFor(meal));const out=[];
  Object.values(HS.DB).concat(Object.values(S.custom)).forEach(f=>{const n=f.name.toLowerCase();let best=-1;
    qs.forEach(x=>{const tk=x.split(/\s+/);if(tk.every(t=>n.includes(t))){const s=(menu.has(f.name)?100:0)+(n.startsWith(x)?20:0)+(n.split(/\W+/).includes(x)?10:0)-n.length/50;if(s>best)best=s}});
    if(best>-1)out.push({f:f,s:best})});
  return out.sort((a,b)=>b.s-a.s).map(o=>o.f);
};
/* "2 chapati", "rice 200g", "chicken 150", "momos 350 kcal" */
E.parsePart=function(p){
  p=p.trim();if(!p)return null;
  let g=null,units=null,kc=null,tn=null;
  const m=p.match(/(\d+(?:\.\d+)?)\s*(kg|gms|gm|grams|gram|g)\b/i);
  if(m){g=parseFloat(m[1])*(m[2].toLowerCase()==='kg'?1000:1);p=p.replace(m[0],' ')}
  const k=p.match(/(\d{2,4})\s*(?:kcal|cal)\b/i);
  if(k){kc=+k[1];p=p.replace(k[0],' ')}
  p=p.replace(/\bof\b/i,' ').replace(/\s+/g,' ').trim();
  if(g===null&&kc===null){
    const n=p.match(/^(\d+(?:\.\d+)?|half|one|two|three|four|five)\s*(?:x\s*)?(.*)$/i);
    if(n&&n[2]){units=isNaN(n[1])?NUMW[n[1].toLowerCase()]:parseFloat(n[1]);p=n[2]}
    else{const t=p.match(/^(.*?)\s+(\d{2,4})$/);if(t){tn=+t[2];p=t[1]}}
  }
  return{name:p.trim(),g:g,units:units,kc:kc,tn:tn};
};
/* add a food to the plate. Returns details so the UI can animate; the sound layer reacts to the 'add' event. */
E.addFood=function(name,grams,meal){
  const f=E.food(name);if(!f)return null;
  const d=E.day(),T=E.T(),g=grams||f.ug;
  const ex=d.items.find(i=>i.name===name&&i.meal===meal);
  if(ex)ex.g=Math.round((ex.g+g)*10)/10;else d.items.push({name:name,meal:meal,g:g});
  const k=E.nut(f,g).k;let pen=0;
  if(f.sugar){pen=Math.min(10,20-d.sugarPen);if(pen>0){d.sugarPen+=pen;E.addAura(-pen)}else pen=0}
  E.save();
  const proteinHit=E.checkProtein();
  E.emit('add',{food:f,grams:g,kcal:k,pct:Math.round(k/T.kcal*100),pen:pen,proteinHit:proteinHit});
  return{food:f,kcal:k,pen:pen};
};
E.removeItem=function(ix){
  const d=E.day(),it=d.items[ix];if(!it)return;
  const f=E.food(it.name);
  if(f&&f.sugar&&d.sugarPen>0){const r=Math.min(10,d.sugarPen);d.sugarPen-=r;S.aura+=r;d.delta+=r}
  d.items.splice(ix,1);E.save();E.emit('remove',{food:f});

E.customFood=function(name,kcal){
  const f=HS.mkFood(name,kcal,0,'serving','o');f.custom=true;f.p100=0;S.custom[name]=f;return f;
};
E.checkProtein=function(){
  const d=E.day();if(d.pAward)return false;
  if(E.totals(d).p>=E.T().protein){d.pAward=true;E.addAura(60);E.stat('VIT',2);E.emit('protein');E.save();return true}

/* ---- weight, gates, journey ---- */
E.trend=function(){let t=S.startW;Object.keys(S.weights).sort().forEach(k=>{t=t+.25*(S.weights[k]-t)});return Math.round(t*100)/100};
/* The ladder is anchored on the goal weight, so the last gate is always the goal even if the starting weight is 83.6 or 84.3. */
E.ladder=function(){
  const c=S.cfg,step=c.gateStep||.5,out=[],n=Math.max(0,Math.ceil((S.startW-c.goalW)/step-1e-9)),base=c.goalW+n*step;
  for(let i=1;i<=n;i++){
    const kg=Math.round((c.goalW+(n-i)*step)*10)/10,q=(base-kg)/c.bossEvery;
    out.push({kg:kg,boss:i===n||(c.bossEvery>0&&Math.abs(q-Math.round(q))<1e-6)});
